<!--
  MÓDULO IMPORTAÇÕES (COMPRAS) — projeto separado do Painel Financeiro.
   • Arquivo independente: não altera nem depende do index.html.
   • Mesmo login e mesmo Supabase (config.js).
   • Tabelas do módulo: imp_fornecedores, imp_processos, imp_cambios, imp_creditos
     (criadas por MIGRACAO-IMPORTACOES-2026-11-25.sql). A tabela "importacoes" do financeiro não é tocada.
   • Fator de importação = (câmbios R$ + nacionalização R$) / FOB US$
   • Para criar uma sub-aba: acrescente um item em SUBABAS e uma função render.
-->
<script>
// tema igual ao do painel (localStorage 'painel-tema') e modo embutido (dentro da aba Importações)
(function () {
  var h = document.documentElement;
  function tema() { var t = 'auto'; try { t = localStorage.getItem('painel-tema') || 'auto'; } catch (e) {}
    h.classList.remove('tema-claro', 'tema-escuro'); if (t === 'claro') h.classList.add('tema-claro'); else if (t === 'escuro') h.classList.add('tema-escuro'); }
  tema(); addEventListener('storage', function (e) { if (e.key === 'painel-tema') tema(); });
  try { if (window.self !== window.top) h.classList.add('embutido'); } catch (e) { h.classList.add('embutido'); }
})();
</script>

<script>
'use strict';
// ======================= utilitários =======================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (d) => new Intl.NumberFormat('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const F0 = nf(0), F2 = nf(2), F4 = nf(4);
const R = v => v == null || isNaN(v) ? '—' : 'R$ ' + F2.format(v);
const R0 = v => v == null || isNaN(v) ? '—' : 'R$ ' + F0.format(v);
const U = v => v == null || isNaN(v) ? '—' : 'US$ ' + F2.format(v);
const U0 = v => v == null || isNaN(v) ? '—' : 'US$ ' + F0.format(v);
const TX = v => v == null || isNaN(v) ? '—' : F4.format(v);
const FT = v => v == null || isNaN(v) || !isFinite(v) ? '—' : nf(2).format(v);
const dm = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(2, 4) : '—';
const hojeISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const somaDias = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const dias = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const nz = v => Number(v) || 0;
// "1.234,56" → "1234.56" ; "5,2079" → "5.2079" ; "5.2079" → "5.2079"
const paraNum = t => { t = String(t || '').trim().replace(/\s|R\$|US\$/g, ''); return t.includes(',') ? t.replace(/\./g, '').replace(',', '.') : t; };

const CFG = window.PAINEL_CONFIG || {};
let sb = null;
const EMPRESAS = { 1: 'Feromax', 2: 'Supply' };
const est = {
  perfil: null, sub: null, demo: false,
  processos: [], cambios: [], creditos: [], fornecedores: {},
  filtro: { empresa: 0, status: 'aberto', busca: '', pais: '' },
  abertoId: null, ord: {}, aliquotas: {}, cambioRef: null,
  calc: null, produtos: {}, filtroProd: { busca: '', status: '' },
};

// ======================= regras do processo =======================
const NAC = [['frete_brl', 'Frete internacional (R$)'], ['ii', 'II'], ['ipi', 'IPI'], ['pis', 'PIS'], ['cofins', 'COFINS'], ['icms', 'ICMS'],
  ['sdas_afrmm_siscomex', 'SDAS / AFRMM / Siscomex'], ['armazenagem', 'Armazenagem'], ['despachante_valor', 'Despachante'],
  ['outras_despesas', 'Outras despesas'], ['frete_nacional', 'Frete nacional']];
const CPS = [['producao', 'Início da produção'], ['saida', 'Saída do fornecedor'], ['embarque', 'Embarque (ETD)'],
  ['chegada', 'Chegada Brasil (ETA)'], ['numerario', 'Pagamento numerário'], ['estoque', 'Chegada no estoque']];

// pagamentos programados do processo: parcelas de câmbio (US$) e numerários / outros (R$)
const pagamentosDe = p => est.cambios.filter(c => c.processo_id === p.id).sort((a, b) => (a.ordem ?? 99) - (b.ordem ?? 99) || a.id - b.id);
const ehCambio = c => (c.tipo || 'Câmbio') === 'Câmbio';
const cambiosDe = p => pagamentosDe(p).filter(ehCambio);
// valor previsto em R$ de um pagamento em aberto (câmbio pela taxa de referência; numerário pelo valor informado)
const previstoBRL = (p, c) => ehCambio(c) ? (taxaAberta(p, c) ? nz(c.valor_usd) * taxaAberta(p, c) : null) : nz(c.valor_previsto_brl);

// ---- ordenação por coluna (clique no cabeçalho)
function ordenar(chave, linhas, cols, padrao) {
  const o = est.ord[chave] || padrao; if (!o) return linhas;
  const c = cols.find(x => x.id === o.col); if (!c || !c.v) return linhas;
  const m = o.dir === 'desc' ? -1 : 1;
  return [...linhas].sort((a, b) => {
    const x = c.v(a), y = c.v(b);
    const vx = x == null || x === '' || (typeof x === 'number' && isNaN(x)), vy = y == null || y === '' || (typeof y === 'number' && isNaN(y));
    if (vx && vy) return 0; if (vx) return 1; if (vy) return -1;
    return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'pt-BR', { numeric: true, sensitivity: 'base' })) * m;
  });
}
function cabecalho(chave, cols, padrao) {
  const o = est.ord[chave] || padrao || {};
  return '<tr>' + cols.map(c => c.v
    ? `<th class="ord ${c.cls || ''}" data-ordk="${chave}" data-ordc="${c.id}" title="Ordenar">${c.nome}<span class="seta">${o.col === c.id ? (o.dir === 'desc' ? '▼' : '▲') : ''}</span></th>`
    : `<th class="${c.cls || ''}">${c.nome}</th>`).join('') + '</tr>';
}
function ligarOrdenacao(el) {
  el.querySelectorAll('th[data-ordk]').forEach(th => th.onclick = ev => {
    ev.stopPropagation();
    const k = th.dataset.ordk, c = th.dataset.ordc, o = est.ord[k];
    est.ord[k] = { col: c, dir: o && o.col === c && o.dir === 'asc' ? 'desc' : 'asc' };
    redesenhar();
  });
}
const totalNac = p => NAC.reduce((s, [k]) => s + nz(p[k]), 0);
const temNac = p => !!p.data_di || NAC.some(([k]) => p[k] != null && p[k] !== 0);
// taxa usada para parcelas ainda não pagas: câmbio da DI; sem DI, a taxa prevista da parcela; depois a da estimativa; por fim o câmbio do painel
const taxaAberta = (p, c) => nz(p.cambio_di) || nz(c.taxa_di) || nz(p.estimativa && p.estimativa.premissas && p.estimativa.premissas.dolar_cambio) || nz(est.cambioRef) || null;

function resumo(p) {
  const cs = cambiosDe(p);
  const fob = nz(p.fob_usd) || cs.reduce((s, c) => s + nz(c.valor_usd), 0);
  let pagoBRL = 0, pagoUSD = 0, abertoUSD = 0, abertoBRL = 0, semTaxa = false, variacao = 0;
  for (const c of cs) {
    if (c.pago) {
      pagoBRL += nz(c.valor_brl); pagoUSD += nz(c.valor_usd);
      if (nz(p.cambio_di)) variacao += nz(c.valor_brl) - nz(c.valor_usd) * nz(p.cambio_di);
    } else {
      abertoUSD += nz(c.valor_usd);
      const t = taxaAberta(p, c); if (t) abertoBRL += nz(c.valor_usd) * t; else semTaxa = true;
    }
  }
  const nac = totalNac(p);
  const total = pagoBRL + abertoBRL + nac;
  let fator = null, tipoFator = '';
  if (p.status === 'fechado') { fator = fob ? total / fob : null; tipoFator = 'final'; }
  else if (temNac(p) && !semTaxa) { fator = fob ? total / fob : null; tipoFator = 'pré-fechamento'; }
  else if (p.fator_estimado) { fator = Number(p.fator_estimado); tipoFator = 'estimado'; }
  const conciliado = p.status === 'fechado' || (p.nac_conciliada && cs.length > 0 && cs.every(c => c.pago && c.conciliado));
  return { cs, fob, pagoBRL, pagoUSD, abertoUSD, abertoBRL, semTaxa, nac, total, fator, tipoFator, variacao, conciliado };
}

function etapa(p) {
  if (p.status === 'fechado') return { nome: 'Fechado', cls: 'ok' };
  const r = resumo(p);
  if (temNac(p)) return r.abertoUSD > 0 ? { nome: 'Nacionalizado · câmbio em aberto', cls: 'aviso' } : { nome: 'A fechar', cls: 'azul' };
  if (p.cp_chegada_ef) return { nome: 'Chegou', cls: 'azul' };
  if (p.cp_embarque_ef) return { nome: 'Em trânsito', cls: 'azul' };
  if (p.cp_saida_ef) return { nome: 'Aguardando embarque', cls: 'azul' };
  if (p.cp_producao_ef) return { nome: 'Em produção', cls: '' };
  return { nome: 'Pedido', cls: '' };
}

// próxima data relevante e se está atrasada
function proximoCheckpoint(p) {
  const hoje = hojeISO();
  for (const [k, nome] of CPS) {
    if (p[`cp_${k}_ef`]) continue;
    const prev = p[`cp_${k}_prev`];
    return { nome, prev, atraso: !!prev && prev < hoje };
  }
  return null;
}

const paisDe = p => (est.fornecedores[p.fornecedor] || {}).pais || '';
const podeEditar = () => !!est.perfil && (est.perfil.admin || (est.perfil.editor && (est.perfil.areas || []).includes('importacoes')));
const empresasVisiveis = () => est.perfil && !est.perfil.admin && Array.isArray(est.perfil.empresas)
  ? est.perfil.empresas.filter(e => EMPRESAS[e]) : [1, 2];

// ======================= SUB-ABAS =======================
const SUBABAS = [
  { id: 'geral', nome: 'Visão geral', render: renderGeral },
  { id: 'processos', nome: 'Processos', render: renderProcessos },
  { id: 'calculadora', nome: 'Calculadora aduaneira', render: renderCalculadora },
  { id: 'produtos', nome: 'Produtos (pesos e medidas)', render: renderProdutos },
];

function montarSubabas() {
  const nav = $('#subabas');
  nav.innerHTML = SUBABAS.map(s => `<button class="subaba" role="tab" data-sub="${s.id}">${esc(s.nome)}</button>`).join('');
  nav.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { est.abertoId = null; abrir(b.dataset.sub); });
  const [sub, id] = (location.hash || '').slice(1).split('/');
  if (id) est.abertoId = Number(id);
  abrir(SUBABAS.some(s => s.id === sub) ? sub : SUBABAS[0].id);
}

function abrir(id) {
  est.sub = id;
  history.replaceState(null, '', '#' + id + (est.abertoId ? '/' + est.abertoId : ''));
  document.querySelectorAll('[data-sub]').forEach(b => b.setAttribute('aria-selected', b.dataset.sub === id));
  redesenhar();
}
function redesenhar() {
  const s = SUBABAS.find(x => x.id === est.sub);
  try { s.render($('#conteudo')); }
  catch (e) { console.error(e); $('#conteudo').innerHTML = `<div class="card"><div class="vazio">Erro: ${esc(e.message)}</div></div>`; }
}
function abrirProcesso(id) { est.abertoId = id; abrir('processos'); window.scrollTo(0, 0); }

// ======================= Visão geral =======================

  const hoje = hojeISO(), ate30 = somaDias(hoje, 30);

  const abertos = procs.filter(p => p.status === 'aberto');

  for (const p of abertos) for (const c of pagamentosDe(p)) if (!c.pago) parcelas.push({ p, c, taxa: ehCambio(c) ? taxaAberta(p, c) : null, brl: previstoBRL(p, c) });
  const camb = parcelas.filter(x => ehCambio(x.c)), nums = parcelas.filter(x => !ehCambio(x.c));

    { id: 'etapa', nome: 'Etapa', v: x => x.e.nome }, { id: 'prox', nome: 'Próximo passo', v: x => x.prox && x.prox.prev },
    { id: 'cheg', nome: 'Chegada', v: x => x.cheg },
  ];

  const lCam = ordenar('gCam', caminho, colsCam, { col: 'cheg', dir: 'asc' });
  const lFec = ordenar('gFec', aFechar, colsFec, { col: 'di', dir: 'asc' });

  el.innerHTML = `${filtroEmpresa()}
  <div class="kpis">
    ${kpi('Processos em aberto', F0.format(abertos.length), `${caminho.length} a caminho · ${aFechar.length} nacionalizados`)}
    ${kpi('Câmbio a pagar', U0(totUSD), `≈ ${R0(camb.reduce((s, x) => s + nz(x.brl), 0))} pela taxa da DI / prevista`)}
    ${kpi('Câmbio próximos 30 dias', U0(p30.reduce((s, x) => s + nz(x.c.valor_usd), 0)), `${p30.length} parcela(s)` + (atrasadas.length ? ` · <span class="verm">${atrasadas.length} com data vencida</span>` : ''))}
    ${kpi('Numerários previstos', R0(nums.reduce((s, x) => s + nz(x.brl), 0)), `${nums.length} lançamento(s)`)}
    ${kpi('No fluxo de caixa', R0(noFluxo.reduce((s, x) => s + nz(x.brl), 0)), `${noFluxo.length} de ${parcelas.length} pagamentos em aberto`)}
    ${kpi('Crédito com fornecedores', U(totCred), creditos.length ? creditos.map(c => esc(c.fornecedor)).join(', ') : 'nenhum')}

    <div class="tabela-wrap"><table>

    </table></div>
  </div>
  <div class="grade2">
    <div class="card">
      <div class="topo"><h2>A caminho</h2><span class="nota">próximo checkpoint de cada processo</span></div>
      <div class="tabela-wrap"><table>
        <thead>${cabecalho('gCam', colsCam, { col: 'cheg', dir: 'asc' })}</thead>
        <tbody>${lCam.length ? lCam.map(({ p, prox, cheg, e }) => `<tr class="clic" data-p="${p.id}">
          <td>${esc(p.fornecedor)} <span class="nota">${esc(paisDe(p))}</span></td><td>${esc(p.pedido || '—')}</td>
          <td><span class="tag ${e.cls}">${e.nome}</span></td>
          <td>${prox ? `${esc(prox.nome)} <span class="${prox.atraso ? 'verm' : 'nota'}">${prox.prev ? dm(prox.prev) : 'sem data'}${prox.atraso ? ' · atrasado' : ''}</span>` : '—'}</td>
          <td class="d">${dm(cheg)}</td></tr>`).join('') : '<tr><td colspan="5" class="vazio">Nada a caminho.</td></tr>'}</tbody>
      </table></div>

    <tbody>${creditos.map(c => `<tr><td>${esc(c.fornecedor)}</td><td>${EMPRESAS[c.empresa] || c.empresa}</td><td class="d">${dm(c.data)}</td>
      <td class="n">${F2.format(nz(c.valor_usd))}</td><td class="n">${R(c.valor_brl)}</td><td>${esc(c.contrato || '—')}</td>

  ligarFiltroEmpresa(el);

// caixinha "No fluxo" de um pagamento em aberto (leva o valor ao Fluxo de caixa projetado do painel)
function chkFluxo(c, ed) {
  if (c.pago) return '<span class="nota">pago</span>';
  return `<label class="chk-fluxo" title="${c.data_prevista ? 'Levar ao Fluxo de caixa projetado' : 'Informe a data prevista para levar ao fluxo'}"><input type="checkbox" data-fluxo="${c.id}" ${c.no_fluxo ? 'checked' : ''} ${ed && c.data_prevista ? '' : 'disabled'}> No fluxo</label>`;
}
function ligarFluxo(el) {
  el.querySelectorAll('[data-fluxo]').forEach(i => i.onchange = async ev => {
    ev.stopPropagation();
    const c = est.cambios.find(x => x.id === Number(i.dataset.fluxo));
    try { await gravar('imp_cambios', { no_fluxo: i.checked }, c.id, c); } catch (_) { i.checked = !i.checked; }
  });
}

function kpi(rot, val, det) { return `<div class="kpi"><div class="rot">${rot}</div><div class="val">${val}</div><div class="det">${det || ''}</div></div>`; }
function filtroEmpresa() {
  const emps = empresasVisiveis();
  if (emps.length < 2) return '';
  return `<div class="filtros">${[[0, 'Todas'], ...emps.map(e => [e, EMPRESAS[e]])].map(([v, n]) =>
    `<button class="chip" data-emp="${v}" aria-pressed="${est.filtro.empresa === v}">${n}</button>`).join('')}</div>`;
}
function ligarFiltroEmpresa(el) {
  el.querySelectorAll('[data-emp]').forEach(b => b.onclick = () => { est.filtro.empresa = Number(b.dataset.emp); redesenhar(); });
}

// ======================= Processos (lista) =======================
function renderProcessos(el) {
  if (est.abertoId) {
    const p = est.processos.find(x => x.id === est.abertoId);
    if (p) return renderFicha(el, p);
    est.abertoId = null;
  }
  const f = est.filtro, emps = empresasVisiveis();
  const paises = [...new Set(est.processos.map(paisDe).filter(Boolean))].sort();
  const b = f.busca.trim().toLowerCase();
  const lista = est.processos.filter(p => emps.includes(p.empresa) && (!f.empresa || p.empresa === f.empresa)
    && (!f.status || p.status === f.status) && (!f.pais || paisDe(p) === f.pais)
    && (!b || [p.fornecedor, p.pedido, p.mercadoria, p.processo, p.di].some(x => String(x || '').toLowerCase().includes(b))))
    .sort((a, b) => (b.data_pedido || '') < (a.data_pedido || '') ? -1 : (b.data_pedido || '') > (a.data_pedido || '') ? 1 : b.id - a.id);
  const colsP = [
    { id: 'ped', nome: 'Pedido', v: x => x.p.pedido },
    { id: 'forn', nome: 'Fornecedor', v: x => x.p.fornecedor },
    { id: 'emp', nome: 'Empresa', v: x => EMPRESAS[x.p.empresa] },
    { id: 'merc', nome: 'Mercadoria', v: x => x.p.mercadoria },
    { id: 'modal', nome: 'Modal', v: x => x.p.modal },
    { id: 'etapa', nome: 'Etapa', v: x => x.e.nome },
    { id: 'dped', nome: 'Data pedido', v: x => x.p.data_pedido },
    { id: 'cheg', nome: 'Chegada', v: x => x.p.cp_chegada_ef || x.p.cp_chegada_prev || x.p.previsao_chegada },
    { id: 'fob', nome: 'FOB US$', cls: 'n', v: x => x.r.fob || null },
    { id: 'ab', nome: 'Câmbio aberto US$', cls: 'n', v: x => x.r.abertoUSD || null },
    { id: 'fest', nome: 'Fator est.', cls: 'n', v: x => x.p.fator_estimado != null ? Number(x.p.fator_estimado) : null },
    { id: 'fat', nome: 'Fator', cls: 'n', v: x => x.r.tipoFator === 'estimado' ? null : x.r.fator },
    { id: 'conc', nome: '' },
  ];
  const linhas = ordenar('proc', lista.map(p => ({ p, r: resumo(p), e: etapa(p) })), colsP, { col: 'dped', dir: 'desc' });
  const comFator = linhas.filter(x => x.r.fator && x.r.tipoFator !== 'estimado');
  const fobTot = linhas.reduce((s, x) => s + x.r.fob, 0);
  const totTot = comFator.reduce((s, x) => s + x.r.total, 0);
  const fobComFator = comFator.reduce((s, x) => s + x.r.fob, 0);

  el.innerHTML = `<div class="filtros">
    ${emps.length > 1 ? [[0, 'Todas'], ...emps.map(e => [e, EMPRESAS[e]])].map(([v, n]) => `<button class="chip" data-emp="${v}" aria-pressed="${f.empresa === v}">${n}</button>`).join('') + '<div class="sep"></div>' : ''}
    ${[['aberto', 'Em aberto'], ['fechado', 'Fechados'], ['', 'Todos']].map(([v, n]) => `<button class="chip" data-st="${v}" aria-pressed="${f.status === v}">${n}</button>`).join('')}
    <div class="sep"></div>
    <select class="sel" id="fPais"><option value="">Todos os países</option>${paises.map(x => `<option ${x === f.pais ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
    <input class="busca" id="fBusca" type="search" placeholder="Buscar fornecedor, pedido, mercadoria, DI…" value="${esc(f.busca)}">
    ${podeEditar() ? '<button class="btn-pri" id="btnNovo" style="margin-left:auto">+ Nova importação</button>' : ''}
  </div>
  <div class="card">
    <div class="topo"><h2>${lista.length} processo(s)</h2>
      <span class="nota">FOB ${U0(fobTot)}${fobComFator ? ` · fator médio ponderado ${FT(totTot / fobComFator)}` : ''} · clique no título da coluna para ordenar</span></div>
    <div class="tabela-wrap"><table>
      <thead>${cabecalho('proc', colsP, { col: 'dped', dir: 'desc' })}</thead>
      <tbody>${linhas.length ? linhas.map(({ p, r, e }) => `<tr class="clic" data-p="${p.id}">
        <td>${esc(p.pedido || '—')}</td>
        <td>${esc(p.fornecedor)} <span class="nota">${esc(paisDe(p))}</span></td>
        <td>${EMPRESAS[p.empresa] || p.empresa}</td>
        <td>${esc(p.mercadoria || '—')}</td><td>${esc(p.modal || '—')}</td>
        <td><span class="tag ${e.cls}">${e.nome}</span></td>

  busca.oninput = () => { f.busca = busca.value; clearTimeout(busca._t); busca._t = setTimeout(() => { redesenhar(); const i = $('#fBusca'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); };
  el.querySelectorAll('tr[data-p]').forEach(tr => tr.onclick = () => abrirProcesso(Number(tr.dataset.p)));
  if ($('#btnNovo')) $('#btnNovo').onclick = () => formDados(null);
}

// ======================= Ficha do processo =======================
function renderFicha(el, p) {
  const r = resumo(p), e = etapa(p), forn = est.fornecedores[p.fornecedor] || {};
  const ed = podeEditar(), hoje = hojeISO();
  const linhaCp = CPS.map(([k, nome]) => {
    const prev = p[`cp_${k}_prev`], ef = p[`cp_${k}_ef`];
    const cls = ef ? 'feito' : (prev && prev < hoje && p.status === 'aberto' ? 'atraso' : '');
    const desvio = ef && prev ? dias(prev, ef) : null;
    return `<div class="etapa ${cls}"><div class="t">${nome}</div>
      <div class="l">Previsto <b>${dm(prev)}</b></div><div class="l">Efetivo <b>${dm(ef)}</b>${desvio ? ` <span class="${desvio > 0 ? 'verm' : 'verde'}">${desvio > 0 ? '+' : ''}${desvio}d</span>` : ''}</div></div>`;
  }).join('');

function linhaEstReal(l) {

  const cls = d == null || Math.abs(d) < 0.005 ? '' : d > 0 ? 'dif-pos' : 'dif-neg';

}

// ======================= Calculadora aduaneira =======================
// motor da calculadora aduaneira — método da planilha MATRIZ NEW - VALIDAÇÃO DI (cenário próprio)
// e da MATRIZ - CÁLCULO ADUANEIRO (cenário DHL / courier)
function taxaSiscomex(n) {
  n = Math.max(0, Math.round(n || 0));
  if (!n) return 0;
  return 115.67 + Math.min(n, 2) * 38.56 + Math.max(Math.min(n - 2, 3), 0) * 30.85 + Math.max(Math.min(n - 5, 5), 0) * 23.14
    + Math.max(Math.min(n - 10, 10), 0) * 15.42 + Math.max(Math.min(n - 20, 30), 0) * 7.71 + Math.max(n - 50, 0) * 3.86;
}
function calcularAduaneiro(itens, pr, aliq) {
  const n = v => Number(v) || 0;
  const linhas = itens.map(it => ({ ...it, fobT: n(it.qtd) * n(it.fob), pesoT: n(it.qtd) * n(it.peso), a: aliq[it.familia] || null }));   // peso = peso líquido UNITÁRIO (kg)
  const sumF = linhas.reduce((s, x) => s + x.fobT, 0);
  const sumP = linhas.reduce((s, x) => s + x.pesoT, 0);
  const porPeso = sumP > 0 && linhas.every(x => x.pesoT > 0);          // frete rateado por peso líquido (como na DI)
  const parteFrete = x => porPeso ? x.pesoT / sumP : (sumF ? x.fobT / sumF : 0);
  const di = n(pr.dolar_di), dc = n(pr.dolar_cambio) || di, fu = n(pr.frete_usd), acr = n(pr.outros_acresc);
  const vmld = sumF + fu;
  const adicoes = n(pr.adicoes) || new Set(linhas.filter(x => x.fobT).map(x => x.familia || '?')).size;
  const sisc = taxaSiscomex(adicoes);
  const freteBRL = fu * di + n(pr.frete_desp);
  const base0 = () => ({ fob_usd: sumF, cambio_brl: sumF * dc, frete_brl: 0, ii: 0, ipi: 0, pis: 0, cofins: 0, icms: 0, siscomex: 0, afrmm: 0, sdas: 0,
    sdas_afrmm_siscomex: 0, armazenagem: 0, despachante_valor: 0, outras_despesas: 0, frete_nacional: 0 });
  const fe = base0(), dh = base0();
  // ---- próprio (método DI)
  const it = linhas.map(x => {
    const a = x.a || {};
    const freteU = fu * parteFrete(x), acrU = sumF ? acr * x.fobT / sumF : 0;
    const O = (x.fobT + freteU + acrU) * di;                       // base II, PIS, COFINS (valor aduaneiro)
    const ii = n(a.ii) * O, pis = n(a.pis) * O, cof = n(a.cofins) * O;
    const ipi = n(a.ipi) * (O + ii);
    const parteV = vmld ? (x.fobT + freteU + acrU) / vmld : 0;
    const sc = sisc * parteV, af = n(pr.afrmm) * parteV;
    const baseIcms = n(a.icms) < 1 ? (O + ii + pis + cof + ipi + sc + af) / (1 - n(a.icms)) : 0;
    const icms = baseIcms * n(a.icms);
    return { ii, pis, cofins: cof, ipi, icms, sc, af, baseIcms };
  });
  const sumBase = it.reduce((s, x) => s + x.baseIcms, 0);
  const despIcms = n(pr.armazenagem) + n(pr.sdas) + n(pr.despachante) + n(pr.outras);   // rateadas pela base do ICMS
  linhas.forEach((x, i) => {
    const y = it[i];
    for (const k of ['ii', 'ipi', 'pis', 'cofins', 'icms']) fe[k] += y[k];
    fe.siscomex += y.sc; fe.afrmm += y.af;
    const custo = x.fobT * dc + y.ii + y.pis + y.cofins + y.ipi + y.icms + y.sc + y.af
      + (sumBase ? despIcms * y.baseIcms / sumBase : 0) + (freteBRL + n(pr.frete_nacional)) * parteFrete(x);
    x.fatorF = x.fobT ? custo / x.fobT : null; x.custoUnF = x.fatorF != null ? n(x.fob) * x.fatorF : null;
  });
  if (!sumBase) { fe.siscomex = sisc; fe.afrmm = n(pr.afrmm); }
  fe.sdas = n(pr.sdas);
  fe.sdas_afrmm_siscomex = fe.sdas + fe.siscomex + fe.afrmm;
  fe.armazenagem = n(pr.armazenagem); fe.despachante_valor = n(pr.despachante); fe.outras_despesas = n(pr.outras);
  fe.frete_nacional = n(pr.frete_nacional); fe.frete_brl = freteBRL;
  fe.adicoes = adicoes; fe.rateio_frete = porPeso ? 'peso' : 'fob';
  // ---- DHL / courier (planilha de cálculo aduaneiro)
  dh.frete_brl = fu * di * 1.06; dh.outras_despesas = n(pr.dhl_despesas);
  // DHL (remessa expressa): valor aduaneiro = (FOB + frete rateado) × dólar DI; II = 60% do valor aduaneiro;
  // ICMS "por dentro" sobre valor aduaneiro + II: (VA + II) ÷ (1 − ICMS) × ICMS  — confere com a cobrança DHL 6516931
  //   (a DHL trunca os centavos em cada valor: frete 1.181,3967 → 1.181,39)
  const tr2 = v => Math.floor(v * 100 + 1e-7) / 100;
  const itD = linhas.map(x => { const a = x.a || {}; const baseD = tr2(x.fobT * di) + tr2(fu * parteFrete(x) * di); const iiD = tr2(n(a.ii_dhl) * baseD);
    const icD = n(a.icms_dhl) < 1 ? tr2((baseD + iiD) / (1 - n(a.icms_dhl)) * n(a.icms_dhl)) : 0; return { ii: iiD, icms: icD, imp: iiD + icD }; });
  const somaD = itD.reduce((s, x) => s + x.imp, 0);
  linhas.forEach((x, i) => {
    const d = itD[i]; dh.ii += d.ii; dh.icms += d.icms;
    const custoD = d.imp + x.fobT * dc + (somaD ? d.imp * n(pr.dhl_despesas) / somaD : 0) + (sumF ? x.fobT * dh.frete_brl / sumF : 0);
    x.fatorD = x.fobT ? custoD / x.fobT : null; x.custoUnD = x.fatorD != null ? n(x.fob) * x.fatorD : null;
  });
  const fecha = r => {
    r.impostos = r.ii + r.ipi + r.pis + r.cofins + r.icms;
    r.despesas = r.sdas_afrmm_siscomex + r.armazenagem + r.despachante_valor + r.outras_despesas + r.frete_nacional;
    r.numerario = r.impostos + r.despesas + r.frete_brl;
    r.total = r.cambio_brl + r.numerario;
    r.fator = sumF ? r.total / sumF : null;
    r.creditos = r.icms + r.ipi;
    r.custo_real = r.total - r.creditos;
    r.fator2 = sumF ? r.custo_real / sumF : null;
    r.dif_cambial = sumF * (dc - di);
    return r;
  };
  return { itens: linhas, feromax: fecha(fe), dhl: fecha(dh), semAliq: linhas.filter(x => !x.a).map(x => x.familia) };
}

const PREM = [['frete_usd', 'Frete internacional (US$)'], ['outros_acresc', 'Outros acréscimos (US$)'], ['dolar_di', 'Dólar DI estimado'], ['dolar_cambio', 'Dólar câmbio estimado'],
  ['frete_desp', 'Despesas do frete internacional (R$)'], ['afrmm', 'AFRMM (R$) · aprox. 8% do frete marítimo'], ['sdas', 'SDAS (R$)'], ['armazenagem', 'Armazenagem (R$)'],
  ['despachante', 'Despachante (R$)'], ['frete_nacional', 'Frete nacional (R$)'], ['outras', 'Outras despesas (R$)'], ['adicoes', 'Nº de adições (vazio = nº de famílias)'], ['dhl_despesas', 'Despesas DHL (R$)']];
const ALQ = [['ii', 'II'], ['ipi', 'IPI'], ['icms', 'ICMS'], ['pis', 'PIS'], ['cofins', 'COFINS'], ['ii_dhl', 'II DHL'], ['icms_dhl', 'ICMS DHL']];
const CENARIOS = { feromax: 'Próprio (Feromax / Supply)', dhl: 'DHL (courier)' };

function novaCalc(p) {
  const e = p && p.estimativa;
  const ref = est.cambioRef ? String(est.cambioRef).replace('.', ',') : '';
  return {
    processo_id: p ? p.id : null,
    cenario: (e && e.cenario) || 'feromax',
    premissas: e && e.premissas ? Object.fromEntries(PREM.map(([k]) => { const v = e.premissas[k] ?? (k === 'frete_desp' ? e.premissas.logistica : null); return [k, v != null && v !== 0 ? String(v).replace('.', ',') : '']; })) :
      { frete_usd: '', outros_acresc: '', dolar_di: ref, dolar_cambio: ref, frete_desp: '', afrmm: '', sdas: '', armazenagem: '', despachante: '', frete_nacional: '', outras: '', adicoes: '', dhl_despesas: '250' },
    itens: e && e.itens && e.itens.length ? e.itens.map(x => ({ codigo: x.codigo || '', qtd: String(x.qtd ?? ''), fob: String(x.fob ?? '').replace('.', ','), familia: x.familia || '', peso: x.peso ? String(x.peso).replace('.', ',') : '' }))
      : [{ codigo: '', qtd: '1', fob: p && p.fob_usd ? String(p.fob_usd).replace('.', ',') : '', familia: '', peso: '' }],
  };
}
function abrirCalculadora(p) { est.calc = novaCalc(p); est.abertoId = null; abrir('calculadora'); window.scrollTo(0, 0); }
const numCalc = v => Number(paraNum(v)) || 0;
function resultadoCalc() {
  const c = est.calc;
  const itens = c.itens.filter(x => numCalc(x.qtd) && numCalc(x.fob)).map(x => ({ codigo: x.codigo, qtd: numCalc(x.qtd), fob: numCalc(x.fob), familia: x.familia, peso: numCalc(x.peso) || null }));
  const pr = Object.fromEntries(PREM.map(([k]) => [k, numCalc(c.premissas[k])]));
  return { itens, pr, r: calcularAduaneiro(itens, pr, est.aliquotas) };
}

function atualizarCalc() {
  const c = est.calc; const { r } = resultadoCalc();
  // colunas calculadas de cada item
  let k = 0;
  c.itens.forEach((x, i) => {
    const ok = numCalc(x.qtd) && numCalc(x.fob);
    const it = ok ? r.itens[k++] : null;
    const set = (id, v) => { const td = document.getElementById(id); if (td) td.innerHTML = v; };
    set('cFob' + i, it ? F2.format(it.fobT) : '—');
    set('cPesoT' + i, numCalc(x.peso) && numCalc(x.qtd) ? nf(3).format(numCalc(x.peso) * numCalc(x.qtd)) : '—');
    set('cFtF' + i, it && it.a ? FT(it.fatorF) : '—'); set('cCuF' + i, it && it.a ? F2.format(it.custoUnF) : '—');
    set('cFtD' + i, it && it.a ? FT(it.fatorD) : '—'); set('cCuD' + i, it && it.a ? F2.format(it.custoUnD) : '—');
  });
  const F = r.feromax, D = r.dhl;
  const lin = (n, a, b, opt = {}) => `<tr${opt.forte ? ' style="font-weight:650"' : ''}><td>${n}</td><td class="n">${opt.f ? FT(a) : opt.u ? U(a) : F2.format(a)}</td><td class="n">${opt.f ? FT(b) : opt.u ? U(b) : F2.format(b)}</td></tr>`;
  const box = document.getElementById('cResultado'); if (!box) return;
  const semFam = [...new Set(r.semAliq)];
  box.innerHTML = `<div class="topo"><h2>Resultado</h2><span class="nota">cenário marcado para salvar: <b>${CENARIOS[c.cenario]}</b> · ${F.adicoes} adição(ões) · frete rateado por ${F.rateio_frete === 'peso' ? 'peso líquido' : 'FOB (informe o peso de todos os itens para ratear por peso)'}</span></div>
    ${semFam.length ? `<div class="nota verm" style="margin-bottom:8px">Itens sem família/alíquota (impostos zerados): ${semFam.map(x => esc(x || 'sem família')).join(', ')}</div>` : ''}
    <div class="tabela-wrap"><table>
      <thead><tr><th></th><th class="n">${CENARIOS.feromax}</th><th class="n">${CENARIOS.dhl}</th></tr></thead>
      <tbody>
        ${lin('Valor total da invoice (FOB)', F.fob_usd, D.fob_usd, { u: true })}
        ${lin('Câmbio (FOB × dólar câmbio)', F.cambio_brl, D.cambio_brl)}
        ${lin('Diferença cambial (câmbio − DI)', F.dif_cambial, D.dif_cambial)}
        ${lin('II', F.ii, D.ii)}${lin('PIS', F.pis, D.pis)}${lin('COFINS', F.cofins, D.cofins)}${lin('IPI', F.ipi, D.ipi)}${lin('ICMS', F.icms, D.icms)}
        ${lin('Impostos total', F.impostos, D.impostos, { forte: true })}
        ${lin(`Taxa Siscomex (${F.adicoes} adição(ões))`, F.siscomex, D.siscomex)}
        ${lin('AFRMM', F.afrmm, D.afrmm)}
        ${lin('SDAS', F.sdas, D.sdas)}
        ${lin('Armazenagem', F.armazenagem, D.armazenagem)}
        ${lin('Despachante', F.despachante_valor, D.despachante_valor)}
        ${lin('Outras despesas / despesas DHL', F.outras_despesas, D.outras_despesas)}
        ${lin('Frete internacional (R$)', F.frete_brl, D.frete_brl)}
        ${lin('Frete nacional', F.frete_nacional, D.frete_nacional)}
        ${lin('Numerários total', F.numerario, D.numerario, { forte: true })}
        ${lin('Total importação', F.total, D.total, { forte: true })}
        ${lin('Fator de importação', F.fator, D.fator, { f: true, forte: true })}
        ${lin('Crédito ICMS + IPI', F.creditos, D.creditos)}
        ${lin('Custo real (sem créditos)', F.custo_real, D.custo_real)}
        ${lin('Fator 2 (sem créditos)', F.fator2, D.fator2, { f: true })}
      </tbody></table></div>`;
}

function colarItens() {
  const m = abrirModal(`<h2>Colar itens da planilha</h2>
    <div class="nota" style="margin-bottom:8px">Copie do Excel as colunas <b>Código · Quantidade · FOB unitário · Família · Peso líquido unitário (kg)</b> (família e peso são opcionais: se o código estiver no cadastro de produtos, vêm de lá) e cole abaixo.</div>
    <textarea id="cTxt" rows="10" style="width:100%;font:inherit;font-size:13px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)"></textarea>
    <label class="chk-fluxo" style="margin-top:8px"><input type="checkbox" id="cSubst" checked> Substituir os itens atuais</label>
    <div class="erro" id="cErr"></div>
    <div class="rodape"><button class="btn" data-fechar>Cancelar</button><button class="btn-pri" id="cOk">Incluir</button></div>`);
  m.querySelector('#cOk').onclick = () => {
    const fams = Object.keys(est.aliquotas);
    const achaFam = t => { t = String(t || '').trim(); return fams.find(f => f.toLowerCase() === t.toLowerCase()) || t.toUpperCase(); };
    const linhas = m.querySelector('#cTxt').value.split(/\r?\n/).map(l => l.split(/\t|;/).map(x => x.trim())).filter(l => l.some(Boolean));
    const novos = [];
    for (const l of linhas) {
      if (l.length < 3) continue;
      if (isNaN(Number(paraNum(l[1]))) || isNaN(Number(paraNum(l[2])))) continue; // cabeçalho
      novos.push({ codigo: l[0], qtd: l[1], fob: l[2], familia: l[3] ? achaFam(l[3]) : '', peso: l[4] || '' });
    }
    if (!novos.length) return void (m.querySelector('#cErr').textContent = 'Nenhuma linha reconhecida (código, quantidade, FOB).');
    novos.forEach(completarDoCadastro);
    est.calc.itens = m.querySelector('#cSubst').checked ? novos : est.calc.itens.filter(x => numCalc(x.fob)).concat(novos);
    fecharModal(m); redesenhar();
  };
}

async function salvarEstimativa() {
  const c = est.calc, p = est.processos.find(x => x.id === c.processo_id);
  if (!p) return;
  const { itens, pr, r } = resultadoCalc();
  if (!itens.length) return alertaErro('Informe pelo menos um item com quantidade e FOB.');
  if (!pr.dolar_di) return alertaErro('Informe o dólar DI estimado.');
  const res = r[c.cenario];
  const arred = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, typeof v === 'number' ? Math.round(v * 1e6) / 1e6 : v]));
  const estimativa = { data: hojeISO(), cenario: c.cenario, premissas: pr,
    itens: itens.map(x => ({ ...x, aliq: est.aliquotas[x.familia] ? Object.fromEntries(ALQ.map(([k]) => [k, est.aliquotas[x.familia][k]])) : null })),
    resultado: arred(res) };
  const dataNum = p.cp_numerario_prev || p.cp_chegada_prev || p.previsao_chegada;
  const msg = `Fator estimado <b>${FT(res.fator)}</b> · total ${R0(res.total)} · numerário ${R0(res.numerario)} (${CENARIOS[c.cenario]}).<br><br>
    Os pesos digitados vão para o cadastro de produtos como validados.<br>
    O numerário previsto ${dataNum ? `entra no Fluxo de caixa projetado em <b>${dm(dataNum)}</b> (data prevista do numerário/chegada)` : 'é criado, mas <b>sem data</b>: informe a previsão de chegada ou do numerário para ele entrar no fluxo'}.<br><br>Salvar no pedido ${esc(p.pedido || '')} · ${esc(p.fornecedor)}?`;
  if (!await confirmar('Salvar estimativa', msg, 'Salvar')) return;
  const reg = { estimativa, fator_estimado: Math.round(res.fator * 1e6) / 1e6 };
  if (!p.fob_usd) reg.fob_usd = Math.round(res.fob_usd * 100) / 100;
  await gravar('imp_processos', reg, p.id, p, true);
  await numerarioDaEstimativa(p, res.numerario);
  await gravarPesosDosItens(c.itens, `estimativa do pedido ${p.pedido || p.id}`, true);
  est.abertoId = p.id; abrir('processos'); await depoisDeGravar();
}

// numerário previsto pela estimativa: cria (ou atualiza, se ainda não pago) e leva ao Fluxo de caixa projetado
const OBS_NUM_EST = 'Numerário previsto pela estimativa';
async function numerarioDaEstimativa(p, valor) {
  valor = Math.round(nz(valor) * 100) / 100;
  if (!valor) return;
  const data = p.cp_numerario_prev || p.cp_chegada_prev || p.previsao_chegada || null;
  const ja = pagamentosDe(p).find(c => !ehCambio(c) && !c.pago && String(c.observacao || '').startsWith(OBS_NUM_EST));
  const obs = `${OBS_NUM_EST} (impostos + despesas + fretes) de ${dm(hojeISO())}.`;
  if (ja) await gravar('imp_cambios', { valor_previsto_brl: valor, observacao: obs, data_prevista: ja.data_prevista || data, no_fluxo: !!(ja.data_prevista || data) }, ja.id, ja, true);
  else if (!pagamentosDe(p).some(c => !ehCambio(c) && c.pago))
    await inserirSemRecarregar('imp_cambios', { processo_id: p.id, empresa: p.empresa, tipo: 'Numerário', valor_previsto_brl: valor, data_prevista: data,
      no_fluxo: !!data, ordem: pagamentosDe(p).length + 1, observacao: obs + (data ? '' : ' Sem data prevista: informe a data para entrar no fluxo.') });
}


// ======================= Produtos (pesos e medidas) =======================
const chaveProd = c => String(c || '').trim().toUpperCase().replace(/\s+/g, ' ');
const prodDe = codigo => est.produtos[chaveProd(codigo)];
// tag abaixo do código na calculadora
function tagProduto(x) {
  if (!String(x.codigo || '').trim()) return '';
  const pr = prodDe(x.codigo);
  if (!pr) return '<div class="nota">novo · não está no cadastro</div>';
  const pesoIgual = pr.peso_liq_kg != null && Math.abs(numCalc(x.peso) - Number(pr.peso_liq_kg)) < 1e-9;
  return `<div class="nota">${pr.validado ? '<span class="verde">✓ validado</span>' : '<span class="verm">a confirmar</span>'}${pr.peso_liq_kg != null && !pesoIgual ? ` · cadastro: ${nf(3).format(pr.peso_liq_kg)} kg` : ''}</div>`;
}
// completa família e peso do item a partir do cadastro (só o que estiver vazio); devolve true se mudou algo
function completarDoCadastro(x) {
  const pr = prodDe(x.codigo); if (!pr) return false;
  let mudou = false;
  if (!x.familia && pr.familia) { x.familia = pr.familia; mudou = true; }
  if (!numCalc(x.peso) && pr.peso_liq_kg != null) { x.peso = String(pr.peso_liq_kg).replace('.', ','); mudou = true; }
  return mudou;
}
// grava no cadastro o peso unitário dos itens com código (vira "validado": foi o usuário que informou ou confirmou)
async function gravarPesosDosItens(itens, origem, silencioso) {
  if (!podeEditar()) return 0;
  const lista = [];
  for (const x of itens) {
    const cod = chaveProd(x.codigo), peso = numCalc(x.peso);
    if (!cod || !peso) continue;
    const pr = prodDe(cod);
    if (pr && pr.validado && Math.abs(Number(pr.peso_liq_kg) - peso) < 1e-9 && (pr.familia || !x.familia)) continue;   // nada novo
    lista.push({ codigo: cod, familia: x.familia || (pr && pr.familia) || null, peso_liq_kg: peso, validado: true,
      fonte: pr && pr.fonte && Math.abs(Number(pr.peso_liq_kg) - peso) < 1e-9 ? pr.fonte : 'Informado na ' + origem });
  }
  if (!lista.length) return 0;
  try { await gravarProdutos(lista); } catch (e) { if (!silencioso) throw e; return 0; }
  return lista.length;
}

// ======================= formulários =======================
// campos: [nome, rótulo, tipo ('text'|'date'|'num'|'select'|'chk'|'area'|'lista'), opções]
function form(titulo, grupos, valores, aoSalvar, extra) {
  const html = grupos.map(([gtit, campos]) => `${gtit ? `<div class="grupo-tit">${gtit}</div>` : ''}<div class="form">${campos.map(([k, rot, t, op]) => {
    const v = valores[k];
    if (t === 'chk') return `<label class="chk"><input type="checkbox" name="${k}" ${v ? 'checked' : ''}><span>${rot}</span></label>`;
    if (t === 'select') return `<label><span>${rot}</span><select name="${k}">${op.map(([ov, on]) => `<option value="${esc(ov)}" ${String(ov) === String(v ?? '') ? 'selected' : ''}>${esc(on)}</option>`).join('')}</select></label>`;
    if (t === 'area') return `<label class="largo"><span>${rot}</span><textarea name="${k}" rows="2">${esc(v ?? '')}</textarea></label>`;
    if (t === 'lista') return `<label><span>${rot}</span><input name="${k}" list="dl_${k}" value="${esc(v ?? '')}" autocomplete="off"><datalist id="dl_${k}">${op.map(o => `<option value="${esc(o)}">`).join('')}</datalist></label>`;
    const tipo = t === 'date' ? 'date' : 'text';
    const val = t === 'num' && v != null && v !== '' ? String(v).replace('.', ',') : (v ?? '');
    return `<label><span>${rot}</span><input name="${k}" type="${tipo}" ${t === 'num' ? 'inputmode="decimal"' : ''} value="${esc(val)}"></label>`;
  }).join('')}</div>`).join('');
  const m = abrirModal(`<h2>${titulo}</h2><form id="fm">${html}${extra || ''}<div class="erro" id="fmErro"></div>
    <div class="rodape"><button type="button" class="btn" data-fechar>Cancelar</button><button type="submit" class="btn-pri">Salvar</button></div></form>`);
  const tipos = Object.fromEntries(grupos.flatMap(g => g[1]).map(([k, , t]) => [k, t]));
  const ler = () => {
    const fm = m.querySelector('#fm'), out = {};
    for (const [k, t] of Object.entries(tipos)) {
      const i = fm.elements[k];
      if (t === 'chk') out[k] = i.checked;
      else if (t === 'num') { const s = paraNum(i.value); out[k] = s === '' ? null : Number(s); if (s !== '' && isNaN(out[k])) throw new Error(`Valor inválido em "${grupos.flatMap(g => g[1]).find(c => c[0] === k)[1]}"`); }
      else out[k] = i.value.trim() === '' ? null : i.value.trim();
    }
    return out;
  };
  m.querySelector('#fm').onsubmit = async ev => {
    ev.preventDefault();
    const bt = m.querySelector('button[type=submit]'); bt.disabled = true;
    try { await aoSalvar(ler(), m); fecharModal(m); }
    catch (e) { m.querySelector('#fmErro').textContent = e.message; bt.disabled = false; }
  };
  return { m, ler };
}
function abrirModal(html) {
  const fundo = document.createElement('div');
  fundo.className = 'modal-fundo';
  fundo.innerHTML = `<div class="modal" role="dialog">${html}</div>`;
  $('#modais').appendChild(fundo);
  fundo.addEventListener('click', e => { if (e.target === fundo || e.target.hasAttribute('data-fechar')) fecharModal(fundo); });
  const f = fundo.querySelector('input,select,textarea'); if (f) setTimeout(() => f.focus(), 30);
  return fundo;
}
function fecharModal(m) { m.remove(); }
function confirmar(tit, msg, ok = 'Confirmar') {
  return new Promise(res => {
    const m = abrirModal(`<h2>${tit}</h2><div>${msg}</div><div class="rodape"><button class="btn" id="cNao">Cancelar</button><button class="btn-pri" id="cSim">${ok}</button></div>`);
    m.querySelector('#cNao').onclick = () => { fecharModal(m); res(false); };
    m.querySelector('#cSim').onclick = () => { fecharModal(m); res(true); };
  });
}

async function inserir(tabela, reg) {
  if (tabela === 'imp_processos') reg.atualizado_em = new Date().toISOString();
  if (est.demo) {
    const id = Math.max(0, ...est[mapa[tabela]].map(x => x.id)) + 1;
    est[mapa[tabela]].push({ id, ...reg }); redesenhar(); return id;
  }
  const { data, error } = await sb.from(tabela).insert(reg).select('id').single();
  if (error) throw new Error(error.message);
  await recarregar(); return data.id;
}
async function inserirSemRecarregar(tabela, reg) {
  if (est.demo) { const id = Math.max(0, ...est[mapa[tabela]].map(x => x.id)) + 1; est[mapa[tabela]].push({ id, ...reg }); return id; }
  const { data, error } = await sb.from(tabela).insert(reg).select('id').single();
  if (error) { alertaErro(error.message); throw new Error(error.message); }
  return data.id;
}
async function gravar(tabela, reg, id, obj, semRecarregar) {
  if (tabela === 'imp_processos') reg.atualizado_em = new Date().toISOString();
  if (est.demo) { Object.assign(obj, reg); if (!semRecarregar) redesenhar(); return; }
  const { error } = await sb.from(tabela).update(reg).eq('id', id);
  if (error) { alertaErro(error.message); throw new Error(error.message); }
  if (!semRecarregar) await recarregar();
}
async function depoisDeGravar() { if (est.demo) redesenhar(); else await recarregar(); }
async function excluir(tabela, id) {
  if (est.demo) { est[mapa[tabela]] = est[mapa[tabela]].filter(x => x.id !== id); redesenhar(); return; }
  const { error } = await sb.from(tabela).delete().eq('id', id);
  if (error) throw new Error(error.message);
  await recarregar();
}
async function gravarFornecedor(f) {
  if (est.demo) { est.fornecedores[f.nome] = f; return; }
  const { error } = await sb.from('imp_fornecedores').upsert(f);
  if (error) throw new Error(error.message);
}
const mapa = { imp_processos: 'processos', imp_cambios: 'cambios', imp_creditos: 'creditos' };
async function gravarProdutos(lista) {
  if (!lista.length) return;
  const agora = new Date().toISOString();
  lista = lista.map(x => ({ ...x, atualizado_em: agora }));
  if (est.demo) { for (const x of lista) est.produtos[chaveProd(x.codigo)] = { ...(est.produtos[chaveProd(x.codigo)] || {}), ...x }; return; }
  const { error } = await sb.from('imp_produtos').upsert(lista, { onConflict: 'codigo' });
  if (error) { alertaErro(error.message); throw new Error(error.message); }
  const pr = await buscarTodos(() => sb.from('imp_produtos').select('*').order('codigo'));
  est.produtos = Object.fromEntries(pr.map(x => [chaveProd(x.codigo), numerico(x)]));
}
function alertaInfo(msg) { abrirModal(`<div>${msg}</div><div class="rodape"><button class="btn-pri" data-fechar>OK</button></div>`); }
async function gravarAliquotas(lista) {
  if (est.demo) { for (const a of lista) est.aliquotas[a.familia] = a; return; }
  const { error } = await sb.from('imp_aliquotas').upsert(lista);
  if (error) throw new Error(error.message);
  await recarregar();
}
function alertaErro(msg) { const m = abrirModal(`<h2>Não foi possível salvar</h2><div class="erro">${esc(msg)}</div><div class="rodape"><button class="btn-pri" data-fechar>OK</button></div>`); }

// ======================= leitura =======================
async function buscarTodos(fazConsulta) {
  const TAM = 1000; let de = 0, todos = [];
  for (;;) {
    const { data, error } = await fazConsulta().range(de, de + TAM - 1);
    if (error) throw new Error(error.message);
    todos = todos.concat(data || []);
    if (!data || data.length < TAM) break;
    de += TAM;
  }
  return todos;
}
const numerico = o => { for (const k in o) if (typeof o[k] === 'string' && /^-?\d+(\.\d+)?$/.test(o[k]) && !['pedido', 'processo', 'di', 'protocolo_di', 'contrato'].includes(k)) o[k] = Number(o[k]); return o; };
async function recarregar() {
  const [procs, cambios, creditos, forns] = await Promise.all([
    buscarTodos(() => sb.from('imp_processos').select('*').order('id')),
    buscarTodos(() => sb.from('imp_cambios').select('*').order('id')),
    buscarTodos(() => sb.from('imp_creditos').select('*').order('id')),
    buscarTodos(() => sb.from('imp_fornecedores').select('*').order('nome')),
  ]);
  est.processos = procs.map(numerico); est.cambios = cambios.map(numerico); est.creditos = creditos.map(numerico);
  est.fornecedores = Object.fromEntries(forns.map(f => [f.nome, f]));
  // cadastro de produtos (peso unitário e medidas)
  try { const pr = await buscarTodos(() => sb.from('imp_produtos').select('*').order('codigo')); est.produtos = Object.fromEntries(pr.map(x => [chaveProd(x.codigo), numerico(x)])); } catch (_) { est.produtos = {}; }
  // alíquotas por família de produto (calculadora aduaneira)
  try { const al = await buscarTodos(() => sb.from('imp_aliquotas').select('*').order('familia')); est.aliquotas = Object.fromEntries(al.map(a => [a.familia, numerico(a)])); } catch (_) { est.aliquotas = {}; }
  // câmbio de referência do painel (PTAX ou manual) para a calculadora
  if (est.cambioRef == null) try {
    const [{ data: par }, { data: cfg }] = await Promise.all([sb.from('parametros').select('chave,valor').eq('chave', 'cambio').maybeSingle(), sb.from('config_painel').select('valor').eq('chave', 'ptax').maybeSingle()]);
    const cam = par && par.valor, ptax = cfg && cfg.valor && Number(cfg.valor.valor);
    est.cambioRef = cam && cam.modo === 'ptax' && ptax ? ptax : (cam && Number(cam.manual)) || ptax || null;
  } catch (_) {}
  redesenhar();
}

// ======================= login (mesmo do painel) =======================
const temAcesso = p => !!p && p.ativo && (p.admin || (p.areas || []).includes('importacoes'));

async function iniciar() {
  if (!CFG.SUPABASE_URL || !window.supabase) {
    if (!window.IMP_DEMO) return bloqueio('Configuração do Supabase não encontrada (config.js).');
    est.demo = true;
    est.perfil = { nome: 'Demonstração', ativo: true, admin: true };
    Object.assign(est, window.IMP_DEMO);
    $('#usuario').textContent = 'Demonstração'; $('#btnSair').hidden = true;
    return mostrarApp();
  }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_CHAVE_PUBLICA);
  const { data } = await sb.auth.getSession();
  if (!data.session) return mostrarLogin();
  await entrar();
}
function mostrarLogin() { $('#app').hidden = true; $('#telaLogin').hidden = false; setTimeout(() => $('#lEmail').focus(), 50); }
async function entrar() {
  const { data: { user } } = await sb.auth.getUser();
  const { data: perfil, error } = await sb.from('perfis').select('*').eq('id', user.id).maybeSingle();
  $('#telaLogin').hidden = true;
  if (error) return bloqueio('Não consegui ler seu perfil: ' + error.message);
  est.perfil = perfil;
  $('#usuario').textContent = (perfil && perfil.nome) || user.email;
  if (!temAcesso(perfil)) return bloqueio(`Olá, ${esc(user.email)}. Você ainda não tem acesso ao módulo de Importações.<br>Peça ao administrador para liberar a área “Importações” no seu usuário.`);
  $('#app').hidden = false;
  $('#conteudo').innerHTML = '<div class="card"><div class="vazio">Carregando…</div></div>';
  try {
    await recarregar();
  } catch (e) {
    const falta = /imp_|does not exist|schema cache/i.test(e.message);
    return bloqueio(falta ? 'As tabelas do módulo ainda não foram criadas no Supabase.<br>Rode o arquivo <b>MIGRACAO-IMPORTACOES-2026-11-25.sql</b> no SQL Editor.' : 'Erro ao carregar: ' + esc(e.message));
  }
  mostrarApp();
}
function bloqueio(msg) {
  $('#app').hidden = false; $('#subabas').hidden = true;
  $('#conteudo').innerHTML = `<div class="card"><div class="vazio">${msg}</div></div>`;
}
function mostrarApp() { $('#app').hidden = false; $('#subabas').hidden = false; montarSubabas(); }

$('#formLogin').onsubmit = async ev => {
  ev.preventDefault(); $('#lErro').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#lEmail').value.trim(), password: $('#lSenha').value });
  if (error) { $('#lErro').textContent = 'E-mail ou senha inválidos.'; return; }
  await entrar();
};
$('#btnSair').onclick = async () => { if (sb) await sb.auth.signOut(); location.reload(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const m = document.querySelector('.modal-fundo:last-child'); if (m) m.remove(); } });

iniciar();
</script>
