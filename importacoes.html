<!--
  MÓDULO IMPORTAÇÕES (COMPRAS) — projeto separado do Painel Financeiro.
   • Arquivo independente: não altera nem depende do index.html.
   • Mesmo login e mesmo Supabase (config.js).
   • Tabelas do módulo: imp_fornecedores, imp_processos, imp_cambios, imp_creditos
     (criadas por MIGRACAO-IMPORTACOES-2026-11-25.sql). A tabela "importacoes" do financeiro não é tocada.
   • Fator de importação = (câmbios R$ + nacionalização R$) / FOB US$
   • Para criar uma sub-aba: acrescente um item em SUBABAS e uma função render.

<script>
// tema igual ao do painel (localStorage 'painel-tema') e modo embutido (dentro da aba Importações)
(function () {
  var h = document.documentElement;
  function tema() { var t = 'auto'; try { t = localStorage.getItem('painel-tema') || 'auto'; } catch (e) {}
    h.classList.remove('tema-claro', 'tema-escuro'); if (t === 'claro') h.classList.add('tema-claro'); else if (t === 'escuro') h.classList.add('tema-escuro'); }
  tema(); addEventListener('storage', function (e) { if (e.key === 'painel-tema') tema(); });
  try { if (window.self !== window.top) h.classList.add('embutido'); } catch (e) { h.classList.add('embutido'); }
})();
</script>

<script>
'use strict';
// ======================= utilitários =======================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (d) => new Intl.NumberFormat('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const F0 = nf(0), F2 = nf(2), F4 = nf(4);
const R = v => v == null || isNaN(v) ? '—' : 'R$ ' + F2.format(v);
const R0 = v => v == null || isNaN(v) ? '—' : 'R$ ' + F0.format(v);
const U = v => v == null || isNaN(v) ? '—' : 'US$ ' + F2.format(v);
const U0 = v => v == null || isNaN(v) ? '—' : 'US$ ' + F0.format(v);
const TX = v => v == null || isNaN(v) ? '—' : F4.format(v);
const FT = v => v == null || isNaN(v) || !isFinite(v) ? '—' : nf(2).format(v);
const dm = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(2, 4) : '—';
const hojeISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const somaDias = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const dias = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const nz = v => Number(v) || 0;
// "1.234,56" → "1234.56" ; "5,2079" → "5.2079" ; "5.2079" → "5.2079"
const paraNum = t => { t = String(t || '').trim().replace(/\s|R\$|US\$/g, ''); return t.includes(',') ? t.replace(/\./g, '').replace(',', '.') : t; };

const CFG = window.PAINEL_CONFIG || {};
let sb = null;
// empresas do módulo (parametros "imp_empresas"): 1 e 2 entram no fluxo de caixa; Smarthub e Fortify são só de importação
let EMPRESAS = { 1: 'Feromax', 2: 'Supply' };
let EMP_CFG = { 1: { nome: 'Feromax', fluxo: true }, 2: { nome: 'Supply', fluxo: true } };
const temFluxo = e => { const c = EMP_CFG[e]; return c ? c.fluxo !== false : Number(e) < 100; };   // vai para o Fluxo de caixa projetado?
const temClientes = e => !!(EMP_CFG[e] && EMP_CFG[e].clientes);                                  // importa para clientes (assessoria)
function aplicarEmpresas(cfg) {
  if (!cfg || typeof cfg !== 'object') return;
  EMP_CFG = Object.fromEntries(Object.entries(cfg).map(([k, v]) => [Number(k), typeof v === 'string' ? { nome: v } : v]));
  EMPRESAS = Object.fromEntries(Object.entries(EMP_CFG).map(([k, v]) => [k, v.nome || 'Empresa ' + k]));
}
const est = {
  perfil: null, sub: null, demo: false,
  processos: [], cambios: [], creditos: [], fornecedores: {},
  filtro: { empresa: 0, status: 'aberto', busca: '', pais: '' },
  abertoId: null, ord: {}, aliquotas: {}, cambioRef: null,
  calc: null, produtos: {}, filtroProd: { busca: '', status: '' },
};

// ======================= regras do processo =======================
const NAC = [['frete_brl', 'Frete internacional (R$)'], ['ii', 'II'], ['ipi', 'IPI'], ['pis', 'PIS'], ['cofins', 'COFINS'], ['icms', 'ICMS'],
  ['sdas_afrmm_siscomex', 'SDAS / AFRMM / Siscomex'], ['armazenagem', 'Armazenagem'], ['despachante_valor', 'Despachante'],
  ['outras_despesas', 'Outras despesas'], ['frete_nacional', 'Frete nacional']];
const CPS = [['producao', 'Início da produção'], ['saida', 'Saída do fornecedor'], ['embarque', 'Embarque (ETD)'],
  ['chegada', 'Chegada Brasil (ETA)'], ['numerario', 'Pagamento numerário'], ['estoque', 'Chegada no estoque / cliente']];

// pagamentos programados do processo: parcelas de câmbio (US$) e numerários / outros (R$)
const pagamentosDe = p => est.cambios.filter(c => c.processo_id === p.id).sort((a, b) => (a.ordem ?? 99) - (b.ordem ?? 99) || a.id - b.id);
const ehCambio = c => (c.tipo || 'Câmbio') === 'Câmbio';
const cambiosDe = p => pagamentosDe(p).filter(ehCambio);
// valor previsto em R$ de um pagamento em aberto (câmbio pela taxa de referência; numerário pelo valor informado)
const previstoBRL = (p, c) => ehCambio(c) ? (taxaAberta(p, c) ? nz(c.valor_usd) * taxaAberta(p, c) : null) : nz(c.valor_previsto_brl);

// ---- ordenação por coluna (clique no cabeçalho)
function ordenar(chave, linhas, cols, padrao) {
  const o = est.ord[chave] || padrao; if (!o) return linhas;
  const c = cols.find(x => x.id === o.col); if (!c || !c.v) return linhas;
  const m = o.dir === 'desc' ? -1 : 1;
  return [...linhas].sort((a, b) => {
    const x = c.v(a), y = c.v(b);
    const vx = x == null || x === '' || (typeof x === 'number' && isNaN(x)), vy = y == null || y === '' || (typeof y === 'number' && isNaN(y));
    if (vx && vy) return 0; if (vx) return 1; if (vy) return -1;
    return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'pt-BR', { numeric: true, sensitivity: 'base' })) * m;
  });
}
function cabecalho(chave, cols, padrao) {
  const o = est.ord[chave] || padrao || {};
  return '<tr>' + cols.map(c => c.v
    ? `<th class="ord ${c.cls || ''}" data-ordk="${chave}" data-ordc="${c.id}" title="Ordenar">${c.nome}<span class="seta">${o.col === c.id ? (o.dir === 'desc' ? '▼' : '▲') : ''}</span></th>`
    : `<th class="${c.cls || ''}">${c.nome}</th>`).join('') + '</tr>';
}
function ligarOrdenacao(el) {
  el.querySelectorAll('th[data-ordk]').forEach(th => th.onclick = ev => {
    ev.stopPropagation();
    const k = th.dataset.ordk, c = th.dataset.ordc, o = est.ord[k];
    est.ord[k] = { col: c, dir: o && o.col === c && o.dir === 'asc' ? 'desc' : 'asc' };
    redesenhar();
  });
}
const totalNac = p => NAC.reduce((s, [k]) => s + nz(p[k]), 0);
const temNac = p => !!p.data_di || NAC.some(([k]) => p[k] != null && p[k] !== 0);
// taxa usada para parcelas ainda não pagas: câmbio da DI; sem DI, a taxa prevista da parcela; depois a da estimativa; por fim o câmbio do painel
const taxaAberta = (p, c) => nz(p.cambio_di) || nz(c.taxa_di) || nz(p.estimativa && p.estimativa.premissas && p.estimativa.premissas.dolar_cambio) || nz(est.cambioRef) || null;

function resumo(p) {
  const cs = cambiosDe(p);
  const fob = nz(p.fob_usd) || cs.reduce((s, c) => s + nz(c.valor_usd), 0);
  let pagoBRL = 0, pagoUSD = 0, abertoUSD = 0, abertoBRL = 0, semTaxa = false, variacao = 0;
  for (const c of cs) {
    if (c.pago) {
      pagoBRL += nz(c.valor_brl); pagoUSD += nz(c.valor_usd);
      if (nz(p.cambio_di)) variacao += nz(c.valor_brl) - nz(c.valor_usd) * nz(p.cambio_di);
    } else {
      abertoUSD += nz(c.valor_usd);
      const t = taxaAberta(p, c); if (t) abertoBRL += nz(c.valor_usd) * t; else semTaxa = true;
    }
  }
  const nac = totalNac(p);
  const total = pagoBRL + abertoBRL + nac;
  let fator = null, tipoFator = '';
  if (p.status === 'fechado') { fator = fob ? total / fob : null; tipoFator = 'final'; }
  else if (temNac(p) && !semTaxa) { fator = fob ? total / fob : null; tipoFator = 'pré-fechamento'; }
  else if (p.fator_estimado) { fator = Number(p.fator_estimado); tipoFator = 'estimado'; }
  const conciliado = p.status === 'fechado' || (p.nac_conciliada && cs.length > 0 && cs.every(c => c.pago && c.conciliado));
  return { cs, fob, pagoBRL, pagoUSD, abertoUSD, abertoBRL, semTaxa, nac, total, fator, tipoFator, variacao, conciliado };
}

function etapa(p) {
  if (p.status === 'fechado') return { nome: 'Fechado', cls: 'ok' };
  const r = resumo(p);
  if (temNac(p)) return r.abertoUSD > 0 ? { nome: 'Nacionalizado · câmbio em aberto', cls: 'aviso' } : { nome: 'A fechar', cls: 'azul' };
  if (p.cp_chegada_ef) return { nome: 'Chegou', cls: 'azul' };
  if (p.cp_embarque_ef) return { nome: 'Em trânsito', cls: 'azul' };
  if (p.cp_saida_ef) return { nome: 'Aguardando embarque', cls: 'azul' };
  if (p.cp_producao_ef) return { nome: 'Em produção', cls: '' };
  return { nome: 'Pedido', cls: '' };
}

// próxima data relevante e se está atrasada
function proximoCheckpoint(p) {
  const hoje = hojeISO();
  for (const [k, nome] of CPS) {
    if (p[`cp_${k}_ef`]) continue;
    const prev = p[`cp_${k}_prev`];
    return { nome, prev, atraso: !!prev && prev < hoje };
  }
  return null;
}

const paisDe = p => (est.fornecedores[p.fornecedor] || {}).pais || '';
const podeEditar = () => !!est.perfil && (est.perfil.admin || (est.perfil.editor && (est.perfil.areas || []).includes('importacoes')));
// gestor de importações: fecha/reabre processo, marca pago/conciliado e usa créditos (admin, ou quem tem a área "imp_gestor")
const podeFechar = () => !!est.perfil && (est.perfil.admin || (podeEditar() && (est.perfil.areas || []).includes('imp_gestor')));

// status logístico pelo checkpoint: aguardando embarque → em trânsito → em desembaraço → entregue
function statusEmb(p) {
  if (p.cp_estoque_ef || (p.status === 'fechado' && !p.cp_embarque_ef && !p.cp_chegada_ef)) return { k: 'entregue', nome: 'Entregue', cls: 'ok' };
  if (p.cp_chegada_ef || p.data_di) return { k: 'desembaraco', nome: 'Em desembaraço', cls: 'aviso' };
  if (p.cp_embarque_ef) return { k: 'transito', nome: 'Em trânsito', cls: 'azul' };
  return { k: 'aguardando', nome: 'Aguardando embarque', cls: '' };
}
const STATUS_EMB = [['aguardando', 'Aguardando embarque'], ['transito', 'Em trânsito'], ['desembaraco', 'Em desembaraço'], ['entregue', 'Entregue']];
function pagCarga(p) {
  if (p.carga_paga) return { k: 'pago', txt: p.carga_paga_em ? dm(p.carga_paga_em) : 'ok' };
  const cs = cambiosDe(p);
  if (!cs.length) return { k: 'sem', txt: '—' };
  const pagos = cs.filter(c => c.pago);
  if (pagos.length === cs.length) return { k: 'pago', txt: dm(pagos.map(c => c.data_fechamento).filter(Boolean).sort().pop()) || 'ok' };
  return { k: 'pendente', txt: pagos.length ? `parcial (${pagos.length}/${cs.length})` : 'pendente' };
}
const textoCarga = p => { const x = pagCarga(p); return x.k === 'pago' ? 'pago ' + (x.txt === 'ok' ? '' : x.txt) : x.txt; };
function textoComissao(p) {
  if (p.comissao_paga) return 'paga' + (p.comissao_paga_em ? ' ' + dm(p.comissao_paga_em) : '') + (p.comissao_valor ? ' · ' + R(p.comissao_valor) : '');
  return p.comissao_valor ? 'a receber ' + R(p.comissao_valor) : '—';
}
const fatorEmb = p => { const r = resumo(p); return r.tipoFator && r.tipoFator !== 'estimado' && r.fator ? r.fator : (p.fator_planilha != null ? Number(p.fator_planilha) : null); };

function renderEmbarques(el) {
  const f = est.filtroEmb || (est.filtroEmb = { empresa: 0, status: '', cliente: '', forn: '', agente: '', desp: '', pag: '', ativos: false });

  const base = est.processos.filter(p => emps.includes(p.empresa) && (!f.empresa || p.empresa === f.empresa));
  const opc = campo => [...new Set(base.map(campo).filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), 'pt-BR'));
  const lista = base.filter(p => (!f.status || statusEmb(p).k === f.status) && (!f.cliente || p.cliente === f.cliente) && (!f.forn || p.fornecedor === f.forn)
    && (!f.agente || p.logistica === f.agente) && (!f.desp || p.despachante === f.desp) && (!f.pag || pagCarga(p).k === f.pag)
    && (!f.ativos || statusEmb(p).k !== 'entregue' || p.status === 'aberto'));
  const conta = k => lista.filter(p => statusEmb(p).k === k).length;
  const comCli = lista.some(p => p.cliente);
  const cols = [
    { id: 'id', nome: 'Nº', v: x => x.id },
    ...(comCli ? [{ id: 'cli', nome: 'Cliente', v: x => x.cliente }] : []),

    { id: 'frete', nome: 'Frete int. US$', cls: 'n', v: x => x.frete_usd },
    { id: 'emb', nome: 'Embarque', v: x => x.cp_embarque_ef || x.cp_embarque_prev },
    { id: 'eta', nome: 'ETA', v: x => x.cp_chegada_ef || x.cp_chegada_prev || x.previsao_chegada },

    { id: 'rfi', nome: 'RFI' },
    { id: 'fat', nome: 'Fator', cls: 'n', v: x => fatorEmb(x) },
  ];
  const linhas = ordenar('emb', lista, cols, { col: 'id', dir: 'asc' });

// caixinha "No fluxo" de um pagamento em aberto (leva o valor ao Fluxo de caixa projetado do painel)
function chkFluxo(c, ed) {
  if (c.pago) return '<span class="nota">pago</span>';
  if (!temFluxo(c.empresa)) return '<span class="nota" title="Empresa sem vínculo com o fluxo de caixa da Feromax e Supply">sem fluxo</span>';
  return `<label class="chk-fluxo" title="${c.data_prevista ? 'Levar ao Fluxo de caixa projetado' : 'Informe a data prevista para levar ao fluxo'}"><input type="checkbox" data-fluxo="${c.id}" ${c.no_fluxo ? 'checked' : ''} ${ed && c.data_prevista ? '' : 'disabled'}> No fluxo</label>`;
}
function ligarFluxo(el) {
  el.querySelectorAll('[data-fluxo]').forEach(i => i.onchange = async ev => {
    ev.stopPropagation();
    const c = est.cambios.find(x => x.id === Number(i.dataset.fluxo));
    try { await gravar('imp_cambios', { no_fluxo: i.checked }, c.id, c); } catch (_) { i.checked = !i.checked; }
  });
}

function kpi(rot, val, det) { return `<div class="kpi"><div class="rot">${rot}</div><div class="val">${val}</div><div class="det">${det || ''}</div></div>`; }
function filtroEmpresa() {
  const emps = empresasVisiveis();
  if (emps.length < 2) return '';
  return `<div class="filtros">${[[0, 'Todas'], ...emps.map(e => [e, EMPRESAS[e]])].map(([v, n]) =>
    `<button class="chip" data-emp="${v}" aria-pressed="${est.filtro.empresa === v}">${n}</button>`).join('')}</div>`;
}
function ligarFiltroEmpresa(el) {
  el.querySelectorAll('[data-emp]').forEach(b => b.onclick = () => { est.filtro.empresa = Number(b.dataset.emp); redesenhar(); });
}

// ======================= Processos (lista) =======================
function renderProcessos(el) {
  if (est.abertoId) {
    const p = est.processos.find(x => x.id === est.abertoId);

    est.abertoId = null;
  }
  const f = est.filtro, emps = empresasVisiveis();
  const paises = [...new Set(est.processos.map(paisDe).filter(Boolean))].sort();
  const b = f.busca.trim().toLowerCase();
  const lista = est.processos.filter(p => emps.includes(p.empresa) && (!f.empresa || p.empresa === f.empresa)
    && (!f.status || p.status === f.status) && (!f.pais || paisDe(p) === f.pais)
    && (!b || [p.fornecedor, p.pedido, p.mercadoria, p.processo, p.di, p.embarque, p.cliente, p.bl, p.agente_ref, p.despachante_ref].some(x => String(x || '').toLowerCase().includes(b))))

    { id: 'dped', nome: 'Data pedido', v: x => x.p.data_pedido },

    { id: 'fest', nome: 'Fator est.', cls: 'n', v: x => x.p.fator_estimado != null ? Number(x.p.fator_estimado) : null },
    { id: 'fat', nome: 'Fator', cls: 'n', v: x => x.r.tipoFator === 'estimado' ? null : x.r.fator },
    { id: 'conc', nome: '' },
  ];
  const linhas = ordenar('proc', lista.map(p => ({ p, r: resumo(p), e: etapa(p) })), colsP, { col: 'dped', dir: 'desc' });

  const totTot = comFator.reduce((s, x) => s + x.r.total, 0);
  const fobComFator = comFator.reduce((s, x) => s + x.r.fob, 0);

  el.innerHTML = `<div class="filtros">
    ${emps.length > 1 ? [[0, 'Todas'], ...emps.map(e => [e, EMPRESAS[e]])].map(([v, n]) => `<button class="chip" data-emp="${v}" aria-pressed="${f.empresa === v}">${n}</button>`).join('') + '<div class="sep"></div>' : ''}
    ${[['aberto', 'Em aberto'], ['fechado', 'Fechados'], ['', 'Todos']].map(([v, n]) => `<button class="chip" data-st="${v}" aria-pressed="${f.status === v}">${n}</button>`).join('')}
    <div class="sep"></div>
    <select class="sel" id="fPais"><option value="">Todos os países</option>${paises.map(x => `<option ${x === f.pais ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
    <input class="busca" id="fBusca" type="search" placeholder="Buscar cliente, fornecedor, pedido, mercadoria, DI, BL…" value="${esc(f.busca)}">
    ${podeEditar() ? '<button class="btn-pri" id="btnNovo" style="margin-left:auto">+ Nova importação</button>' : ''}
  </div>
  <div class="card">
    <div class="topo"><h2>${lista.length} processo(s)</h2>
      <span class="nota">FOB ${U0(fobTot)}${fobComFator ? ` · fator médio ponderado ${FT(totTot / fobComFator)}` : ''} · clique no título da coluna para ordenar</span></div>
    <div class="tabela-wrap"><table>
      <thead>${cabecalho('proc', colsP, { col: 'dped', dir: 'desc' })}</thead>
      <tbody>${linhas.length ? linhas.map(({ p, r, e }) => `<tr class="clic" data-p="${p.id}">
        <td>${esc(p.pedido || '—')}${p.embarque ? ` <span class="tag" title="Embarque conjunto ${esc(p.embarque)}: mesma DI, custos rateados">conjunto</span>` : ''}</td>

    </table></div>

  ligarOrdenacao(el);

  $('#fPais').onchange = e => { f.pais = e.target.value; redesenhar(); };
  const busca = $('#fBusca');
  busca.oninput = () => { f.busca = busca.value; clearTimeout(busca._t); busca._t = setTimeout(() => { redesenhar(); const i = $('#fBusca'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); };
  el.querySelectorAll('tr[data-p]').forEach(tr => tr.onclick = () => abrirProcesso(Number(tr.dataset.p)));

}

// ======================= Ficha do processo =======================
function renderFicha(el, p) {
  const r = resumo(p), e = etapa(p), forn = est.fornecedores[p.fornecedor] || {};
  const ed = podeEditar(), hoje = hojeISO();
  const linhaCp = CPS.map(([k, nome]) => {
    const prev = p[`cp_${k}_prev`], ef = p[`cp_${k}_ef`];
    const cls = ef ? 'feito' : (prev && prev < hoje && p.status === 'aberto' ? 'atraso' : '');
    const desvio = ef && prev ? dias(prev, ef) : null;
    return `<div class="etapa ${cls}"><div class="t">${nome}</div>
      <div class="l">Previsto <b>${dm(prev)}</b></div><div class="l">Efetivo <b>${dm(ef)}</b>${desvio ? ` <span class="${desvio > 0 ? 'verm' : 'verde'}">${desvio > 0 ? '+' : ''}${desvio}d</span>` : ''}</div></div>`;
  }).join('');
  const tempoTotal = p.cp_producao_ef && p.cp_estoque_ef ? dias(p.cp_producao_ef, p.cp_estoque_ef) : null;
  const pags = pagamentosDe(p);
  const abertosSemFluxo = temFluxo(p.empresa) && pags.some(c => !c.pago && !c.no_fluxo && c.data_prevista);
  const estm = p.estimativa && p.estimativa.resultado ? p.estimativa : null;
  const temNumerario = pags.some(c => !ehCambio(c));
  const er = estm ? estm.resultado : {};
  const real = k => temNac(p) ? nz(p[k]) : null;
  const linhasEstReal = [
    { nome: 'FOB (US$)', e: estm ? er.fob_usd : null, r: r.fob || null, usd: true },
    { nome: 'Câmbio (R$)' + (r.abertoUSD ? ' <span class="nota">inclui parcelas em aberto pela taxa ref.</span>' : ''), e: estm ? er.cambio_brl : null, r: r.cs.length && !r.semTaxa ? r.pagoBRL + r.abertoBRL : null },
    ...NAC.map(([k, n]) => ({ nome: n, e: estm ? nz(er[k]) : null, r: real(k) })),
    { nome: '<b>Total nacionalização</b>', e: estm ? er.numerario : null, r: temNac(p) ? r.nac : null, forte: true },
    { nome: '<b>Total importação</b>', e: estm ? er.total : null, r: temNac(p) && r.cs.length ? r.total : null, forte: true },
    { nome: '<b>Fator</b>', e: estm ? er.fator : (p.fator_estimado != null ? Number(p.fator_estimado) : null), r: r.tipoFator && r.tipoFator !== 'estimado' ? r.fator : null, fator: true, forte: true },
  ];

  el.innerHTML = `<button class="btn voltar" id="btnVoltar">← Processos</button>

    <h2>${p.cliente ? esc(p.cliente) + ' · ' : ''}${esc(p.fornecedor)} · pedido ${esc(p.pedido || '—')}</h2>
    <span class="tag ${e.cls}">${e.nome}</span>
    ${p.status === 'aberto' && r.conciliado ? '<span class="tag ok">tudo conciliado</span>' : ''}
    <span style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">
      ${ed ? `<button class="btn" id="btnEditar">Editar dados</button>` : ''}
      ${ed && podeFechar() && p.status === 'aberto' ? `<button class="btn-pri" id="btnFechar">Fechar processo</button>` : ''}
      ${ed && podeFechar() && p.status === 'fechado' ? `<button class="btn" id="btnReabrir">Reabrir</button>` : ''}
    </span>
  </div>
  <div class="card">
    <div class="campos">
      ${campo('Empresa', EMPRESAS[p.empresa] || p.empresa)}
      ${campo('País', forn.pais || '—')}
      ${campo('Condição de pagamento', forn.condicao_pagamento || '—')}
      ${campo('Mercadoria', p.mercadoria || '—')}
      ${campo('Modal', p.modal || '—')}
      ${campo('Data do pedido', dm(p.data_pedido))}
      ${p.cliente ? campo('Cliente', p.cliente) : ''}
      ${campo('Despachante', (p.despachante || '—') + (p.despachante_ref ? ' · ref. ' + p.despachante_ref : ''))}
      ${campo('Agente de carga', (p.logistica || '—') + (p.agente_ref ? ' · ref. ' + p.agente_ref : ''))}
      ${campo('Nº processo', p.processo || '—')}
      ${campo('Previsão de chegada', dm(p.previsao_chegada))}
      ${p.tipo_container ? campo('Tipo de contêiner', p.tipo_container) : ''}

    </div>

function linhaEstReal(l) {
  const fmt = v => v == null ? '—' : l.fator ? FT(v) : l.usd ? U(v) : F2.format(v);
  const d = l.e != null && l.r != null ? l.r - l.e : null;
  const pc = d != null && l.e ? d / l.e * 100 : null;
  const cls = d == null || Math.abs(d) < 0.005 ? '' : d > 0 ? 'dif-pos' : 'dif-neg';
  return `<tr${l.forte ? ' style="font-weight:600"' : ''}><td>${l.nome}</td><td class="n">${fmt(l.e)}</td><td class="n">${fmt(l.r)}</td>
    <td class="n ${cls}">${d == null ? '—' : (d > 0 ? '+' : '') + (l.fator ? FT(d) : F2.format(d))}</td><td class="n ${cls}">${pc == null ? '—' : (pc > 0 ? '+' : '') + nf(1).format(pc) + '%'}</td></tr>`;
}
function campo(r, v) { return `<div class="c"><div class="r">${r}</div><div class="v">${esc(v)}</div></div>`; }

// ======================= Calculadora aduaneira =======================
// motor da calculadora aduaneira — método da planilha MATRIZ NEW - VALIDAÇÃO DI (cenário próprio)
// e da MATRIZ - CÁLCULO ADUANEIRO (cenário DHL / courier)
// adições da DI: uma por fornecedor + família/NCM (2 fornecedores com a mesma alíquota = 2 adições) — regra da planilha de validação da DI
function contarAdicoes(itens) { return new Set(itens.map(x => String(x.forn ?? x.proc ?? '') + '|' + (x.familia || '?'))).size; }
function taxaSiscomex(n) {
  n = Math.max(0, Math.round(n || 0));
  if (!n) return 0;
  return 115.67 + Math.min(n, 2) * 38.56 + Math.max(Math.min(n - 2, 3), 0) * 30.85 + Math.max(Math.min(n - 5, 5), 0) * 23.14
    + Math.max(Math.min(n - 10, 10), 0) * 15.42 + Math.max(Math.min(n - 20, 30), 0) * 7.71 + Math.max(n - 50, 0) * 3.86;
}
function calcularAduaneiro(itens, pr, aliq) {
  const n = v => Number(v) || 0;
  const linhas = itens.map(it => ({ ...it, fobT: n(it.qtd) * n(it.fob), pesoT: n(it.qtd) * n(it.peso), a: aliq[it.familia] || null }));   // peso = peso líquido UNITÁRIO (kg)
  const sumF = linhas.reduce((s, x) => s + x.fobT, 0);
  const sumP = linhas.reduce((s, x) => s + x.pesoT, 0);
  const porPeso = sumP > 0 && linhas.every(x => x.pesoT > 0);          // frete rateado por peso líquido (como na DI)
  const parteFrete = x => porPeso ? x.pesoT / sumP : (sumF ? x.fobT / sumF : 0);
  const di = n(pr.dolar_di), dc = n(pr.dolar_cambio) || di, fu = n(pr.frete_usd), acr = n(pr.outros_acresc);
  const vmld = sumF + fu;
  // adição = fornecedor (processo) + NCM/família, como na planilha de validação da DI
  const adicoes = n(pr.adicoes) || contarAdicoes(linhas.filter(x => x.fobT));
  const sisc = taxaSiscomex(adicoes);
  const freteBRL = fu * di + n(pr.frete_desp);
  const base0 = () => ({ fob_usd: sumF, cambio_brl: sumF * dc, frete_brl: 0, ii: 0, ipi: 0, pis: 0, cofins: 0, icms: 0, siscomex: 0, afrmm: 0, sdas: 0,
    sdas_afrmm_siscomex: 0, armazenagem: 0, despachante_valor: 0, outras_despesas: 0, frete_nacional: 0 });
  const fe = base0(), dh = base0();
  // ---- próprio (método DI)
  const it = linhas.map(x => {
    const a = x.a || {};
    const freteU = fu * parteFrete(x), acrU = sumF ? acr * x.fobT / sumF : 0;
    const O = (x.fobT + freteU + acrU) * di;                       // base II, PIS, COFINS (valor aduaneiro)
    const ii = n(a.ii) * O, pis = n(a.pis) * O, cof = n(a.cofins) * O;
    const ipi = n(a.ipi) * (O + ii);
    const parteV = vmld ? (x.fobT + freteU + acrU) / vmld : 0;
    const sc = sisc * parteV, af = n(pr.afrmm) * parteV;
    const baseIcms = n(a.icms) < 1 ? (O + ii + pis + cof + ipi + sc + af) / (1 - n(a.icms)) : 0;
    const icms = baseIcms * n(a.icms);
    return { ii, pis, cofins: cof, ipi, icms, sc, af, baseIcms };
  });
  const sumBase = it.reduce((s, x) => s + x.baseIcms, 0);
  const despIcms = n(pr.armazenagem) + n(pr.sdas) + n(pr.despachante) + n(pr.outras);   // rateadas pela base do ICMS
  linhas.forEach((x, i) => {
    const y = it[i];
    for (const k of ['ii', 'ipi', 'pis', 'cofins', 'icms']) fe[k] += y[k];
    fe.siscomex += y.sc; fe.afrmm += y.af;
    const pd = sumBase ? y.baseIcms / sumBase : (sumF ? x.fobT / sumF : 0);       // despesas rateadas pela base do ICMS
    const pf = parteFrete(x);
    x.pF = { fob_usd: x.fobT, cambio_brl: x.fobT * dc, ii: y.ii, pis: y.pis, cofins: y.cofins, ipi: y.ipi, icms: y.icms, siscomex: y.sc, afrmm: y.af,
      sdas: n(pr.sdas) * pd, armazenagem: n(pr.armazenagem) * pd, despachante_valor: n(pr.despachante) * pd, outras_despesas: n(pr.outras) * pd,
      frete_brl: freteBRL * pf, frete_nacional: n(pr.frete_nacional) * pf, frete_usd: fu * pf };
    x.pF.sdas_afrmm_siscomex = x.pF.sdas + x.pF.siscomex + x.pF.afrmm;
    const custo = x.fobT * dc + y.ii + y.pis + y.cofins + y.ipi + y.icms + y.sc + y.af
      + (sumBase ? despIcms * y.baseIcms / sumBase : 0) + (freteBRL + n(pr.frete_nacional)) * parteFrete(x);
    x.fatorF = x.fobT ? custo / x.fobT : null; x.custoUnF = x.fatorF != null ? n(x.fob) * x.fatorF : null;
  });
  if (!sumBase) { fe.siscomex = sisc; fe.afrmm = n(pr.afrmm); }
  fe.sdas = n(pr.sdas);
  fe.sdas_afrmm_siscomex = fe.sdas + fe.siscomex + fe.afrmm;
  fe.armazenagem = n(pr.armazenagem); fe.despachante_valor = n(pr.despachante); fe.outras_despesas = n(pr.outras);
  fe.frete_nacional = n(pr.frete_nacional); fe.frete_brl = freteBRL;
  fe.adicoes = adicoes; fe.rateio_frete = porPeso ? 'peso' : 'fob';
  // ---- DHL / courier (planilha de cálculo aduaneiro)
  dh.frete_brl = fu * di; dh.outras_despesas = n(pr.dhl_despesas);   // frete DHL sem acréscimo: o valor é informado manualmente em cada estimativa
  // DHL (remessa expressa): valor aduaneiro = (FOB + frete rateado) × dólar DI; II = 60% do valor aduaneiro;
  // ICMS "por dentro" sobre valor aduaneiro + II: (VA + II) ÷ (1 − ICMS) × ICMS  — confere com a cobrança DHL 6516931
  //   (a DHL trunca os centavos em cada valor: frete 1.181,3967 → 1.181,39)
  const tr2 = v => Math.floor(v * 100 + 1e-7) / 100;
  const itD = linhas.map(x => { const a = x.a || {}; const baseD = tr2(x.fobT * di) + tr2(fu * parteFrete(x) * di); const iiD = tr2(n(a.ii_dhl) * baseD);
    const icD = n(a.icms_dhl) < 1 ? tr2((baseD + iiD) / (1 - n(a.icms_dhl)) * n(a.icms_dhl)) : 0; return { ii: iiD, icms: icD, imp: iiD + icD }; });
  const somaD = itD.reduce((s, x) => s + x.imp, 0);
  linhas.forEach((x, i) => {
    const d = itD[i]; dh.ii += d.ii; dh.icms += d.icms;
    const despD = somaD ? d.imp * n(pr.dhl_despesas) / somaD : (sumF ? n(pr.dhl_despesas) * x.fobT / sumF : 0), freteD = sumF ? x.fobT * dh.frete_brl / sumF : 0;
    x.pD = { ...base0(), fob_usd: x.fobT, cambio_brl: x.fobT * dc, ii: d.ii, icms: d.icms, outras_despesas: despD, frete_brl: freteD, frete_usd: fu * parteFrete(x) };
    const custoD = d.imp + x.fobT * dc + despD + freteD;
    x.fatorD = x.fobT ? custoD / x.fobT : null; x.custoUnD = x.fatorD != null ? n(x.fob) * x.fatorD : null;
  });
  const fecha = (r, fob = sumF) => {
    r.impostos = r.ii + r.ipi + r.pis + r.cofins + r.icms;
    r.despesas = r.sdas_afrmm_siscomex + r.armazenagem + r.despachante_valor + r.outras_despesas + r.frete_nacional;
    r.numerario = r.impostos + r.despesas + r.frete_brl;
    r.total = r.cambio_brl + r.numerario;
    r.fator = fob ? r.total / fob : null;
    r.creditos = r.icms + r.ipi;
    r.custo_real = r.total - r.creditos;
    r.fator2 = fob ? r.custo_real / fob : null;
    r.dif_cambial = fob * (dc - di);
    return r;
  };
  // rateio por processo (embarque conjunto: vários fornecedores numa DI) — soma das partes de cada item, como a planilha de validação da DI
  const porProc = {};
  for (const x of linhas) {
    const k = x.proc || 0;
    const g = porProc[k] || (porProc[k] = { feromax: { ...base0(), fob_usd: 0, cambio_brl: 0, frete_usd: 0 }, dhl: { ...base0(), fob_usd: 0, cambio_brl: 0, frete_usd: 0 }, peso: 0 });
    g.peso += x.pesoT;
    for (const [cen, parte] of [['feromax', x.pF], ['dhl', x.pD]]) for (const c in parte) g[cen][c] = (g[cen][c] || 0) + parte[c];
  }
  for (const g of Object.values(porProc)) { fecha(g.feromax, g.feromax.fob_usd); fecha(g.dhl, g.dhl.fob_usd); }
  return { itens: linhas, feromax: fecha(fe), dhl: fecha(dh), porProc, semAliq: linhas.filter(x => !x.a).map(x => x.familia) };
}

// premissas: gerais + uma coluna por cenário (aéreo e marítimo repetem as despesas; DHL só frete e despesas DHL)
const PREM_GERAL = [['dolar_di', 'Dólar DI estimado'], ['dolar_cambio', 'Dólar câmbio estimado'], ['outros_acresc', 'Outros acréscimos (US$)'], ['adicoes', 'Nº de adições (automático)']];
const PREM_LIN = [ // [chave, nome, cenários: a = aéreo, m = marítimo, d = DHL]
  ['frete_usd', 'Frete internacional (US$)', 'amd'], ['frete_desp', 'Despesas do frete internacional (R$)', 'am'], ['afrmm', 'AFRMM (R$) · aprox. 8% do frete', 'm'],
  ['sdas', 'SDAS (R$)', 'am'], ['armazenagem', 'Armazenagem (R$)', 'am'], ['despachante', 'Despachante (R$)', 'am'], ['frete_nacional', 'Frete nacional (R$)', 'am'],
  ['outras', 'Outras despesas (R$)', 'am'], ['despesas', 'Despesas DHL (R$)', 'd']];
const PREFIXO = { a: 'aereo', m: 'maritimo', d: 'dhl' };
const PREM_CHAVES = [...PREM_GERAL.map(([k]) => k), ...PREM_LIN.flatMap(([k, , cs]) => [...cs].map(x => x + '_' + k))];
const ALQ = [['ii', 'II'], ['ipi', 'IPI'], ['icms', 'ICMS'], ['pis', 'PIS'], ['cofins', 'COFINS'], ['ii_dhl', 'II DHL'], ['icms_dhl', 'ICMS DHL']];
const CENARIOS = { aereo: 'Aéreo', maritimo: 'Marítimo', dhl: 'DHL (courier)' };
const cenarioDoModal = p => /mar/i.test((p && p.modal) || '') ? 'maritimo' : 'aereo';
// premissas antigas (um cenário "próprio" + DHL) → novas: vão para a coluna do modal do processo
function premissasV2(pr, p) {
  if (!pr || pr.versao === 2) return pr;
  const cen = cenarioDoModal(p)[0], o = { versao: 2 };
  for (const [k] of PREM_GERAL) o[k] = pr[k];
  for (const k of ['frete_usd', 'frete_desp', 'afrmm', 'sdas', 'armazenagem', 'despachante', 'frete_nacional', 'outras'])
    o[cen + '_' + k] = k === 'frete_desp' ? (pr.frete_desp ?? pr.logistica) : (k === 'afrmm' && cen !== 'm' ? null : pr[k]);
  o.d_frete_usd = pr.frete_usd; o.d_despesas = pr.dhl_despesas;
  return o;
}
const cenarioV2 = (cen, p) => !cen || cen === 'feromax' ? cenarioDoModal(p) : cen;
// calcula os 3 cenários com o mesmo motor (método da DI)
function calcular3(itens, P, aliq) {
  const g = { dolar_di: P.dolar_di, dolar_cambio: P.dolar_cambio, outros_acresc: P.outros_acresc, adicoes: P.adicoes };
  const modal = x => ({ ...g, frete_usd: P[x + '_frete_usd'], frete_desp: P[x + '_frete_desp'], afrmm: P[x + '_afrmm'], sdas: P[x + '_sdas'], armazenagem: P[x + '_armazenagem'],
    despachante: P[x + '_despachante'], frete_nacional: P[x + '_frete_nacional'], outras: P[x + '_outras'], dhl_despesas: P.d_despesas });
  const rA = calcularAduaneiro(itens, modal('a'), aliq), rM = calcularAduaneiro(itens, modal('m'), aliq);
  const rD = calcularAduaneiro(itens, { ...g, frete_usd: P.d_frete_usd, dhl_despesas: P.d_despesas }, aliq);
  const itensR = rA.itens.map((x, i) => ({ ...x, fatorA: x.fatorF, fatorM: rM.itens[i].fatorF, fatorD: rD.itens[i].fatorD, custoUnA: x.custoUnF, custoUnM: rM.itens[i].custoUnF, custoUnD: rD.itens[i].custoUnD }));
  const porProc = {};
  for (const k of Object.keys(rA.porProc)) porProc[k] = { aereo: rA.porProc[k].feromax, maritimo: rM.porProc[k].feromax, dhl: rD.porProc[k].dhl, peso: rA.porProc[k].peso };
  return { itens: itensR, aereo: rA.feromax, maritimo: rM.feromax, dhl: rD.dhl, porProc, semAliq: rA.semAliq, adicoes: rA.feromax.adicoes, rateio_frete: rA.feromax.rateio_frete };
}

// processos do mesmo embarque (uma DI para vários fornecedores/pedidos)
const doEmbarque = p => p && p.embarque ? est.processos.filter(x => x.embarque === p.embarque).sort((a, b) => a.id - b.id) : (p ? [p] : []);
const nomeProc = p => p ? `${p.pedido || 's/ pedido'} · ${p.fornecedor}` : '—';
function novaCalc(p) {
  const emb = p && p.estimativa && p.estimativa.embarque;
  const grupo = doEmbarque(p);
  // estimativa conjunta: abre todos os itens do embarque (de todos os processos)
  const e = (p && p.estimativa) || (grupo.find(x => x.estimativa) || {}).estimativa;   // premissas e cenário
  const ref = est.cambioRef ? String(est.cambioRef).replace('.', ',') : '';
  const ids = grupo.map(x => x.id);
  const txt = v => v != null && v !== '' ? String(v).replace('.', ',') : '';
  const deItens = (lista, proc) => lista.map(x => ({ codigo: x.codigo || '', qtd: String(x.qtd ?? ''), fob: txt(x.fob), familia: x.familia || '', peso: x.peso ? txt(x.peso) : '',
    proc: ids.includes(x.proc) ? x.proc : proc }));
  const linhaFob = x => ({ codigo: '', qtd: '1', fob: x && x.fob_usd ? txt(x.fob_usd) : '', familia: '', peso: '', proc: x ? x.id : null });
  // itens: estimativa conjunta salva → todos os itens; senão, os itens da estimativa de cada processo (ou uma linha com o FOB)
  const itensIniciais = () => emb && emb.itens && emb.itens.length && grupo.length > 1 ? deItens(emb.itens, ids[0])
    : grupo.length ? grupo.flatMap(x => x.estimativa && x.estimativa.itens && x.estimativa.itens.length ? deItens(x.estimativa.itens, x.id) : [linhaFob(x)]) : [linhaFob(null)];
  return {
    processo_id: p ? (ids[0] || p.id) : null,
    processos: ids,
    cenario: e && e.cenario ? cenarioV2(e.cenario, p) : cenarioDoModal(p),
    premissas: e && e.premissas ? (pv => Object.fromEntries(PREM_CHAVES.map(k => [k, pv[k] != null && pv[k] !== 0 ? String(pv[k]).replace('.', ',') : ''])))(premissasV2(e.premissas, p)) :
      { ...Object.fromEntries(PREM_CHAVES.map(k => [k, ''])), dolar_di: ref, dolar_cambio: ref, d_despesas: '250' },
    itens: itensIniciais(),
  };
}
// participantes da calculadora: processos já criados + fornecedores novos (viram processo ao salvar)
function grupoCalc(c) {
  const reais = (c.processos || []).map(id => est.processos.find(x => x.id === id)).filter(Boolean)
    .map(x => ({ id: x.id, fornecedor: x.fornecedor, nome: nomeProc(x), pais: paisDe(x), p: x }));
  const novos = (c.novos || []).map(n => ({ id: n.key, fornecedor: n.fornecedor, nome: `novo · ${n.fornecedor}`, pais: (est.fornecedores[n.fornecedor] || {}).pais || '', novo: true }));
  return [...reais, ...novos];
}
const chaveProc = (c, v) => { const g = grupoCalc(c); const n = Number(v);
  const x = g.find(y => y.id === v) || g.find(y => typeof y.id === 'number' && y.id === n) || g.find(y => String(y.id) === String(v)); return x ? x.id : (g[0] ? g[0].id : null); };
function abrirCalculadora(p) { est.calc = novaCalc(p); est.abertoId = null; abrir('calculadora'); window.scrollTo(0, 0); }
const numCalc = v => Number(paraNum(v)) || 0;
function resultadoCalc() {
  const c = est.calc;
  const procs = c.processos || [];
  const g = grupoCalc(c);
  const fornDe = id => { const y = g.find(z => z.id === id); return y ? y.fornecedor : id; };
  const itens = c.itens.filter(x => numCalc(x.qtd) && numCalc(x.fob)).map(x => { const proc = g.length ? chaveProc(c, x.proc) : null;
    return { codigo: x.codigo, qtd: numCalc(x.qtd), fob: numCalc(x.fob), familia: x.familia, peso: numCalc(x.peso) || null, proc, forn: fornDe(proc) }; });
  const pr = { versao: 2, ...Object.fromEntries(PREM_CHAVES.map(k => [k, numCalc(c.premissas[k])])) };
  return { itens, pr, r: calcular3(itens, pr, est.aliquotas) };
}

  el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { c.itens.splice(Number(b.dataset.rm), 1); redesenhar(); });
  $('#cItem').onclick = () => { const ult = c.itens[c.itens.length - 1]; c.itens.push({ codigo: '', qtd: '1', fob: '', familia: '', peso: '', proc: ult ? ult.proc : c.processo_id }); redesenhar(); };
  $('#cColar').onclick = colarItens;
  el.querySelectorAll('[data-cen]').forEach(b => b.onclick = () => { c.cenario = b.dataset.cen; redesenhar(); });
  $('#cAliq').ontoggle = e => { est.calcAliqAberto = e.target.open; };
  if ($('#cSalvar')) $('#cSalvar').onclick = salvarEstimativa;
  if ($('#cRealizado')) $('#cRealizado').onclick = lancarRealizado;
  if ($('#aqSalvar')) $('#aqSalvar').onclick = async () => {
    const pc = v => { const t = paraNum(v); return t === '' ? null : Number(t) / 100; };
    const lista = familias.map(f => { const o = { familia: f }; for (const [k] of ALQ) o[k] = pc(el.querySelector(`[data-aq="${CSS.escape(f)}"][data-ak="${k}"]`).value); return o; });
    const nova = $('#aqNova').value.trim().toUpperCase();
    if (nova) { const o = { familia: nova }; for (const [k] of ALQ) o[k] = pc(el.querySelector(`[data-aqn="${k}"]`).value); lista.push(o); }
    if (lista.some(o => ALQ.some(([k]) => o[k] != null && (isNaN(o[k]) || o[k] < 0 || o[k] >= 1)))) return void ($('#aqMsg').textContent = 'Verifique os valores (0 a 99,99%).');
    try { await gravarAliquotas(lista); est.calcAliqAberto = true; redesenhar(); } catch (e) { $('#aqMsg').textContent = e.message; }
  };
  atualizarCalc();
}

function atualizarCalc() {
  const c = est.calc; const { r } = resultadoCalc();
  const set = (id, v) => { const td = document.getElementById(id); if (td) td.innerHTML = v; };
  // colunas calculadas de cada item
  let k = 0, pesoT = 0, qtdT = 0, fobT = 0, semPeso = 0;
  const cu = { aereo: 'custoUnA', maritimo: 'custoUnM', dhl: 'custoUnD' }[c.cenario];
  c.itens.forEach((x, i) => {
    const ok = numCalc(x.qtd) && numCalc(x.fob);
    const it = ok ? r.itens[k++] : null;
    const pt = numCalc(x.peso) * numCalc(x.qtd);
    if (ok) { qtdT += numCalc(x.qtd); fobT += it.fobT; pesoT += pt; if (!pt) semPeso++; }
    set('cFob' + i, it ? F2.format(it.fobT) : '—');
    set('cPesoT' + i, pt ? nf(3).format(pt) : '—');
    set('cFtA' + i, it && it.a ? FT(it.fatorA) : '—'); set('cFtM' + i, it && it.a ? FT(it.fatorM) : '—'); set('cFtD' + i, it && it.a ? FT(it.fatorD) : '—');
    set('cCu' + i, it && it.a ? F2.format(it[cu]) : '—');
  });
  // peso total (para estimar o frete) e totais da tabela
  set('cPesoTotal', pesoT ? nf(3).format(pesoT) + ' kg' + (semPeso ? ` <span class="nota verm">(${semPeso} item(ns) sem peso)</span>` : '') : '<span class="nota">informe o peso unitário dos itens</span>');
  set('cQtdT', nf(0).format(qtdT)); set('cPesoTT', pesoT ? nf(3).format(pesoT) : '—'); set('cFobT', F2.format(fobT));
  // adições: automático (fornecedor × família); o campo mostra o valor calculado enquanto não for digitado outro
  const auto = contarAdicoes(r.itens);
  const inpA = document.querySelector('[data-pr=adicoes]');
  if (inpA && !String(c.premissas.adicoes || '').trim() && document.activeElement !== inpA) inpA.value = auto || '';
  set('cAdicoesInfo', String(c.premissas.adicoes || '').trim() && numCalc(c.premissas.adicoes) !== auto ? `· digitado (automático: ${auto})` : '· fornecedor × família');
  const A = r.aereo, M = r.maritimo, D = r.dhl;
  const fmt = (v, opt) => opt.f ? FT(v) : opt.u ? U(v) : F2.format(v);
  const lin = (n, a, m, d, opt = {}) => `<tr${opt.forte ? ' style="font-weight:650"' : ''}><td>${n}</td>${[['aereo', a], ['maritimo', m], ['dhl', d]].map(([cen, v]) => `<td class="n${cen === c.cenario ? ' cen-sel' : ''}">${v == null ? '<span class="nota">—</span>' : fmt(v, opt)}</td>`).join('')}</tr>`;
  const L = (n, key, opt) => lin(n, A[key], M[key], D[key], opt);
  const box = document.getElementById('cResultado'); if (!box) return;
  const semFam = [...new Set(r.semAliq)];
  box.innerHTML = `<div class="topo"><h2>Resultado</h2><span class="nota">cenário marcado para salvar: <b>${CENARIOS[c.cenario]}</b> · ${r.adicoes} adição(ões) · frete rateado por ${r.rateio_frete === 'peso' ? 'peso líquido' : 'FOB (informe o peso de todos os itens para ratear por peso)'}</span></div>
    ${semFam.length ? `<div class="nota verm" style="margin-bottom:8px">Itens sem família/alíquota (impostos zerados): ${semFam.map(x => esc(x || 'sem família')).join(', ')}</div>` : ''}
    <div class="tabela-wrap"><table class="res3">
      <thead><tr><th></th>${Object.entries(CENARIOS).map(([k2, n]) => `<th class="n${k2 === c.cenario ? ' cen-sel' : ''}">${n}</th>`).join('')}</tr></thead>
      <tbody>
        ${L('Valor total da invoice (FOB)', 'fob_usd', { u: true })}
        ${L('Câmbio (FOB × dólar câmbio)', 'cambio_brl')}
        ${L('Diferença cambial (câmbio − DI)', 'dif_cambial')}
        ${L('II', 'ii')}${L('PIS', 'pis')}${L('COFINS', 'cofins')}${L('IPI', 'ipi')}${L('ICMS', 'icms')}
        ${L('Impostos total', 'impostos', { forte: true })}
        ${L(`Taxa Siscomex (${r.adicoes} adição(ões))`, 'siscomex')}
        ${lin('AFRMM', null, M.afrmm, null)}
        ${L('SDAS', 'sdas')}
        ${L('Armazenagem', 'armazenagem')}
        ${L('Despachante', 'despachante_valor')}
        ${L('Outras despesas / despesas DHL', 'outras_despesas')}
        ${L('Frete internacional (R$)', 'frete_brl')}
        ${L('Frete nacional', 'frete_nacional')}
        ${L('Numerários total', 'numerario', { forte: true })}
        ${L('Total importação', 'total', { forte: true })}
        ${L('Fator de importação', 'fator', { f: true, forte: true })}
        ${L('Crédito ICMS + IPI', 'creditos')}
        ${L('Custo real (sem créditos)', 'custo_real')}
        ${L('Fator 2 (sem créditos)', 'fator2', { f: true })}
      </tbody></table></div>${tabelaRateio(r, c)}`;
}

// rateio da DI conjunta por processo (cenário marcado)

  const gc = grupoCalc(c);
  if (gc.length < 2) return '';
  const g = gc.filter(y => r.porProc[y.id]).map(y => ({ nome: y.nome, x: r.porProc[y.id][c.cenario], peso: r.porProc[y.id].peso }));
  const tot = r[c.cenario];
  const desp = x => x.sdas_afrmm_siscomex + x.armazenagem + x.despachante_valor + x.outras_despesas;
  const L = [['FOB (US$)', x => U(x.fob_usd)], ['Frete internacional rateado (US$)', x => U(x.frete_usd || 0)], ['Câmbio (R$)', x => F2.format(x.cambio_brl)],
    ['II', x => F2.format(x.ii)], ['IPI', x => F2.format(x.ipi)], ['PIS', x => F2.format(x.pis)], ['COFINS', x => F2.format(x.cofins)], ['ICMS', x => F2.format(x.icms)],
    ['SDAS / AFRMM / Siscomex', x => F2.format(x.sdas_afrmm_siscomex)], ['Armazenagem', x => F2.format(x.armazenagem)], ['Despachante', x => F2.format(x.despachante_valor)],
    ['Outras despesas', x => F2.format(x.outras_despesas)], ['Frete internacional (R$)', x => F2.format(x.frete_brl)], ['Frete nacional', x => F2.format(x.frete_nacional)],
    ['<b>Numerário</b>', x => '<b>' + F2.format(x.numerario) + '</b>'], ['<b>Total importação</b>', x => '<b>' + F2.format(x.total) + '</b>'], ['<b>Fator</b>', x => '<b>' + FT(x.fator) + '</b>'],
    ['Fator 2 (sem créditos)', x => FT(x.fator2)]];
  const semItens = gc.filter(y => !r.porProc[y.id]).map(y => y.nome);
  return `<div class="topo" style="margin-top:16px"><h2>Rateio por processo · ${CENARIOS[c.cenario]}</h2><span class="nota">${g.some(y => !y.peso) ? 'frete rateado por FOB (falta peso em algum item)' : 'frete rateado por peso líquido'}</span></div>
    ${semItens.length ? `<div class="nota verm" style="margin-bottom:8px">Sem itens na calculadora: ${semItens.map(esc).join(', ')}</div>` : ''}
    <div class="tabela-wrap"><table>
      <thead><tr><th></th>${g.map(y => `<th class="n">${esc(y.nome)}</th>`).join('')}<th class="n">Total da DI</th></tr></thead>
      <tbody>${g.some(y => y.peso) ? `<tr><td>Peso líquido (kg)</td>${g.map(y => `<td class="n">${nf(3).format(y.peso)}</td>`).join('')}<td class="n">${nf(3).format(g.reduce((s, y) => s + y.peso, 0))}</td></tr>` : ''}
        ${L.map(([n, f]) => `<tr><td>${n}</td>${g.map(y => `<td class="n">${f(y.x)}</td>`).join('')}<td class="n">${f({ ...tot, frete_usd: g.reduce((s, y) => s + (y.x.frete_usd || 0), 0) })}</td></tr>`).join('')}
        <tr><td>Despesas rateadas (sem impostos e fretes)</td>${g.map(y => `<td class="n">${F2.format(desp(y.x))}</td>`).join('')}<td class="n">${F2.format(desp(tot))}</td></tr>
      </tbody></table></div>`;
}

function colarItens() {
  const m = abrirModal(`<h2>Colar itens da planilha</h2>
    <div class="nota" style="margin-bottom:8px">Copie do Excel as colunas <b>Código · Quantidade · FOB unitário · Família · Peso líquido unitário (kg)</b> (família e peso são opcionais: se o código estiver no cadastro de produtos, vêm de lá) e cole abaixo.</div>
    <textarea id="cTxt" rows="10" style="width:100%;font:inherit;font-size:13px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)"></textarea>
    ${grupoCalc(est.calc).length > 1 ? `<label class="chk-fluxo" style="margin-top:8px">Fornecedor destes itens: <select class="sel" id="cColProc">${grupoCalc(est.calc).map(g => `<option value="${esc(String(g.id))}">${esc(g.nome)}</option>`).join('')}</select></label>` : ''}
    <label class="chk-fluxo" style="margin-top:8px"><input type="checkbox" id="cSubst" checked> Substituir os itens atuais${(est.calc.processos || []).length > 1 ? ' deste processo' : ''}</label>

    <div class="rodape"><button class="btn" data-fechar>Cancelar</button><button class="btn-pri" id="cOk">Incluir</button></div>`);
  m.querySelector('#cOk').onclick = () => {
    const fams = Object.keys(est.aliquotas);
    const achaFam = t => { t = String(t || '').trim(); return fams.find(f => f.toLowerCase() === t.toLowerCase()) || t.toUpperCase(); };
    const linhas = m.querySelector('#cTxt').value.split(/\r?\n/).map(l => l.split(/\t|;/).map(x => x.trim())).filter(l => l.some(Boolean));
    const novos = [], selP = m.querySelector('#cColProc'), procCol = selP ? chaveProc(est.calc, selP.value) : (grupoCalc(est.calc)[0] || {}).id ?? null;
    for (const l of linhas) {
      if (l.length < 3) continue;
      if (isNaN(Number(paraNum(l[1]))) || isNaN(Number(paraNum(l[2])))) continue; // cabeçalho
      novos.push({ codigo: l[0], qtd: l[1], fob: l[2], familia: l[3] ? achaFam(l[3]) : '', peso: l[4] || '', proc: procCol });
    }
    if (!novos.length) return void (m.querySelector('#cErr').textContent = 'Nenhuma linha reconhecida (código, quantidade, FOB).');
    novos.forEach(completarDoCadastro);

    est.calc.itens = m.querySelector('#cSubst').checked ? outros.concat(novos) : est.calc.itens.filter(x => numCalc(x.fob)).concat(novos);

  };
}

// cria os processos dos fornecedores novos da calculadora (mesma empresa, já no mesmo embarque)
async function criarNovosDaCalc(c) {
  if (!c.novos || !c.novos.length) return true;
  const base = est.processos.find(x => x.id === c.processo_id);
  const { itens } = resultadoCalc();
  const usados = c.novos.filter(n => itens.some(i => i.proc === n.key));
  if (!usados.length) return alertaErro('Inclua itens para o fornecedor novo (coluna Fornecedor dos itens).'), false;
  const resp = await new Promise(res => {
    const { m } = form('Criar processo(s) do(s) fornecedor(es) novo(s)', [
      ['', [...(base ? [] : [['empresa', 'Empresa', 'select', empresasVisiveis().map(e => [e, EMPRESAS[e]])], ['cliente', 'Cliente (se for importação para cliente)', 'text'],
        ['modal', 'Modal', 'select', [['Marítimo', 'Marítimo'], ['Aéreo', 'Aéreo'], ['Courier', 'Courier (DHL, FedEx…)']]]]),
        ...usados.map(n => ['ped_' + n.key, `Pedido · ${n.fornecedor} (opcional)`, 'text'])]],
    ], {}, async v => res(v));
    m.querySelector('[data-fechar]').addEventListener('click', () => res(null));
  });
  if (!resp) return false;
  const empresa = base ? base.empresa : Number(resp.empresa);
  const todosNomes = [...grupoCalc(c).filter(g => !g.novo || usados.includes(c.novos.find(n => n.key === g.id))).map(g => g.p ? (g.p.pedido || g.p.fornecedor) : (resp['ped_' + g.id] || g.fornecedor))];
  const codigo = (base && base.embarque) || (todosNomes.length > 1 ? 'EMB-' + todosNomes.join('-').replace(/\s+/g, '').slice(0, 40) + '-' + hojeISO().slice(2).replace(/-/g, '') : null);
  for (const n of usados) {
    if (!est.fornecedores[n.fornecedor]) await gravarFornecedor({ nome: n.fornecedor, pais: null, condicao_pagamento: null });
    const reg = { empresa, fornecedor: n.fornecedor, pedido: resp['ped_' + n.key] || null, status: 'aberto', embarque: codigo,
      modal: base ? base.modal : resp.modal, cliente: base ? base.cliente : (resp.cliente || null), data_pedido: hojeISO(), atualizado_em: new Date().toISOString() };
    const id = await inserirSemRecarregar('imp_processos', reg);
    c.itens.forEach(i => { if (String(i.proc) === n.key) i.proc = id; });
    c.processos.push(id);
  }
  // processos já existentes passam para o mesmo embarque
  if (codigo) for (const id of c.processos) { const x = est.processos.find(y => y.id === id); if (x && x.embarque !== codigo) await gravar('imp_processos', { embarque: codigo }, x.id, x, true); }
  c.novos = c.novos.filter(n => !usados.includes(n));
  c.itens = c.itens.filter(i => typeof i.proc !== 'string' || !i.proc.startsWith('n'));
  if (!est.demo) await recarregar();
  if (!c.processo_id) c.processo_id = c.processos[0];
  return true;
}
function formNovoFornCalc(c) {

  form('Incluir fornecedor na estimativa', [['', [['forn', 'Fornecedor (ainda sem processo)', 'lista', nomes]]]], {}, async v => {
    if (!v.forn) throw new Error('Informe o fornecedor.');

    if (vazia && grupoCalc(c).length === 1) vazia.proc = key; else c.itens.push({ codigo: '', qtd: '1', fob: '', familia: '', peso: '', proc: key });

  });
}

async function salvarEstimativa() {
  const c = est.calc;
  if (!(await criarNovosDaCalc(c))) return;
  const p = est.processos.find(x => x.id === c.processo_id);
  if (!p) return;
  const { itens, pr, r } = resultadoCalc();
  if (!itens.length) return alertaErro('Informe pelo menos um item com quantidade e FOB.');
  if (!pr.dolar_di) return alertaErro('Informe o dólar DI estimado.');
  const res = r[c.cenario];
  const grupo = (c.processos && c.processos.length ? c.processos : [p.id]).map(id => est.processos.find(x => x.id === id)).filter(Boolean);
  const multi = grupo.length > 1;
  if (multi) { const sem = grupo.filter(g => !r.porProc[g.id]); if (sem.length) return alertaErro(`Sem itens na calculadora para: ${sem.map(nomeProc).join(', ')}. Inclua os itens ou tire o processo do embarque.`); }
  const arred = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, typeof v === 'number' ? Math.round(v * 1e6) / 1e6 : v]));
  const comAliq = lista => lista.map(x => ({ ...x, aliq: est.aliquotas[x.familia] ? Object.fromEntries(ALQ.map(([k]) => [k, est.aliquotas[x.familia][k]])) : null }));
  const codigo = multi ? (grupo.find(g => g.embarque) || {}).embarque || 'EMB-' + grupo.map(g => g.pedido || g.id).join('-') : null;
  const partes = grupo.map(g => ({ g, res: multi ? r.porProc[g.id][c.cenario] : res, dataNum: g.cp_numerario_prev || g.cp_chegada_prev || g.previsao_chegada }));
  const msg = multi
    ? `Embarque conjunto <b>${esc(codigo)}</b> · total da DI ${R0(res.total)} · numerário ${R0(res.numerario)} (${CENARIOS[c.cenario]}).<br><br>Cada processo recebe a sua parte:<br>
      ${partes.map(x => `• ${esc(nomeProc(x.g))}: fator <b>${FT(x.res.fator)}</b> · numerário ${R0(x.res.numerario)}${!temFluxo(x.g.empresa) ? ' · sem fluxo de caixa (empresa só de importação)' : x.dataNum ? ` · fluxo em ${dm(x.dataNum)}` : ' · <b>sem data</b> para o fluxo'}`).join('<br>')}<br><br>
      Os pesos digitados vão para o cadastro de produtos como validados. Salvar?`
    : `Fator estimado <b>${FT(res.fator)}</b> · total ${R0(res.total)} · numerário ${R0(res.numerario)} (${CENARIOS[c.cenario]}).<br><br>
    Os pesos digitados vão para o cadastro de produtos como validados.<br>
    O numerário previsto ${!temFluxo(p.empresa) ? 'é criado como pagamento a fazer (esta empresa não tem vínculo com o fluxo de caixa)' : partes[0].dataNum ? `entra no Fluxo de caixa projetado em <b>${dm(partes[0].dataNum)}</b> (data prevista do numerário/chegada)` : 'é criado, mas <b>sem data</b>: informe a previsão de chegada ou do numerário para ele entrar no fluxo'}.<br><br>Salvar no pedido ${esc(p.pedido || '')} · ${esc(p.fornecedor)}?`;
  if (!await confirmar('Salvar estimativa', msg, 'Salvar')) return;
  const todos = comAliq(itens);
  for (const { g, res: rg } of partes) {
    const estimativa = { data: hojeISO(), cenario: c.cenario, premissas: pr, itens: multi ? todos.filter(x => x.proc === g.id) : todos, resultado: arred(rg) };
    if (multi) estimativa.embarque = { codigo, processos: grupo.map(x => x.id), itens: todos, resultado_total: arred(res) };
    const reg = { estimativa, fator_estimado: Math.round(rg.fator * 1e6) / 1e6 };
    if (!g.fob_usd) reg.fob_usd = Math.round(rg.fob_usd * 100) / 100;
    if (multi && g.embarque !== codigo) reg.embarque = codigo;
    await gravar('imp_processos', reg, g.id, g, true);
    await numerarioDaEstimativa(g, rg.numerario);
  }
  await gravarPesosDosItens(c.itens, `estimativa do pedido ${grupo.map(g => g.pedido || g.id).join(' + ')}`, true);
  est.abertoId = p.id; abrir('processos'); await depoisDeGravar();
}

// lança o cálculo (com os valores reais da DI) como nacionalização realizada — no embarque conjunto, a parte de cada processo
async function lancarRealizado() {
  const c = est.calc;
  if (c.novos && c.novos.length) return alertaErro('Salve primeiro a estimativa para criar os processos dos fornecedores novos.');
  const p = est.processos.find(x => x.id === c.processo_id);
  if (!p) return;
  const { itens, pr, r } = resultadoCalc();
  if (!itens.length) return alertaErro('Informe pelo menos um item com quantidade e FOB.');
  if (!pr.dolar_di) return alertaErro('Informe o dólar da DI.');
  const grupo = (c.processos && c.processos.length ? c.processos : [p.id]).map(id => est.processos.find(x => x.id === id)).filter(Boolean);
  const multi = grupo.length > 1;
  if (multi) { const sem = grupo.filter(g => !r.porProc[g.id]); if (sem.length) return alertaErro(`Sem itens na calculadora para: ${sem.map(nomeProc).join(', ')}.`); }
  const partes = grupo.map(g => ({ g, x: multi ? r.porProc[g.id][c.cenario] : r[c.cenario] }));
  const jaTem = partes.filter(y => temNac(y.g));
  const msg = `Grava na <b>nacionalização realizada</b> (II, IPI, PIS, COFINS, ICMS, despesas e fretes${multi ? ', rateados por processo' : ''}), com câmbio DI ${TX(pr.dolar_di)} — ${CENARIOS[c.cenario]}:<br><br>
    ${partes.map(y => `• ${esc(nomeProc(y.g))}: nacionalização ${R0(y.x.numerario)}`).join('<br>')}<br><br>
    ${jaTem.length ? `<span class="verm">Substitui os valores já lançados em: ${jaTem.map(y => esc(nomeProc(y.g))).join(', ')}.</span><br><br>` : ''}
    Use só com os valores reais da DI. Depois confira em "Lançar / validar DI" e marque como conciliado. Continuar?`;
  if (!await confirmar('Lançar como DI realizada', msg, 'Lançar')) return;
  const r2 = v => Math.round((Number(v) || 0) * 100) / 100;
  for (const { g, x } of partes) {
    const reg = { cambio_di: pr.dolar_di, frete_usd: r2(x.frete_usd), nac_conciliada: false };
    for (const [k] of NAC) reg[k] = r2(x[k]);
    if (multi) reg.embarque = g.embarque || (grupo.find(y => y.embarque) || {}).embarque || 'EMB-' + grupo.map(y => y.pedido || y.id).join('-');
    await gravar('imp_processos', reg, g.id, g, true);
  }
  est.abertoId = p.id; abrir('processos'); await depoisDeGravar();
}

// numerário previsto pela estimativa: cria (ou atualiza, se ainda não pago) e leva ao Fluxo de caixa projetado
const OBS_NUM_EST = 'Numerário previsto pela estimativa';
async function numerarioDaEstimativa(p, valor) {
  valor = Math.round(nz(valor) * 100) / 100;
  if (!valor) return;
  const data = p.cp_numerario_prev || p.cp_chegada_prev || p.previsao_chegada || null;
  const ja = pagamentosDe(p).find(c => !ehCambio(c) && !c.pago && String(c.observacao || '').startsWith(OBS_NUM_EST));
  const obs = `${OBS_NUM_EST} (impostos + despesas + fretes) de ${dm(hojeISO())}.`;
  if (ja) await gravar('imp_cambios', { valor_previsto_brl: valor, observacao: obs, data_prevista: ja.data_prevista || data, no_fluxo: temFluxo(p.empresa) && !!(ja.data_prevista || data) }, ja.id, ja, true);
  else if (!pagamentosDe(p).some(c => !ehCambio(c) && c.pago))
    await inserirSemRecarregar('imp_cambios', { processo_id: p.id, empresa: p.empresa, tipo: 'Numerário', valor_previsto_brl: valor, data_prevista: data,
      no_fluxo: temFluxo(p.empresa) && !!data, ordem: pagamentosDe(p).length + 1, observacao: obs + (data ? '' : ' Sem data prevista: informe a data para entrar no fluxo.') });
}

const chaveProd = c => String(c || '').trim().toUpperCase().replace(/\s+/g, ' ');
const prodDe = codigo => est.produtos[chaveProd(codigo)];
// tag abaixo do código na calculadora
function tagProduto(x) {
  if (!String(x.codigo || '').trim()) return '';
  const pr = prodDe(x.codigo);
  if (!pr) return '<div class="nota">novo · não está no cadastro</div>';
  const pesoIgual = pr.peso_liq_kg != null && Math.abs(numCalc(x.peso) - Number(pr.peso_liq_kg)) < 1e-9;
  return `<div class="nota">${pr.validado ? '<span class="verde">✓ validado</span>' : '<span class="verm">a confirmar</span>'}${pr.peso_liq_kg != null && !pesoIgual ? ` · cadastro: ${nf(3).format(pr.peso_liq_kg)} kg` : ''}</div>`;
}
// completa família e peso do item a partir do cadastro (só o que estiver vazio); devolve true se mudou algo
function completarDoCadastro(x) {
  const pr = prodDe(x.codigo); if (!pr) return false;
  let mudou = false;
  if (!x.familia && pr.familia) { x.familia = pr.familia; mudou = true; }
  if (!numCalc(x.peso) && pr.peso_liq_kg != null) { x.peso = String(pr.peso_liq_kg).replace('.', ','); mudou = true; }
  return mudou;
}
// grava no cadastro o peso unitário dos itens com código (vira "validado": foi o usuário que informou ou confirmou)
async function gravarPesosDosItens(itens, origem, silencioso) {
  if (!podeEditar()) return 0;
  const lista = [];
  for (const x of itens) {
    const cod = chaveProd(x.codigo), peso = numCalc(x.peso);
    if (!cod || !peso) continue;
    const pr = prodDe(cod);
    if (pr && pr.validado && Math.abs(Number(pr.peso_liq_kg) - peso) < 1e-9 && (pr.familia || !x.familia)) continue;   // nada novo
    lista.push({ codigo: cod, familia: x.familia || (pr && pr.familia) || null, peso_liq_kg: peso, validado: true,
      fonte: pr && pr.fonte && Math.abs(Number(pr.peso_liq_kg) - peso) < 1e-9 ? pr.fonte : 'Informado na ' + origem });
  }
  if (!lista.length) return 0;
  try { await gravarProdutos(lista); } catch (e) { if (!silencioso) throw e; return 0; }
  return lista.length;
}

// campos: [nome, rótulo, tipo ('text'|'date'|'num'|'select'|'chk'|'area'|'lista'), opções]
function form(titulo, grupos, valores, aoSalvar, extra) {
  const html = grupos.map(([gtit, campos]) => `${gtit ? `<div class="grupo-tit">${gtit}</div>` : ''}<div class="form">${campos.map(([k, rot, t, op]) => {
    const v = valores[k];
    if (t === 'chk') return `<label class="chk"><input type="checkbox" name="${k}" ${v ? 'checked' : ''}><span>${rot}</span></label>`;
    if (t === 'select') return `<label><span>${rot}</span><select name="${k}">${op.map(([ov, on]) => `<option value="${esc(ov)}" ${String(ov) === String(v ?? '') ? 'selected' : ''}>${esc(on)}</option>`).join('')}</select></label>`;
    if (t === 'area') return `<label class="largo"><span>${rot}</span><textarea name="${k}" rows="2">${esc(v ?? '')}</textarea></label>`;
    if (t === 'lista') return `<label><span>${rot}</span><input name="${k}" list="dl_${k}" value="${esc(v ?? '')}" autocomplete="off"><datalist id="dl_${k}">${op.map(o => `<option value="${esc(o)}">`).join('')}</datalist></label>`;
    const tipo = t === 'date' ? 'date' : 'text';
    const val = t === 'num' && v != null && v !== '' ? String(v).replace('.', ',') : (v ?? '');
    return `<label><span>${rot}</span><input name="${k}" type="${tipo}" ${t === 'num' ? 'inputmode="decimal"' : ''} value="${esc(val)}"></label>`;
  }).join('')}</div>`).join('');
  const m = abrirModal(`<h2>${titulo}</h2><form id="fm">${html}${extra || ''}<div class="erro" id="fmErro"></div>
    <div class="rodape"><button type="button" class="btn" data-fechar>Cancelar</button><button type="submit" class="btn-pri">Salvar</button></div></form>`);
  const tipos = Object.fromEntries(grupos.flatMap(g => g[1]).map(([k, , t]) => [k, t]));
  const ler = () => {
    const fm = m.querySelector('#fm'), out = {};
    for (const [k, t] of Object.entries(tipos)) {
      const i = fm.elements[k];
      if (t === 'chk') out[k] = i.checked;
      else if (t === 'num') { const s = paraNum(i.value); out[k] = s === '' ? null : Number(s); if (s !== '' && isNaN(out[k])) throw new Error(`Valor inválido em "${grupos.flatMap(g => g[1]).find(c => c[0] === k)[1]}"`); }
      else out[k] = i.value.trim() === '' ? null : i.value.trim();
    }
    return out;
  };
  m.querySelector('#fm').onsubmit = async ev => {
    ev.preventDefault();
    const bt = m.querySelector('button[type=submit]'); bt.disabled = true;
    try { await aoSalvar(ler(), m); fecharModal(m); }
    catch (e) { m.querySelector('#fmErro').textContent = e.message; bt.disabled = false; }
  };
  return { m, ler };
}
function abrirModal(html) {
  const fundo = document.createElement('div');
  fundo.className = 'modal-fundo';
  fundo.innerHTML = `<div class="modal" role="dialog">${html}</div>`;
  $('#modais').appendChild(fundo);
  fundo.addEventListener('click', e => { if (e.target === fundo || e.target.hasAttribute('data-fechar')) fecharModal(fundo); });
  const f = fundo.querySelector('input,select,textarea'); if (f) setTimeout(() => f.focus(), 30);
  return fundo;
}
function fecharModal(m) { m.remove(); }
function confirmar(tit, msg, ok = 'Confirmar') {
  return new Promise(res => {
    const m = abrirModal(`<h2>${tit}</h2><div>${msg}</div><div class="rodape"><button class="btn" id="cNao">Cancelar</button><button class="btn-pri" id="cSim">${ok}</button></div>`);
    m.querySelector('#cNao').onclick = () => { fecharModal(m); res(false); };
    m.querySelector('#cSim').onclick = () => { fecharModal(m); res(true); };
  });
}

      reg.status = 'aberto';
      const outros = String(_outros || '').split(/\n|;/).map(x => x.trim()).filter(x => x && x !== v.fornecedor);
      if (outros.length) reg.embarque = 'EMB-' + [v.pedido || v.fornecedor, ...outros].join('-').replace(/\s+/g, '').slice(0, 40) + '-' + hojeISO().slice(2).replace(/-/g, '');
      const id = await inserir('imp_processos', reg);
      for (const o of outros) {
        if (!est.fornecedores[o]) await gravarFornecedor({ nome: o, pais: _pais || null, condicao_pagamento: null });
        await inserirSemRecarregar('imp_processos', { ...reg, fornecedor: o, pedido: null, fob_usd: null, fator_estimado: null, atualizado_em: new Date().toISOString() });
      }
      if (outros.length && !est.demo) await recarregar();
      est.abertoId = id; abrir('processos');
    }
    else await gravar('imp_processos', reg, p.id, p);
  });
  // cliente só aparece para empresas que importam para clientes (ou se já estiver preenchido)
  const fmD = m.querySelector('#fm'), lblCli = fmD.elements.cliente.closest('label');
  const grupoAss = [...m.querySelectorAll('.grupo-tit')].find(x => x.textContent.startsWith('Assessoria'));
  const verCliente = () => { const on = temClientes(Number(fmD.elements.empresa.value)) || !!fmD.elements.cliente.value;
    lblCli.style.display = on ? '' : 'none'; if (grupoAss) { grupoAss.style.display = on ? '' : 'none'; grupoAss.nextElementSibling.style.display = on ? '' : 'none'; } };
  fmD.elements.empresa.addEventListener('change', verCliente); verCliente();
  m.querySelector('[name=fornecedor]').addEventListener('change', e => {
    const f = est.fornecedores[e.target.value]; const fm = e.target.form;
    if (f) { fm.elements._pais.value = f.pais || ''; fm.elements._cond.value = f.condicao_pagamento || ''; }
  });
}

// junta processos numa mesma DI (embarque conjunto) — mesma empresa; sugere os do mesmo país
function formJuntar(p) {
  const pais = paisDe(p), ja = doEmbarque(p).map(x => x.id);
  const cand = est.processos.filter(x => x.status === 'aberto' && x.empresa === p.empresa && !ja.includes(x.id))
    .sort((a, b) => (paisDe(b) === pais) - (paisDe(a) === pais) || String(b.pedido || '').localeCompare(String(a.pedido || ''), 'pt-BR', { numeric: true }));
  const m = abrirModal(`<h2>Juntar processos na mesma DI</h2>
    <div class="nota" style="margin-bottom:10px">Os processos marcados vêm no mesmo embarque que ${esc(nomeProc(p))} e rateiam os custos da importação (impostos item a item, fretes por peso, despesas pela base do ICMS — como na planilha de validação da DI). Só processos em aberto da ${EMPRESAS[p.empresa] || 'mesma empresa'}${pais ? `; os de ${esc(pais)} aparecem primeiro` : ''}.</div>
    ${cand.length ? `<div class="lista-juntar">${cand.map(x => `<label class="chk-fluxo"><input type="checkbox" value="${x.id}"> ${esc(nomeProc(x))} <span class="nota">${esc(paisDe(x) || '')}${x.fob_usd ? ' · FOB ' + U(x.fob_usd) : ''}${x.embarque ? ' · já em ' + esc(x.embarque) : ''}</span></label>`).join('')}</div>` : '<div class="vazio">Nenhum outro processo em aberto da mesma empresa.</div>'}
    <div class="erro" id="jErr"></div>
    <div class="rodape"><button class="btn" data-fechar>Cancelar</button>${cand.length ? '<button class="btn-pri" id="jOk">Juntar e abrir na calculadora</button>' : ''}</div>`);
  if (!cand.length) return;
  m.querySelector('#jOk').onclick = async () => {
    const sel = [...m.querySelectorAll('input[type=checkbox]:checked')].map(i => est.processos.find(x => x.id === Number(i.value)));
    if (!sel.length) return void (m.querySelector('#jErr').textContent = 'Marque pelo menos um processo.');
    const todos = [...doEmbarque(p), ...sel.flatMap(doEmbarque)].filter((x, i, a) => a.findIndex(y => y.id === x.id) === i).sort((a, b) => a.id - b.id);
    const codigo = p.embarque || 'EMB-' + todos.map(x => x.pedido || x.id).join('-');
    try { for (const x of todos) if (x.embarque !== codigo) await gravar('imp_processos', { embarque: codigo }, x.id, x, true); }
    catch (e) { return void (m.querySelector('#jErr').textContent = e.message); }
    fecharModal(m);
    if (!est.demo) await recarregar();
    abrirCalculadora(est.processos.find(x => x.id === p.id));
  };
}

function formCheckpoints(p) {
  form('Checkpoints', CPS.map(([k, n]) => [n, [[`cp_${k}_prev`, 'Previsto', 'date'], [`cp_${k}_ef`, 'Efetivo', 'date']]]), p,
    v => gravar('imp_processos', v, p.id, p));
}

function formNacionalizacao(p) {
  const { m } = form('Nacionalização / validação da DI', [
    ['DI', [['di', 'DI / AWB', 'text'], ['data_di', 'Data DI', 'date'], ['protocolo_di', 'Protocolo', 'text'],
      ['cambio_di', 'Câmbio DI', 'num'], ['frete_usd', 'Frete internacional US$', 'num']]],
    ['Valores em R$', NAC.map(([k, n]) => [k, n, 'num'])],
    ['', [['nac_conciliada', 'Valores conferidos e conciliados', 'chk']]],
  ], p, v => gravar('imp_processos', v, p.id, p), '<div class="nota" style="margin-top:10px" id="nacTot"></div>');
  const fm = m.querySelector('#fm');
  const atual = () => {
    const tot = NAC.reduce((s, [k]) => s + (Number(paraNum(fm.elements[k].value)) || 0), 0);
    m.querySelector('#nacTot').textContent = 'Total nacionalização: ' + R(tot);
  };
  fm.addEventListener('input', atual); atual();
