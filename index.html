      <div class="nota">Pela data de vencimento${est.inclVencidos ? ' · o 1º dia inclui os títulos já vencidos' : ''}</div>
      <div class="tabela-wrap"><table>
        <thead><tr><th>Dia</th><th class="n">Entradas</th><th class="n">Saídas</th>${temArea('importacoes') ? '<th class="n">Importações</th>' : ''}<th class="n">Resultado</th><th class="n">Saldo no fim do dia</th></tr></thead>
        <tbody>${p.dias.slice(0, 30).map(x => { const dw = parseISO(x.dt).getDay(), fds = dw === 0 || dw === 6, res = x.ent - x.sai;
          return `<tr${fds ? ' style="color:var(--text-3)"' : ''}><td>${ddmmaa(x.dt)} <span class="sub">${['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][dw]}</span></td>
          <td class="n">${x.ent ? R(x.ent) : '—'}</td><td class="n">${x.sai - x.imp ? R(x.sai - x.imp) : '—'}</td>${temArea('importacoes') ? `<td class="n">${x.imp ? R(x.imp) : '—'}</td>` : ''}
          <td class="n ${res < 0 ? 'neg' : ''}">${res ? R(res) : '—'}</td><td class="n ${x.saldo < 0 ? 'neg' : ''}"><b>${R(x.saldo)}</b></td></tr>`; }).join('')}</tbody>
      </table></div>
    </div>
  </div>`;

  graficoLinha($('#gProj'), p.dias.map(x => [x.dt, x.saldo]), { altura: 260, nome: 'Saldo projetado' });
  graficoBarras($('#gProjBar'), {
    cats: gs.map(g => g.k), rotulo: semanal ? (s => 'sem ' + ddmm(s)) : ddmm, agrupado: true,
    series: [
      { nome: 'Entradas', cor: 'var(--s1)', valores: gs.map(g => g.ent) },
      { nome: 'Saídas', cor: 'var(--s2)', valores: gs.map(g => g.sai - g.imp) },
      ...(p.imp ? [{ nome: 'Importações', cor: '#8a5cd1', valores: gs.map(g => g.imp) }] : []),
    ],
  });
  el.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { est.horizonte = Number(b.dataset.h); carregar(); });
  $('#inclVenc').onchange = ev => { est.inclVencidos = ev.target.checked; render(); };
  // importações: alterar a data aqui grava no processo (imp_cambios.data_prevista)
  el.querySelectorAll('[data-impc]').forEach(inp => inp.onchange = async () => {
    const id = Number(inp.dataset.impc), nova = inp.value;
    if (!nova) return;
    const { error } = await sb.from('imp_cambios').update({ data_prevista: nova }).eq('id', id);
    if (error) { $('#impDataErro').textContent = 'Não foi possível alterar a data: ' + error.message; return; }
    await lerImpFluxo(); render();
  });
  el.querySelectorAll('[data-impp]').forEach(b => b.onclick = () => { est.impAbrirId = Number(b.dataset.impp); irParaAba('importacoes'); });
  ligarCambio(el);
}

// ======================= janelas (modal) =======================
function abrirModal(html) {
  $('#modalCaixa').innerHTML = html;
  $('#modal').hidden = false;
  const primeiro = $('#modalCaixa').querySelector('input, select, textarea, button');
  if (primeiro) setTimeout(() => primeiro.focus(), 30);
}
function fecharModal() { $('#modal').hidden = true; $('#modalCaixa').innerHTML = ''; }
$('#modal').addEventListener('click', ev => { if (ev.target.id === 'modal') fecharModal(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#modal').hidden) fecharModal(); });

function confirmar(titulo, texto, rotuloOk = 'Confirmar') {
  return new Promise(res => {
    abrirModal(`<h2>${esc(titulo)}</h2><p style="color:var(--text-2)">${texto}</p>
      <div class="modal-acoes"><button id="cNao">Cancelar</button><button class="btn-pri" id="cSim">${esc(rotuloOk)}</button></div>`);
    $('#cNao').onclick = () => { fecharModal(); res(false); };
    $('#cSim').onclick = () => { fecharModal(); res(true); };
  });
}

function abrirTrocaSenha(recuperacao) {
  abrirModal(`<h2>${recuperacao ? 'Criar nova senha' : 'Trocar senha'}</h2>
    <label class="campo"><span>Nova senha (mínimo 8 caracteres, com letras e números)</span><input type="password" id="ns1" autocomplete="new-password"></label>
    <label class="campo"><span>Repita a nova senha</span><input type="password" id="ns2" autocomplete="new-password"></label>
    <div class="msg-erro" id="nsErro"></div>
    <div class="modal-acoes"><button id="nsCancelar">Cancelar</button><button class="btn-pri" id="nsSalvar">Salvar</button></div>`);
  $('#nsCancelar').onclick = fecharModal;
  $('#nsSalvar').onclick = async () => {
    const a = $('#ns1').value, b = $('#ns2').value;
    if (a.length < 8 || !/[a-zA-Z]/.test(a) || !/\d/.test(a)) return void ($('#nsErro').textContent = 'Use pelo menos 8 caracteres, com letras e números.');
    if (a !== b) return void ($('#nsErro').textContent = 'As senhas não conferem.');
    if (est.demo) { fecharModal(); return; }
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) return void ($('#nsErro').textContent = error.message);
    fecharModal();
    if (recuperacao) entrar();
  };
}

// ======================= importações =======================
const TIPOS_IMP = ['Câmbio', 'Numerário', 'Frete', 'Impostos', 'Outros'];
const STATUS_IMP = ['Produção', 'Embarque', 'Chegada Brasil', 'Nacionalização', 'Estoque'];
const usd = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'USD' });

// seletor da aba: módulo de Importações (importacoes.html, embutido) ou os lançamentos no fluxo (tela antiga)
function seletorImportacoes() {
  const v = est.impVisao || 'modulo';
  return `<div class="controles" style="margin-bottom:12px">
    <button class="chip" data-impv="modulo" aria-pressed="${v === 'modulo'}">Processos de importação</button>
    <button class="chip" data-impv="fluxo" aria-pressed="${v === 'fluxo'}">Lançamentos no fluxo</button>
  </div>`;
}
function ligarSeletorImportacoes(el) {
  el.querySelectorAll('[data-impv]').forEach(b => b.onclick = () => { est.impVisao = b.dataset.impv; render(); });
}
function renderImportacoes(el) {
  const abrirId = est.impAbrirId; est.impAbrirId = null;
  if (abrirId) { const fr0 = el.querySelector('#impModulo'); if (fr0) fr0.remove(); }
  if (true) {
    // não recria o módulo nas atualizações automáticas (não perde o que está sendo digitado)
    const ja = el.querySelector('#impModulo');
    if (ja) { ja.style.height = Math.max(560, innerHeight - ja.getBoundingClientRect().top - 16) + 'px'; return; }
    el.innerHTML = `<iframe id="impModulo" src="importacoes.html${abrirId ? '#processos/' + abrirId : ''}" title="Módulo de Importações" style="width:100%;border:0;display:block;min-height:560px;background:transparent"></iframe>`;
    const fr = el.querySelector('#impModulo');
    const ajustar = () => { if (!fr.isConnected) return removeEventListener('resize', ajustar); fr.style.height = Math.max(560, innerHeight - fr.getBoundingClientRect().top - 16) + 'px'; };
    ajustar(); addEventListener('resize', ajustar);
    return;
  }
  const pode = podeEditar();
  const f = est.impFiltro;
  const lista = est.importacoes
    .filter(i => est.empresas.includes(i.empresa))
    .filter(i => !f.status || i.status === f.status)
    .filter(i => !f.soFluxo || i.no_fluxo)
    .sort((a, b) => a.previsao.localeCompare(b.previsao) || a.id - b.id);
  const hoje = hojeISO();
  const aberta = i => i.status !== 'Estoque';
  const tot = lista.filter(aberta).reduce((s, i) => s + valorImp(i), 0);
  const tot30 = lista.filter(i => aberta(i) && i.previsao <= somaDias(hoje, 30)).reduce((s, i) => s + valorImp(i), 0);
  const fob = lista.filter(aberta).reduce((s, i) => s + Number(i.fob_usd || 0), 0);
  const cam = cambioAtual();
  const ptaxTxt = est.ptax && est.ptax.valor ? `PTAX ${Number(est.ptax.valor).toLocaleString('pt-BR', { minimumFractionDigits: 4 })} (${ddmmaa(est.ptax.data)})` : 'PTAX indisponível';

  el.innerHTML = seletorImportacoes() + `
  <div class="kpis">
    ${kpi('Previsto nos próximos 30 dias', R0(tot30), 'importações não finalizadas')}
    ${kpi('Total previsto', R0(tot), `${lista.filter(aberta).length} lançamentos em aberto`)}
    ${kpi('Total em FOB', usd.format(fob), 'lançamentos com valor em dólar')}
    ${kpi('Câmbio usado', cam.toLocaleString('pt-BR', { minimumFractionDigits: 4 }), est.cambio.modo === 'ptax' ? 'automático (PTAX venda)' : 'manual')}
  </div>
  <div class="grade">
    <div class="card">
      <h2>Câmbio</h2>
      <div class="nota">Usado para converter o FOB quando o valor em R$ não foi informado · ${ptaxTxt}</div>
      <div class="controles" style="margin:8px 0 0">
        <label class="rot"><input type="radio" name="camModo" value="manual" ${est.cambio.modo !== 'ptax' ? 'checked' : ''} ${pode ? '' : 'disabled'}> Manual</label>
        <input type="number" id="camManual" step="0.0001" min="0" value="${Number(est.cambio.manual || 0)}" style="width:110px;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)" ${pode ? '' : 'disabled'}>
        <label class="rot"><input type="radio" name="camModo" value="ptax" ${est.cambio.modo === 'ptax' ? 'checked' : ''} ${pode ? '' : 'disabled'}> PTAX automática</label>
        ${pode ? '<button id="camSalvar">Salvar câmbio</button>' : ''}
        <span class="msg-ok" id="camMsg" style="margin:0"></span>
      </div>
    </div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="controles" style="margin-bottom:6px">
      <h2 style="margin-right:auto">Importações</h2>
      <select id="impStatus" style="font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)">
        <option value="">Todos os status</option>${STATUS_IMP.map(st => `<option ${f.status === st ? 'selected' : ''}>${st}</option>`).join('')}
      </select>
      <label class="rot"><input type="checkbox" id="impSoFluxo" ${f.soFluxo ? 'checked' : ''}> Só as que entram no fluxo</label>
      ${pode ? '<button class="btn-pri" id="impNova">+ Nova importação</button>' : ''}
    </div>
    <div class="tabela-wrap"><table>
      <thead><tr><th>Previsão</th><th>Empresa</th><th>Tipo</th><th>Fornecedor</th><th>Pedido</th><th class="n">FOB (US$)</th><th class="n">Valor (R$)</th><th>Status</th><th>Fluxo</th><th class="opc">Observação</th>${pode ? '<th></th>' : ''}</tr></thead>
      <tbody>${lista.length ? lista.map(i => `<tr>
        <td>${ddmmaa(i.previsao)}${aberta(i) && i.previsao < hoje ? ' <span class="selo">atrasada</span>' : ''}</td>
        <td>${esc(nomeEmpresa(i.empresa))}</td><td>${esc(i.tipo)}</td><td>${esc(i.fornecedor || '')}</td><td>${esc(i.pedido || '')}</td>
        <td class="n">${i.fob_usd ? usd.format(i.fob_usd) : ''}</td>
        <td class="n">${i.valor_brl !== null && i.valor_brl !== undefined ? R(i.valor_brl) : `<span class="estimado" title="FOB × câmbio">${R(valorImp(i))}</span>`}</td>
        <td><span class="selo">${esc(i.status || '—')}</span></td>
        <td>${i.no_fluxo ? 'Sim' : 'Não'}</td>
        <td class="opc sub">${esc(i.observacao || '')}</td>
        ${pode ? `<td><div class="acoes-linha"><button data-ed="${i.id}">Editar</button><button class="btn-perigo" data-ex="${i.id}">Excluir</button></div></td>` : ''}
      </tr>`).join('') : `<tr><td colspan="11" class="vazio">Nenhuma importação cadastrada.</td></tr>`}</tbody>
    </table></div>
    <div class="nota" style="margin-top:8px"><span class="estimado">Valores em itálico</span> são estimados (FOB × câmbio). Status "Estoque" = finalizada (sai do fluxo).</div>
  </div>`;

  ligarSeletorImportacoes(el);
  $('#impStatus').onchange = ev => { f.status = ev.target.value; render(); };
  $('#impSoFluxo').onchange = ev => { f.soFluxo = ev.target.checked; render(); };
  if (!pode) return;
  $('#impNova').onclick = () => formImportacao(null);
  el.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => formImportacao(est.importacoes.find(i => String(i.id) === b.dataset.ed)));
  el.querySelectorAll('[data-ex]').forEach(b => b.onclick = async () => {
    const i = est.importacoes.find(x => String(x.id) === b.dataset.ex);
    if (!await confirmar('Excluir importação', `Excluir <b>${esc(i.fornecedor || i.tipo)}</b> de ${ddmmaa(i.previsao)} (${R(valorImp(i))})?`, 'Excluir')) return;
    if (est.demo) est.importacoes = est.importacoes.filter(x => x !== i);
    else { const { error } = await sb.from('importacoes').delete().eq('id', i.id); if (error) return mostrarErro(error.message); await lerImportacoes(); }
    render();
  });
  $('#camSalvar').onclick = async () => {
    const modo = el.querySelector('input[name=camModo]:checked').value;
    const manual = Number($('#camManual').value);
    if (modo === 'manual' && !(manual > 0)) return void ($('#camMsg').textContent = 'Informe um câmbio válido.');
    if (modo === 'ptax' && !(est.ptax && est.ptax.valor)) return void ($('#camMsg').textContent = 'PTAX ainda não disponível; use manual.');
    est.cambio = { modo, manual };
    if (!est.demo) {
      const { error } = await sb.from('parametros').update({ valor: est.cambio }).eq('chave', 'cambio');
      if (error) return mostrarErro(error.message);
    }
    render(); $('#camMsg').textContent = 'Câmbio salvo.';
  };
}

// câmbio usado para converter parcelas de importação sem taxa (manual ou PTAX)
function ligarCambio(el) {
  // troca imediata (só nesta tela): recalcula o fluxo sem gravar; "Salvar câmbio" guarda a escolha
  const lerCampos = () => {
    const modo = (el.querySelector('input[name=camModo]:checked') || {}).value || 'ptax';
    const t = String((el.querySelector('#camManual') || {}).value || '').trim();
    return { modo, manual: Number(t.includes(',') ? t.replace(/\./g, '').replace(',', '.') : t) || est.cambio.manual };
  };
  const aplicar = () => {
    const y = window.scrollY, v = lerCampos();
    if (v.modo === 'manual' && !(v.manual > 0)) return;
    if (est.cambioSalvo === undefined) est.cambioSalvo = { ...est.cambio };
    est.cambio = v; render(); window.scrollTo(0, y);
    const m = document.querySelector('#camMsg');
    if (m) m.textContent = JSON.stringify(est.cambio) !== JSON.stringify(est.cambioSalvo) ? 'Valores recalculados (não salvo).' : '';
  };
  el.querySelectorAll('input[name=camModo]').forEach(r => r.onchange = aplicar);
  const inp = el.querySelector('#camManual');

// ======================= gráficos (SVG, sem bibliotecas) =======================
const NS = 'http://www.w3.org/2000/svg';
function passoBonito(max, n = 4) {
  if (max <= 0) return 1;
  const bruto = max / n, mag = Math.pow(10, Math.floor(Math.log10(bruto))), f = bruto / mag;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
}
function escalaY(min, max, zero = true) {
  if (zero) { min = Math.min(0, min); max = Math.max(0, max); }
  else { const f = Math.max((max - min) * 0.15, Math.abs(max) * 0.08) || 1; min -= f; max += f; }
  if (min === max) max = 1;
  const p = passoBonito(max - min);
  const lo = Math.floor(min / p) * p, hi = Math.ceil(max / p) * p;
  const ticks = []; for (let v = lo; v <= hi + p / 2; v += p) ticks.push(v);
  return { lo, hi, ticks };
}
function svgEl(tag, attrs, pai) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (pai) pai.appendChild(e);
  return e;
}
const tip = $('#tip');
function mostrarTip(ev, html) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY - h - 10;
  if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
  if (y < 8) y = ev.clientY + 16;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const esconderTip = () => { tip.style.opacity = 0; };
// liga mouse e toque (celular) no mesmo comportamento de tooltip
function ligarToque(alvo, mover, sair) {
  alvo.addEventListener('mousemove', mover);
  alvo.addEventListener('mouseleave', sair);
  const toque = ev => { const t = ev.touches && ev.touches[0]; if (t) mover({ clientX: t.clientX, clientY: t.clientY }); };
  alvo.addEventListener('touchstart', toque, { passive: true });
  alvo.addEventListener('touchmove', toque, { passive: true });
  alvo.addEventListener('touchend', sair);
  alvo.addEventListener('touchcancel', sair);
}

function eixos(svg, W, H, m, esc, yPx) {
  for (const t of esc.ticks) {
    const y = yPx(t);
    svgEl('line', { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: t === 0 ? css('--text-3') : css('--grid'), 'stroke-width': 1 }, svg);
    const tx = svgEl('text', { x: m.l - 8, y: y + 4, 'text-anchor': 'end' }, svg);
    tx.textContent = brlEixo.format(t);
  }
}
function rotulosX(svg, cats, xCentro, H, m, W, rotulo) {
  const maxRot = Math.max(2, Math.floor((W - m.l - m.r) / 64));
  const passo = Math.ceil(cats.length / maxRot);
  cats.forEach((k, i) => {
    if (i % passo) return;
    const t = svgEl('text', { x: xCentro(i), y: H - m.b + 16, 'text-anchor': 'middle' }, svg);
    t.textContent = rotulo(k);
  });
}

function graficoLinha(el, serie, { altura = 240, zero = false, nome = 'Saldo' } = {}) {
  el.innerHTML = '';
  if (!serie.length) { el.innerHTML = '<div class="vazio">Sem dados no período</div>'; return; }
  const W = el.clientWidth || 600, H = altura, m = { l: 74, r: 16, t: 10, b: 26 };
  const ys = serie.map(p => p[1]);
  const esc = escalaY(Math.min(...ys), Math.max(...ys), zero || Math.min(...ys) < 0);
  const yPx = v => m.t + (H - m.t - m.b) * (1 - (v - esc.lo) / (esc.hi - esc.lo));
  const xPx = i => serie.length === 1 ? (m.l + W - m.r) / 2 : m.l + (W - m.l - m.r) * i / (serie.length - 1);
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': 'Gráfico de linha do saldo' }, el);
  eixos(svg, W, H, m, esc, yPx);
  rotulosX(svg, serie.map(p => p[0]), xPx, H, m, W, ddmm);
  const cor = css('--s1');
  const dPath = serie.map((p, i) => (i ? 'L' : 'M') + xPx(i).toFixed(1) + ' ' + yPx(p[1]).toFixed(1)).join(' ');
  // área suave
  svgEl('path', { d: `${dPath} L ${xPx(serie.length - 1)} ${yPx(Math.max(esc.lo, 0))} L ${xPx(0)} ${yPx(Math.max(esc.lo, 0))} Z`, fill: cor, opacity: .08 }, svg);
  svgEl('path', { d: dPath, fill: 'none', stroke: cor, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);
  // último ponto com rótulo direto
  const ult = serie.length - 1;
  svgEl('circle', { cx: xPx(ult), cy: yPx(serie[ult][1]), r: 4, fill: cor, stroke: css('--surface'), 'stroke-width': 2 }, svg);
  // crosshair + tooltip
  const guia = svgEl('line', { y1: m.t, y2: H - m.b, stroke: css('--text-3'), 'stroke-width': 1, 'stroke-dasharray': '3 3', opacity: 0 }, svg);
  const ponto = svgEl('circle', { r: 5, fill: cor, stroke: css('--surface'), 'stroke-width': 2, opacity: 0 }, svg);
  const alvo = svgEl('rect', { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: 'transparent' }, svg);
  ligarToque(alvo, ev => {
    const r = svg.getBoundingClientRect();
    const x = (ev.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(serie.length - 1, Math.round((x - m.l) / ((W - m.l - m.r) / Math.max(1, serie.length - 1)))));
    const [dt, v] = serie[i];
    guia.setAttribute('x1', xPx(i)); guia.setAttribute('x2', xPx(i)); guia.setAttribute('opacity', 1);
    ponto.setAttribute('cx', xPx(i)); ponto.setAttribute('cy', yPx(v)); ponto.setAttribute('opacity', 1);
    mostrarTip(ev, `<div class="t">${ddmmaa(dt)}</div><div class="l"><span><i style="background:${cor}"></i>${nome}</span><b class="${v < 0 ? 'neg' : ''}">${R(v)}</b></div>`);
  }, () => { guia.setAttribute('opacity', 0); ponto.setAttribute('opacity', 0); esconderTip(); });
}

function graficoBarras(el, { cats, series, rotulo, agrupado = false, altura = 260 }) {
  el.innerHTML = '';
  if (!cats.length) { el.innerHTML = '<div class="vazio">Sem vencimentos no período</div>'; return; }
  const W = el.clientWidth || 600, H = altura, m = { l: 74, r: 10, t: 10, b: 26 };
  const somas = cats.map((_, i) => agrupado ? Math.max(...series.map(s => s.valores[i])) : series.reduce((t, s) => t + s.valores[i], 0));
  const esc = escalaY(0, Math.max(...somas));
  const yPx = v => m.t + (H - m.t - m.b) * (1 - (v - esc.lo) / (esc.hi - esc.lo));
  const banda = (W - m.l - m.r) / cats.length;
  const xCentro = i => m.l + banda * (i + 0.5);
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': 'Gráfico de barras' }, el);
  eixos(svg, W, H, m, esc, yPx);
  rotulosX(svg, cats, xCentro, H, m, W, rotulo);
  const larg = Math.max(2, Math.min(agrupado ? 18 : 28, banda * (agrupado ? 0.38 : 0.7)));
  const raio = Math.min(4, larg / 2);
  const grupoHover = svgEl('rect', { y: m.t, height: H - m.t - m.b, width: banda, fill: css('--text'), opacity: 0 }, svg);
  cats.forEach((k, i) => {
    let base = 0;
    series.forEach((s, si) => {
      const v = Math.max(0, s.valores[i]);
      if (v <= 0) return;
      const x = agrupado ? xCentro(i) - larg - 1 + si * (larg + 2) : xCentro(i) - larg / 2;
      const y0 = agrupado ? yPx(0) : yPx(base);
      const y1 = agrupado ? yPx(v) : yPx(base + v);
      const topo = agrupado || si === series.length - 1 || series.slice(si + 1).every(z => !(z.valores[i] > 0));
      let h = Math.max(1, y0 - y1 - (agrupado || base === 0 ? 0 : 2)); // 2px de respiro entre segmentos
      const r = topo ? Math.min(raio, h) : 0;
      const d = `M${x},${y1 + h} L${x},${y1 + r} Q${x},${y1} ${x + r},${y1} L${x + larg - r},${y1} Q${x + larg},${y1} ${x + larg},${y1 + r} L${x + larg},${y1 + h} Z`;
      svgEl('path', { d, fill: s.cor }, svg);
      if (!agrupado) base += v;
    });
  });
  const alvo = svgEl('rect', { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: 'transparent' }, svg);
  ligarToque(alvo, ev => {
    const r = svg.getBoundingClientRect();
    const x = (ev.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(cats.length - 1, Math.floor((x - m.l) / banda)));
    grupoHover.setAttribute('x', m.l + banda * i); grupoHover.setAttribute('opacity', .05);
    const linhas = series.map(s => `<div class="l"><span><i style="background:${s.cor}"></i>${s.nome}</span><b>${R(s.valores[i])}</b></div>`).join('');
    const tot = agrupado ? '' : `<div class="l" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span>Total</span><b>${R(series.reduce((t, s) => t + s.valores[i], 0))}</b></div>`;
    mostrarTip(ev, `<div class="t">${rotulo(cats[i])}${rotulo === ddmm ? '/' + cats[i].slice(2, 4) : ''}</div>${linhas}${tot}`);
  }, () => { grupoHover.setAttribute('opacity', 0); esconderTip(); });
}

function barrasHorizontais(el, itens, { larguraRotulo = 112 } = {}) {
  el.innerHTML = '';
  if (!itens.length) { el.innerHTML = '<div class="vazio">Sem lançamentos</div>'; return; }
  const W = el.clientWidth || 400, linha = 34, H = itens.length * linha, rotL = larguraRotulo, valR = 104;
  const maxCar = Math.floor((rotL - 8) / 6.2);
  const max = Math.max(1, ...itens.map(i => i.valor));
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': 'Inadimplência por faixa' }, el);
  itens.forEach((it, i) => {
    const y = i * linha;
    const t = svgEl('text', { x: 0, y: y + linha / 2 + 4 }, svg);
    t.textContent = it.rot.length > maxCar ? it.rot.slice(0, maxCar - 1) + '…' : it.rot;
    const w = Math.max(it.valor > 0 ? 3 : 0, (W - rotL - valR) * it.valor / max);
    if (w > 0) {
      const r = Math.min(4, w);
      const x = rotL, yy = y + 8, h = linha - 16;
      svgEl('path', { d: `M${x},${yy} L${x + w - r},${yy} Q${x + w},${yy} ${x + w},${yy + r} L${x + w},${yy + h - r} Q${x + w},${yy + h} ${x + w - r},${yy + h} L${x},${yy + h} Z`, style: `fill:${it.cor || 'var(--s2)'}` }, svg);
    }
    const v = svgEl('text', { x: rotL + w + 8, y: y + linha / 2 + 4 }, svg);
    v.textContent = Rc(it.valor);
    v.setAttribute('style', 'fill:var(--text);font-weight:600');
    const alvo = svgEl('rect', { x: 0, y, width: W, height: linha, fill: 'transparent' }, svg);
    ligarToque(alvo, ev => mostrarTip(ev, `<div class="t">${it.rot}</div><div class="l"><span>Valor</span><b>${R(it.valor)}</b></div>${it.det ? `<div class="l"><span>Títulos</span><b>${it.det.split(' ')[0]}</b></div>` : ''}`), esconderTip);
  });
}

function sparkline(el, serie) {
  const W = 120, H = 28;
  if (serie.length < 2) return;
  const ys = serie.map(p => p[1]), lo = Math.min(...ys), hi = Math.max(...ys), amp = hi - lo || 1;
  const d = serie.map((p, i) => (i ? 'L' : 'M') + (2 + (W - 4) * i / (serie.length - 1)).toFixed(1) + ' ' + (2 + (H - 4) * (1 - (p[1] - lo) / amp)).toFixed(1)).join(' ');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

// ======================= eventos =======================
document.querySelectorAll('#atalhos .chip').forEach(b => b.onclick = () => aplicarAtalho(b.dataset.p));
for (const id of ['#dtIni', '#dtFim']) {

    document.querySelectorAll('#atalhos .chip').forEach(x => x.setAttribute('aria-pressed', 'false'));

    carregar();

}
const fecharMenu = () => document.body.classList.remove('menu-aberto');
$('#btnMenu').onclick = () => document.body.classList.toggle('menu-aberto');
$('#menuFundo').onclick = fecharMenu;
['#btnSenha', '#btnSair'].forEach(id => $(id).addEventListener('click', fecharMenu));

document.querySelectorAll('.aba').forEach(b => b.onclick = () => {
  est.aba = b.dataset.aba; fecharMenu();

$('#btnBancos').onclick = ev => {

};

$('#btnAtualizar').onclick = carregar;
$('#btnSair').onclick = async () => { if (sb) await sb.auth.signOut(); location.reload(); };
$('#btnSenha').onclick = () => abrirTrocaSenha(false);
$('#formLogin').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = $('#lBotao'); b.disabled = true; $('#lErro').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#lEmail').value.trim(), password: $('#lSenha').value });
  b.disabled = false;
  if (error) { $('#lErro').textContent = /invalid/i.test(error.message) ? 'E-mail ou senha inválidos.' : error.message; return; }

$('#lEsqueci').onclick = async () => {

  if (!email) { $('#lErro').textContent = 'Digite seu e-mail acima e clique de novo.'; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  $('#lErro').textContent = error ? error.message : 'Se o e-mail estiver cadastrado, você vai receber um link para criar uma nova senha.';
};
// atualização automática: a cada 2 horas + sempre às 17:45 (quando a opção está ligada)
setInterval(() => { if ($('#auto').checked && !document.hidden) carregar(); }, 2 * 60 * 60e3);
let ultimoDiario = '';
setInterval(() => {
  if (!$('#auto').checked) return;
  const agora = new Date();
  const hhmm = ('0' + agora.getHours()).slice(-2) + ':' + ('0' + agora.getMinutes()).slice(-2);
  const hoje = agora.toISOString().slice(0, 10);
  if (hhmm === '17:45' && ultimoDiario !== hoje) { ultimoDiario = hoje; carregar(); }
}, 30e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden && $('#auto').checked) carregar(); });
let tResize;
addEventListener('resize', () => { clearTimeout(tResize); tResize = setTimeout(render, 150); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { atualizarIconeTema(); try { render(); } catch (_) {} });

// ===== tema claro/escuro (manual) =====
function efetivoEscuro() {
  const h = document.documentElement;
  if (h.classList.contains('tema-escuro')) return true;
  if (h.classList.contains('tema-claro')) return false;
  return matchMedia('(prefers-color-scheme: dark)').matches;
}
function atualizarIconeTema() {
  const esc = efetivoEscuro();
  const btn = document.getElementById('btnTema');
  if (btn) { btn.textContent = esc ? '☀️' : '🌙'; btn.title = esc ? 'Mudar para tema claro' : 'Mudar para tema escuro'; }
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', esc ? '#121211' : '#2F64E0');
}
function aplicarTema(t) {
  const h = document.documentElement;
  h.classList.remove('tema-claro', 'tema-escuro');
  if (t === 'claro') h.classList.add('tema-claro');
  else if (t === 'escuro') h.classList.add('tema-escuro');
  atualizarIconeTema();
}
(function () {
  let t = 'auto'; try { t = localStorage.getItem('painel-tema') || 'auto'; } catch (_) {}
  aplicarTema(t);
})();
document.getElementById('btnTema')?.addEventListener('click', () => {
  const novo = efetivoEscuro() ? 'claro' : 'escuro';
  try { localStorage.setItem('painel-tema', novo); } catch (_) {}
  aplicarTema(novo);
  try { render(); } catch (_) {}
});

iniciar();
