<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Financeiro</title>
<meta name="theme-color" content="#2F64E0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Painel">
<style>
:root {
  color-scheme: light;
  --bg: #f3f2ef;
  --surface: #fcfcfb;
  --line: #e4e2dd;
  --grid: #ebe9e4;
  --text: #0b0b0b;
  --text-2: #52514e;
  --text-3: #7a7974;
  --accent: #2F64E0;  /* azul Feromax */
  --s1: #2F64E0;   /* série 1 — azul Feromax */
  --s2: #eb6834;   /* série 2 — laranja */
  --s1-soft: #bcd0f7;
  --s2-soft: #f7c3ad;
  --critical: #d03b3b;
  --good: #00AD57;  /* verde Feromax */
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.03);
}
html.tema-escuro {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --line: #2c2c2a; --grid: #262624;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #92918a;
  --accent: #5b85f2; --s1: #5b85f2; --s2: #d95926; --s1-soft: #1e3f86; --s2-soft: #6e3218;
  --good: #1fc472; --shadow: none;
}
@media (prefers-color-scheme: dark) {
  html:not(.tema-claro) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --line: #2c2c2a; --grid: #262624;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #92918a;
    --accent: #5b85f2; --s1: #5b85f2; --s2: #d95926; --s1-soft: #1e3f86; --s2-soft: #6e3218;
    --good: #1fc472; --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 24px 48px; }
header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
header h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
header .sub { color: var(--text-3); font-size: 12.5px; }
header .spacer { flex: 1; }
button, .btn {
  font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 12px; cursor: pointer;
}
button:hover { border-color: var(--text-3); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.demo-banner {
  background: #fff4d6; color: #5c4400; border: 1px solid #f0d58a; border-radius: 8px;
  padding: 8px 12px; margin-bottom: 14px; font-size: 13px;
}
html.tema-escuro .demo-banner { background: #3a2e0c; color: #f5dc9a; border-color: #5e4a12; }
@media (prefers-color-scheme: dark) { html:not(.tema-claro) .demo-banner { background: #3a2e0c; color: #f5dc9a; border-color: #5e4a12; } }

/* filtros — uma linha acima de tudo */
.filtros {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; box-shadow: var(--shadow); margin-bottom: 14px;
}
.filtros label { color: var(--text-2); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
.filtros input[type=date] {
  font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 5px 8px;
}
.grupo { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip {
  border: 1px solid var(--line); background: var(--bg); color: var(--text-2);
  border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; user-select: none;
}
.chip[aria-pressed="true"] { background: var(--text); color: var(--surface); border-color: var(--text); }
.sep { width: 1px; align-self: stretch; background: var(--line); }

/* abas */
.abas { position: fixed; top: 0; left: 0; bottom: 0; width: 260px; display: flex; flex-direction: column; gap: 2px;
  padding: 18px 10px; background: var(--surface); border-right: 1px solid var(--line); box-shadow: var(--shadow);
  z-index: 60; transform: translateX(-105%); transition: transform .2s ease; overflow-y: auto; }
body.menu-aberto .abas { transform: none; }
.abas .menu-tit { font-weight: 700; padding: 6px 14px 12px; color: var(--text-3); font-size: .85em; text-transform: uppercase; letter-spacing: .05em; }
.abas .aba { text-align: left; border-bottom: 0; border-left: 3px solid transparent; border-radius: 6px; padding: 12px 14px; margin: 0; }
.abas .aba[aria-selected="true"] { border-left-color: var(--accent); background: var(--s1-soft); }
#menuFundo { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 59; display: none; }
body.menu-aberto #menuFundo { display: block; }
.abas .menu-rodape { margin-top: auto; border-top: 1px solid var(--line); padding: 14px 6px 4px; display: flex; flex-direction: column; gap: 8px; }
.abas .menu-acao { text-align: left; }
#btnMenu { font-size: 22px; line-height: 1; padding: 6px 11px; }
.aba-atual { font-size: 1.2em; font-weight: 700; margin: 4px 0 14px; }
.aba {
  border: 0; background: none; border-radius: 0; padding: 10px 14px; color: var(--text-3);
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 550;
}
.aba[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }

/* cartões */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi, .card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow);
}
.kpi { padding: 14px 16px; }
.kpi .rot { color: var(--text-2); font-size: 12.5px; }
.kpi .val { font-size: 22px; white-space: nowrap; font-weight: 650; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .det { color: var(--text-3); font-size: 12px; margin-top: 2px; }
.kpi .alerta { color: var(--critical); }
.grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 12px; }
@media (max-width: 520px) { .opc { display: none; } .sep { display: none; } .grade { grid-template-columns: 1fr; } .wrap { padding: 14px 12px 40px; } }
.card { padding: 14px 16px 12px; min-width: 0; }
.card h2 { font-size: 14px; font-weight: 620; margin: 0; }
.card .nota { color: var(--text-3); font-size: 12px; margin: 2px 0 8px; }
.card.cheio { grid-column: 1 / -1; }
.legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin: 4px 0 6px; }
.legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.grafico { position: relative; width: 100%; }
.grafico svg { display: block; width: 100%; height: auto; overflow: visible; }
.grafico text { fill: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }

/* tabelas */
.tabela-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--grid); text-align: left; white-space: nowrap; }
th { color: var(--text-3); font-weight: 550; font-size: 12px; }
td.n, th.n { text-align: right; }
tr.total td { font-weight: 650; border-bottom: 0; border-top: 1px solid var(--line); }
tbody tr:hover td { background: var(--bg); }
.neg { color: var(--critical); }

/* tooltip */
.tip {
  position: fixed; pointer-events: none; z-index: 10; opacity: 0; transition: opacity .08s;
  background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.12); min-width: 150px;
}
.tip .t { color: var(--text-3); font-size: 12px; margin-bottom: 4px; }
.tip .l { display: flex; justify-content: space-between; gap: 14px; }
.tip .l i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.tip .l b { font-weight: 600; font-variant-numeric: tabular-nums; }

.carregando { opacity: .55; transition: opacity .15s; }
.erro { background: #fde8e8; color: #8a1f1f; border: 1px solid #f3b9b9; border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
html.tema-escuro .erro { background: #3d1616; color: #f4b4b4; border-color: #6b2525; }
@media (prefers-color-scheme: dark) { html:not(.tema-claro) .erro { background: #3d1616; color: #f4b4b4; border-color: #6b2525; } }
.vazio { color: var(--text-3); padding: 28px 0; text-align: center; }
[hidden] { display: none !important; }
.controles { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 14px; }
.controles .rot { color: var(--text-2); font-size: 12.5px; }
.controles input[type=date] { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
.seta { padding: 5px 10px; }
.info { color: var(--text-2); font-size: 12.5px; background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; }
.rolagem { max-height: 520px; overflow: auto; }
.rolagem thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
td.sub { color: var(--text-3); font-size: 12.5px; }
.pop-wrap { position: relative; }
.pop {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 240px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  box-shadow: 0 8px 28px rgba(0,0,0,.14);
}
.pop h3 { font-size: 12px; color: var(--text-3); font-weight: 600; margin: 8px 0 4px; }
.pop h3:first-child { margin-top: 0; }
.pop label { display: flex; gap: 8px; align-items: center; padding: 4px 0; color: var(--text); font-size: 13px; cursor: pointer; }
.pop .acoes { display: flex; gap: 8px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 8px; }
.pop .acoes button { padding: 4px 10px; font-size: 12.5px; }
.chip.ativo-filtro { border-color: var(--accent); color: var(--accent); }
/* login */
.tela-login { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--bg); padding: 16px; }
.caixa-login, .modal-caixa { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
.caixa-login h2, .modal-caixa h2 { margin: 0 0 4px; font-size: 19px; }
.caixa-login p { color: var(--text-2); margin: 0 0 14px; font-size: 13px; }
.campo { display: block; margin: 10px 0 0; }
.campo span { display: block; font-size: 12.5px; color: var(--text-2); margin-bottom: 4px; }
.campo input, .campo select, .campo textarea {
  width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
}
.campo textarea { min-height: 60px; resize: vertical; }
.campo-linha { display: flex; gap: 10px; } .campo-linha .campo { flex: 1; min-width: 0; }
.btn-pri { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
.btn-pri:hover { filter: brightness(1.05); border-color: var(--accent); }
.btn-perigo { color: var(--critical); }
.msg-erro { color: var(--critical); font-size: 13px; min-height: 1em; margin-top: 10px; }
.msg-ok { color: var(--good); font-size: 13px; margin-top: 10px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; }
.modal { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.35); display: grid; place-items: center; padding: 16px; overflow: auto; }
.modal-caixa { max-width: 560px; }
.modal-acoes { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.selo { display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
.aviso { background: #fff4d6; color: #5c4400; border: 1px solid #f0d58a; border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; font-size: 13px; }
html.tema-escuro .aviso { background: #3a2e0c; color: #f5dc9a; border-color: #5e4a12; }
@media (prefers-color-scheme: dark) { html:not(.tema-claro) .aviso { background: #3a2e0c; color: #f5dc9a; border-color: #5e4a12; } }
td .acoes-linha { display: flex; gap: 6px; } td .acoes-linha button { padding: 3px 9px; font-size: 12.5px; }
.estimado { color: var(--text-3); font-style: italic; }
.tab-usuarios td { vertical-align: middle; } .tab-usuarios label { display: inline-flex; gap: 4px; align-items: center; margin-right: 8px; font-size: 12.5px; white-space: nowrap; }
.marca { display: flex; align-items: center; gap: 12px; }
.marca .logo { height: 30px; width: auto; display: block; }
.login-logo { height: 42px; width: auto; display: block; margin: 2px auto 14px; }
@media (max-width: 520px) { .marca .logo { height: 24px; } }
  .dre-per { position: relative; display: inline-block; }
  .dre-per summary { list-style: none; cursor: pointer; }
  .dre-per summary::-webkit-details-marker { display: none; }
  .dre-per .arvore { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow); padding: 10px 14px; min-width: 230px; max-height: 380px; overflow: auto; }
  .arvore label { display: flex; gap: 6px; align-items: center; padding: 3px 0; cursor: pointer; white-space: nowrap; }
  .arvore .ano { display: grid; grid-template-columns: 20px 1fr; align-items: center; }
  .arvore .tg { cursor: pointer; color: var(--text-3); user-select: none; }
  .arvore .meses { grid-column: 2; padding-left: 4px; }
  .secao { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 22px 0 10px; font-size: 1.05em; }
  .secao:first-child { margin-top: 4px; }
  .secao .tag { font-size: .72em; font-weight: 500; color: var(--text-2); background: var(--s1-soft); padding: 3px 10px; border-radius: 999px; }
  .secao .tag.fixo { background: var(--s2-soft); }
  .secao .tag.filtro, .nota-filtro { background: #fff3cd; color: #7a5a00; }
  .nota-filtro { font-size: .8em; padding: 3px 10px; border-radius: 999px; align-self: center; }
  .inds { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .ind { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; }
  .ind-tit { font-size: .82em; color: var(--text-2); font-weight: 600; }
  .ind-val { font-size: 1.55em; font-weight: 700; line-height: 1.15; }
  .ind-det { font-size: .78em; color: var(--text-3); }
  .ind .bom { color: #1a9e55; font-weight: 600; } .ind .ruim { color: #d23c3c; font-weight: 600; }
  table.perf td, table.perf th { white-space: nowrap; }
  table.perf td:first-child { font-weight: 600; }
  table.perf tr.t td { font-weight: 700; border-top: 2px solid var(--line); }
  table.perf tr.x td { color: var(--text-2); }
  table.perf tr.x td:first-child { font-weight: 500; }
  .pbar { display: inline-block; width: 54px; height: 7px; border-radius: 4px; background: var(--line); vertical-align: middle; margin-left: 6px; overflow: hidden; }
  .pbar i { display: block; height: 100%; background: var(--s1); }
  .pbar.ok i { background: #1a9e55; }
  .perf-ed { display: grid; gap: 14px; }
  .perf-ed input.num { width: 110px; text-align: right; }
  .perf-ed input.pct { width: 64px; text-align: right; }
  .perf-ed table td, .perf-ed table th { padding: 5px 8px; }
  .perf-ed .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
  .ind svg.spark { width: 100%; height: 30px; margin-top: 4px; }
  table.dre td, table.dre th { white-space: nowrap; }
  table.dre tr[hidden] { display: none; }
  table.dre .parcial { border-left: 2px solid var(--line); background: var(--s2-soft); }
  table.dre .pc.parcial { border-left: 0; }
  table.dre td.pc, table.dre th.pc { font-size: .74em; color: var(--text-3); padding-left: 2px; padding-right: 12px; }
  table.dre td:first-child, table.dre th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 230px; }
  table.dre tr.g td:first-child { cursor: pointer; font-weight: 600; }
  table.dre tr.g:hover td { background: var(--s1-soft); }
  table.dre tr.t td { font-weight: 700; border-top: 1px solid var(--line); }
  table.dre tr.t.d td { font-size: 1.05em; background: var(--s1-soft); }
  @media (max-width: 700px) {
    table.dre { font-size: 12px; }
    table.dre td, table.dre th { padding: 6px 7px; }
    table.dre td:first-child, table.dre th:first-child { min-width: 0; width: 40vw; max-width: 40vw; white-space: normal;
      line-height: 1.25; box-shadow: 3px 0 5px -3px rgba(0,0,0,.35); }
    table.dre td span.sub { display: none; }
    table.dre td[style*="padding-left:26px"] { padding-left: 12px !important; }
    table.dre td[style*="padding-left:46px"] { padding-left: 20px !important; }
  }
  table.dre tr.sep td { color: var(--text-3); font-size: .8em; padding-top: 16px; text-transform: uppercase; letter-spacing: .04em; }
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
  <header>
    <button id="btnMenu" title="Menu" aria-label="Abrir menu">☰</button>
    <div class="marca">
      <img src="logo-feromax.png" alt="Grupo Feromax" class="logo">
      <div>
        <h1>Painel Financeiro</h1>
        <div class="sub" id="status">Carregando…</div>
      </div>
    </div>
    <div class="spacer"></div>
    <label class="sub" style="display:flex;gap:6px;align-items:center">
      <input type="checkbox" id="auto" checked title="Atualiza sozinho a cada 2 horas e sempre às 17:45"> Atualização automática
    </label>
    <button id="btnAtualizar" title="Busca de novo os dados no banco. O ERP é copiado para o banco pelo sincronizador do PC a cada 5 minutos.">Atualizar</button>
    <button id="btnTema" title="Tema claro/escuro" aria-label="Alternar tema">🌙</button>
  </header>

  <div class="demo-banner" id="demo" hidden>
    Modo demonstração: os números abaixo são <b>fictícios</b>. Com o Supabase configurado, o painel mostra os dados reais do ERP.
  </div>
  <div class="aviso" id="aviso" hidden></div>
  <div class="erro" id="erro" hidden></div>

  <section class="filtros" aria-label="Filtros">
    <div class="grupo" id="periodo">
    <label>De <input type="date" id="dtIni"></label>
    <label>Até <input type="date" id="dtFim"></label>
    <div class="grupo" id="atalhos">
      <button class="chip" data-p="hoje">Hoje</button>
      <button class="chip" data-p="mes">Mês atual</button>
      <button class="chip" data-p="30">Últimos 30 dias</button>
      <button class="chip" data-p="90">Últimos 90 dias</button>
      <button class="chip" data-p="ano">Ano</button>
    </div>
    <span class="nota-filtro" id="notaPeriodo" hidden>⬅ na Visão geral, este filtro vale só para o bloco ⏮ Passado</span>
    </div>
    <div class="sep" id="sepPeriodo"></div>
    <div class="grupo" id="empresas" aria-label="Empresas"></div>
    <div class="sep"></div>
    <div class="pop-wrap">
      <button class="chip" id="btnBancos" aria-haspopup="true" aria-expanded="false">Bancos: todos ▾</button>
      <div class="pop" id="popBancos" hidden></div>
    </div>
  </section>

  <div id="menuFundo"></div>
  <div class="aba-atual" id="abaAtual"></div>
  <nav class="abas" role="tablist">
    <div class="menu-tit">Menu</div>
    <button class="aba" role="tab" data-aba="dia" aria-selected="true">Resumo do dia</button>
    <button class="aba" role="tab" data-aba="geral" aria-selected="false">Visão geral</button>
    <button class="aba" role="tab" data-aba="performance" aria-selected="false">Performance de vendas</button>
    <button class="aba" role="tab" data-aba="projecao" aria-selected="false">Fluxo projetado</button>

function gerarDemo(inicio, fim, empresas) {
  let semente = 7;
  const rnd = () => (semente = (semente * 16807) % 2147483647) / 2147483647;
  const cfg = DEMO_BANCOS;
  const ate = fim < hojeISO() ? fim : hojeISO();
  const bancos = [], pagar = [], receber = [];
  for (const e of [1, 2]) {
    for (const [b, base] of cfg[e]) {
      let saldo = base;
      for (let d = inicio; d <= ate; d = somaDias(d, 1)) {
        const dow = parseISO(d).getDay();
        const util = dow !== 0 && dow !== 6;
        const ent = util ? Math.round(base * (0.02 + rnd() * 0.06)) : 0;
        const sai = util ? Math.round(base * (0.02 + rnd() * 0.065)) : 0;
        saldo += ent - sai;
        if (empresas.includes(e) && bancoSelecionado(e, b)) bancos.push([e, b, d, saldo, ent, sai]);
      }
    }
  }
  for (let d = inicio; d <= fim; d = somaDias(d, 1)) {
    const dow = parseISO(d).getDay();
    if (dow === 0 || dow === 6) continue;
    for (const e of empresas) {
      const k = e === 1 ? 1 : 0.45;
      const venc = d < hojeISO();
      for (const [conta, sub] of [[20, 1], [20, 3], [21, 2]]) {
        const tot = Math.round(k * (4000 + rnd() * 26000));
        pagar.push([d, e, conta, sub, tot, venc ? (rnd() < 0.12 ? tot : 0) : tot]);
      }
      const tr = Math.round(k * (15000 + rnd() * 55000));
      receber.push([d, e, tr, venc ? Math.round(tr * (rnd() < 0.3 ? rnd() * 0.5 : 0)) : tr]);
    }
  }
  const k = empresas.reduce((s, e) => s + (e === 1 ? 1 : 0.45), 0);
  const faixas = [[1, 38, 186000], [2, 14, 72400], [3, 9, 41800], [4, 6, 30500], [5, 11, 58900]]
    .map(([faixa, qtd, valor]) => ({ faixa, qtd: Math.round(qtd * k), valor: Math.round(valor * k) }));
  const nomes = ['Mercado Bom Preço', 'Construtora Horizonte', 'Distribuidora Sul', 'Padaria Real', 'Auto Peças Leste',
    'Hotel Mirante', 'Clínica Vida', 'Transportes Rápido', 'Loja do Bairro', 'Escola Saber'];
  const topAtraso = nomes.map((nome, i) => ({ cod: 100 + i, nome, qtd: 6 - Math.floor(i / 2), valor: Math.round(k * (52000 / (1 + i * 0.45))), dias: 12 + ((i * 37) % 160) }));
  return { atualizadoEm: new Date().toISOString(), bancos, pagar, receber, faixas, topAtraso };
}

// busca todas as linhas (o Supabase devolve no máximo 1000 por vez)
async function buscarTodos(fazConsulta) {
  const TAM = 1000; let de = 0, todos = [];
  for (;;) {
    const { data, error } = await fazConsulta().range(de, de + TAM - 1);
    if (error) throw new Error(error.message);
    todos = todos.concat(data || []);
    if (!data || data.length < TAM) break;
    de += TAM;
  }
  return todos;
}

}

async function carregarConfig() {

  est.ptax = c.ptax || null;

  const querAbertos = temArea('titulos') && ['geral', 'pagar', 'receber'].includes(est.aba) && ger('titulos_abertos') >= 0;
  const geral = est.aba === 'geral';
  const [saldos, tits, faixas, venc, abertos, saldoHoje, dre] = await Promise.all([
    temArea('caixa') ? buscarTodos(() => sb.from('saldo_diario').select('empresa,banco,data,saldo,entradas,saidas')
      .eq('geracao', ger('saldo_diario')).in('empresa', emps).gte('data', est.inicio).lte('data', est.fim)
      .order('data').order('empresa').order('banco')) : [],
    temArea('titulos') ? buscarTodos(() => sb.from('titulos').select('tipo,empresa,vencimento,conta,sub_conta,total,aberto')
      .eq('geracao', ger('titulos')).in('empresa', emps).gte('vencimento', est.inicio).lte('vencimento', est.fim)
      .order('vencimento').order('tipo').order('empresa').order('conta').order('sub_conta')) : [],
    temArea('titulos') ? buscarTodos(() => sb.from('inadimplencia').select('empresa,faixa,qtd,valor')
      .eq('geracao', ger('inadimplencia')).in('empresa', emps).order('empresa').order('faixa')) : [],
    temArea('titulos') ? buscarTodos(() => sb.from('vencidos_cliente').select('empresa,cod_cliente,nome,qtd,valor,dias_max')
      .eq('geracao', ger('vencidos_cliente')).in('empresa', emps).order('valor', { ascending: false })) : [],
    querAbertos ? buscarTodos(() => sb.from('titulos_abertos').select('tipo,empresa,vencimento,titulo,parcela,cod,nome,conta,aberto')
      .eq('geracao', ger('titulos_abertos')).in('empresa', emps).order('vencimento').order('tipo').order('titulo')) : null,
    // saldo da data mais recente (posição de hoje, independe do filtro)
    geral && temArea('caixa') ? (async () => {
      const { data: u } = await sb.from('saldo_diario').select('data').eq('geracao', ger('saldo_diario')).in('empresa', emps)
        .lte('data', hojeISO()).order('data', { ascending: false }).limit(1);
      const dt = u && u[0] && u[0].data; if (!dt) return null;
      const rows = await buscarTodos(() => sb.from('saldo_diario').select('empresa,banco,saldo').eq('geracao', ger('saldo_diario'))
        .in('empresa', emps).eq('data', dt).order('empresa').order('banco'));
      return { data: dt, rows };
    })() : null,
    geral && temArea('dre') && ger('dre_mensal') >= 0 ? buscarTodos(() => sb.from('dre_mensal').select('empresa,mes,conta,familia,valor')
      .eq('geracao', ger('dre_mensal')).in('empresa', emps).order('mes').order('conta').order('familia')) : null,
  ]);
  const contasPagar = (est.contas.pagar || []).map(Number);
  const semTransf = tits.filter(r => !ehTransferencia(`${r.conta}.${r.sub_conta}`));
  const pagar = semTransf.filter(r => r.tipo === 'P' && (!contasPagar.length || contasPagar.includes(Number(r.conta))))
    .map(r => [r.vencimento, r.empresa, r.conta, r.sub_conta, Number(r.total), Number(r.aberto)]);
  const rec = new Map();
  for (const r of semTransf.filter(t => t.tipo === 'R')) {
    const k = r.vencimento + '|' + r.empresa;
    const x = rec.get(k) || [r.vencimento, r.empresa, 0, 0];
    x[2] += Number(r.total); x[3] += Number(r.aberto); rec.set(k, x);
  }
  const fx = new Map();
  for (const f of faixas) { const x = fx.get(f.faixa) || { faixa: f.faixa, qtd: 0, valor: 0 }; x.qtd += f.qtd; x.valor += Number(f.valor); fx.set(f.faixa, x); }
  const cli = new Map();
  for (const v of venc) {
    const k = v.cod_cliente || v.nome;
    const x = cli.get(k) || { cod: v.cod_cliente, nome: v.nome || `Cliente ${v.cod_cliente}`, qtd: 0, valor: 0, dias: 0 };
    x.qtd += v.qtd; x.valor += Number(v.valor); x.dias = Math.max(x.dias, v.dias_max); cli.set(k, x);
  }
  return {
    atualizadoEm: new Date().toISOString(),
    bancos: saldos.filter(r => bancoSelecionado(r.empresa, r.banco)).map(r => [r.empresa, r.banco, r.data, Number(r.saldo), Number(r.entradas), Number(r.saidas)]),
    pagar, receber: [...rec.values()], faixas: [...fx.values()],
    topAtraso: [...cli.values()].sort((a, b) => b.valor - a.valor).slice(0, 10),
    abertos: abertos ? abertos.filter(t => !ehTransferencia(t.conta)).map(t => ({ ...t, aberto: Number(t.aberto) })) : null,
    saldoHoje: saldoHoje ? { data: saldoHoje.data, contas: saldoHoje.rows.filter(r => bancoSelecionado(r.empresa, r.banco)).map(r => [r.empresa, r.banco, Number(r.saldo)]) } : null,
    dre: dre ? dre.map(r => ({ ...r, valor: Number(r.valor) })) : null,
  };
}

async function lerProj() {
  await lerGeracoes();
  const hoje = hojeISO(), ate = somaDias(hoje, est.horizonte);
  const [saldos, tits] = await Promise.all([
    buscarTodos(() => sb.from('saldo_diario').select('empresa,banco,data,saldo')
      .eq('geracao', ger('saldo_diario')).in('empresa', est.empresas).gte('data', somaDias(hoje, -10)).lte('data', hoje)
      .order('data').order('empresa').order('banco')),
    buscarTodos(() => sb.from('titulos').select('tipo,empresa,vencimento,conta,qtd_aberto,aberto')
      .eq('geracao', ger('titulos')).in('empresa', est.empresas).gt('aberto', 0).lte('vencimento', ate)
      .order('vencimento').order('tipo').order('empresa').order('conta')),
  ]);
  if (temArea('importacoes')) await lerImportacoes();
  const ultimo = new Map();   // último saldo de cada banco (até hoje)
  for (const r of saldos) if (bancoSelecionado(r.empresa, r.banco)) ultimo.set(r.empresa + '-' + r.banco, Number(r.saldo));
  const contasProj = (est.contas.projecao || []).map(Number);
  const junta = lista => {
    const m = new Map();
    for (const r of lista) {
      const k = r.vencimento < hoje ? null : r.vencimento;
      const x = m.get(k) || [k, 0, 0]; x[1] += r.qtd_aberto; x[2] += Number(r.aberto); m.set(k, x);
    }
    return [...m.values()];
  };
  return {
    atualizadoEm: new Date().toISOString(), hoje, ate,
    saldoHoje: [...ultimo.values()].reduce((s, v) => s + v, 0),
    receber: junta(tits.filter(r => r.tipo === 'R')),
    pagar: junta(tits.filter(r => r.tipo === 'P' && (!contasProj.length || contasProj.includes(Number(r.conta))))),
  };
}

    if (trocaLocal) est.cambioSalvo = cam.valor; else { est.cambio = cam.valor; est.cambioSalvo = { ...cam.valor }; }

// pagamentos do módulo Importações (imp_cambios) marcados "No fluxo" e ainda não pagos
async function lerImpFluxo() {
  if (est.demo) return;

    const parc = await buscarTodos(() => sb.from('imp_cambios').select('id,processo_id,empresa,tipo,valor_usd,valor_previsto_brl,taxa_di,data_prevista,observacao')
      .eq('no_fluxo', true).eq('pago', false).order('data_prevista'));
    const ids = [...new Set(parc.map(c => c.processo_id))];
    const procs = ids.length ? await buscarTodos(() => sb.from('imp_processos').select('id,empresa,fornecedor,pedido,cambio_di,estimativa,status').in('id', ids)) : [];
    const pm = new Map(procs.map(x => [x.id, x]));
    est.impFluxo = parc.filter(c => c.data_prevista && pm.has(c.processo_id) && pm.get(c.processo_id).status !== 'fechado').map(c => ({ ...c, processo: pm.get(c.processo_id) }));
  } catch (_) { est.impFluxo = []; }

// valor em R$ de um pagamento do módulo no fluxo: câmbio = US$ × câmbio do painel (PTAX ou manual, card "Importações no fluxo")
// (o câmbio ainda vai ser fechado no futuro; a taxa da DI/estimativa continua valendo para o fator dentro do processo)
function valorImpModulo(c) {
  if ((c.tipo || 'Câmbio') !== 'Câmbio') return { valor: Number(c.valor_previsto_brl || 0), taxa: null };
  const taxa = cambioAtual() || Number(c.processo && c.processo.cambio_di) || Number(c.taxa_di) || 0;
  return { valor: Number(c.valor_usd || 0) * taxa, taxa };
}

// importações entram como saídas no fluxo projetado
function importacoesNoFluxo(hoje, ate) {
  if (!temArea('importacoes')) return [];
  const antigas = est.importacoes.filter(i => i.no_fluxo && est.empresas.includes(i.empresa) && i.previsao <= ate && i.status !== 'Estoque');
  const modulo = (est.impFluxo || []).filter(c => est.empresas.includes(c.empresa) && c.data_prevista <= ate).map(c => {
    const v = valorImpModulo(c);
    return { modulo: true, id: c.id, processo_id: c.processo_id, previsao: c.data_prevista, empresa: c.empresa, tipo: c.tipo || 'Câmbio',
      fornecedor: c.processo.fornecedor, pedido: c.processo.pedido, valor_brl: v.valor, valor_usd: c.valor_usd, taxa: v.taxa, observacao: c.observacao };
  });
  return antigas.concat(modulo).sort((a, b) => a.previsao.localeCompare(b.previsao));
}

function avisoSincronizacao() {
  if (est.demo || !est.syncStatus.length) { $('#aviso').hidden = true; return ''; }
  const datas = est.syncStatus.map(r => r.atualizado_em).filter(Boolean).map(d => new Date(d));
  const ultima = datas.length ? new Date(Math.min(...datas)) : null;
  const erros = est.syncStatus.filter(r => r.erro);
  const intervalo = (est.syncInfo && est.syncInfo.intervalo_min) || 5;
  const atrasado = !ultima || (Date.now() - ultima) > Math.max(30, intervalo * 4) * 60e3;
  const partes = [];
  if (atrasado) partes.push(`Os dados do ERP não são atualizados desde ${ultima ? ultima.toLocaleString('pt-BR') : '—'}. Verifique se o computador do sincronizador está ligado.`);
  if (erros.length) partes.push(`Erro ao atualizar: ${erros.map(r => r.tabela).join(', ')}.`);
  $('#aviso').textContent = partes.join(' ');
  $('#aviso').hidden = !partes.length;
  return ultima ? `Dados do ERP de ${ultima.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}` : '';
}

function salvarFiltros(atalho) {
  try { localStorage.setItem('painel-filtros', JSON.stringify({ empresas: est.empresas, atalho, inicio: est.inicio, fim: est.fim, bancos: est.bancosSel ? [...est.bancosSel] : null })); } catch (_) {}
}

function aplicarAtalho(p, recarregar = true) {
  const h = hojeISO();
  const d = new Date();
  if (p === 'hoje') { est.inicio = h; est.fim = h; }
  if (p === 'mes') { est.inicio = iso(new Date(d.getFullYear(), d.getMonth(), 1)); est.fim = h; }
  if (p === '30') { est.inicio = somaDias(h, -29); est.fim = h; }
  if (p === '90') { est.inicio = somaDias(h, -89); est.fim = h; }
  if (p === 'ano') { est.inicio = `${d.getFullYear()}-01-01`; est.fim = h; }
  document.querySelectorAll('#atalhos .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === p)));
  $('#dtIni').value = est.inicio; $('#dtFim').value = est.fim;
  if (recarregar) { salvarFiltros(p); carregar(); }
}

function montarFiltros() {
  $('#dtIni').value = est.inicio; $('#dtFim').value = est.fim;
  const box = $('#empresas');
  box.innerHTML = '';
  for (const [cod, nome] of Object.entries(est.empresasDisp)) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = nome;
    b.setAttribute('aria-pressed', String(est.empresas.includes(Number(cod))));
    b.onclick = () => {
      const c = Number(cod);
      const sel = est.empresas.includes(c) ? est.empresas.filter(x => x !== c) : [...est.empresas, c];
      if (!sel.length) return; // sempre ao menos uma
      est.empresas = sel.sort();
      b.setAttribute('aria-pressed', String(sel.includes(c)));
      montarPopBancos();
      salvarFiltros(document.querySelector('#atalhos .chip[aria-pressed=true]')?.dataset.p || 'custom');
      carregar();
    };
    box.appendChild(b);
  }
  montarPopBancos();
}

// ---------- filtro de bancos ----------
function montarPopBancos() {
  const pop = $('#popBancos');
  let html = '';
  for (const e of est.empresas) {
    const lista = est.bancosDisp[e] || [];
    if (!lista.length) continue;
    html += `<h3>${esc(nomeEmpresa(e))}</h3>` + lista.map(b =>
      `<label><input type="checkbox" data-k="${e}-${b}" ${bancoSelecionado(e, b) ? 'checked' : ''}> ${esc(nomeBanco(e, b))} <span class="sub" style="color:var(--text-3)">(${b})</span></label>`).join('');
  }
  html += `<div class="acoes"><button data-a="todos">Todos</button><button data-a="nenhum">Limpar</button></div>`;
  pop.innerHTML = html;
  pop.querySelectorAll('input').forEach(i => i.onchange = () => {
    const marcados = [...pop.querySelectorAll('input:checked')].map(x => x.dataset.k);
    const todos = [...pop.querySelectorAll('input')].map(x => x.dataset.k);
    est.bancosSel = marcados.length === todos.length ? null : new Set(marcados);
    aposMudarBancos();
  });
  pop.querySelector('[data-a=todos]').onclick = () => { est.bancosSel = null; montarPopBancos(); aposMudarBancos(); };
  pop.querySelector('[data-a=nenhum]').onclick = () => { est.bancosSel = new Set(); montarPopBancos(); aposMudarBancos(false); };
  rotuloBancos();
}
function rotuloBancos() {
  const visiveis = est.empresas.flatMap(e => (est.bancosDisp[e] || []).map(b => `${e}-${b}`));
  const n = visiveis.filter(k => !est.bancosSel || est.bancosSel.has(k)).length;
  const btn = $('#btnBancos');
  btn.textContent = !est.bancosSel || n === visiveis.length ? 'Bancos: todos ▾' : n === 1
    ? `Banco: ${nomeBanco(...visiveis.find(k => est.bancosSel.has(k)).split('-').map(Number))} ▾` : `Bancos: ${n} de ${visiveis.length} ▾`;
  btn.classList.toggle('ativo-filtro', !!est.bancosSel && n !== visiveis.length);
}
let tBancos;
function aposMudarBancos(recarregar = true) {
  rotuloBancos();
  salvarFiltros(document.querySelector('#atalhos .chip[aria-pressed=true]')?.dataset.p || 'custom');
  clearTimeout(tBancos);
  if (recarregar) tBancos = setTimeout(carregar, 350);
}
function paramBancos() {
  if (!est.bancosSel) return {};
  const lista = est.empresas.flatMap(e => (est.bancosDisp[e] || []).map(b => `${e}-${b}`)).filter(k => est.bancosSel.has(k));
  return { bancos: lista.length ? lista.join(',') : '0-0' };
}

let seq = 0;
async function carregar() {
  if (!est.aba) return;
  const meu = ++seq;
  $('#conteudo').classList.add('carregando');
  $('#erro').hidden = true;
  try {
    const aba = est.aba;
    let desc = '';
    if (aba === 'dia') {
      const d = est.demo ? gerarDemoDia(est.dia, est.baseDia) : await lerDia();
      if (meu !== seq) return; est.dadosDia = d; desc = `dia ${ddmmaa(est.dia)}`;
    } else if (aba === 'projecao') {
      const d = est.demo ? gerarDemoProj(est.horizonte) : await lerProj();
      if (meu !== seq) return; est.dadosProj = d; desc = `projeção de ${est.horizonte} dias`;
    } else if (aba === 'performance') {
      const d = est.demo ? null : await lerPerformance();
      if (meu !== seq) return; est.dadosPerf = d; desc = 'Performance de vendas';
    } else if (aba === 'indicadores') {
      const d = est.demo ? { dre: [], abertos: null, saldos: null, movs: null } : await lerIndicadores();
      if (meu !== seq) return; est.dadosInd = d; desc = 'Indicadores';
    } else if (aba === 'dre') {
      const d = est.demo ? { linhas: [] } : await lerDre();
      if (meu !== seq) return; est.dadosDre = d; desc = 'DRE';
    } else if (aba === 'importacoes') {
      if (!est.demo) { await lerGeracoes(); await lerImportacoes(); }
      // recarrega os dados do módulo embutido (processos, pagamentos, produtos…)
      const fr = $('#impModulo');
      try { const w = fr && fr.contentWindow; if (w && w.recarregar && w.est && !w.est.demo && w.est.perfil) await w.recarregar(); } catch (_) {}
      if (meu !== seq) return; desc = 'importações';
    } else if (aba === 'usuarios') {
      if (!est.demo) { await lerGeracoes(); await lerUsuarios(); }
      if (meu !== seq) return; desc = 'usuários';
    } else {
      const d = est.demo ? gerarDemo(est.inicio, est.fim, est.empresas) : await lerPainel();
      if (meu !== seq) return; est.dados = d; desc = `${ddmmaa(est.inicio)} a ${ddmmaa(est.fim)}`;
    }
    const erp = avisoSincronizacao();
    $('#status').textContent = [erp || `Atualizado às ${new Date().toLocaleTimeString('pt-BR')}`, desc].filter(Boolean).join(' · ');
    render();
  } catch (e) {
    mostrarErro('Não foi possível carregar os dados: ' + e.message);
  } finally {
    if (meu === seq) $('#conteudo').classList.remove('carregando');
  }
}

// ======================= cálculos =======================
function calcular() {
  const d = est.dados;
  // bancos
  const porConta = new Map();
  const totalDia = new Map();
  for (const [e, b, data, saldo, ent, sai] of d.bancos) {
    const k = e + '-' + b;
    if (!porConta.has(k)) porConta.set(k, { e, b, nome: nomeBanco(e, b), serie: [], ent: 0, sai: 0 });
    const c = porConta.get(k);
    c.serie.push([data, saldo]); c.ent += ent; c.sai += sai;
    if (c.serie.length === 1) c.ini = saldo - ent + sai;
    c.fim = saldo;
    const t = totalDia.get(data) || { saldo: 0, ent: 0, sai: 0 };
    t.saldo += saldo; t.ent += ent; t.sai += sai;
    totalDia.set(data, t);
  }
  const contas = [...porConta.values()].sort((a, b) => a.e - b.e || b.fim - a.fim);
  const dias = [...totalDia.keys()].sort();
  const serieSaldo = dias.map(x => [x, totalDia.get(x).saldo]);
  const saldoFim = contas.reduce((s, c) => s + c.fim, 0);
  const saldoIni = contas.reduce((s, c) => s + c.ini, 0);
  const entradas = contas.reduce((s, c) => s + c.ent, 0);
  const saidas = contas.reduce((s, c) => s + c.sai, 0);
  // separa contas operacionais de aplicações (investimento)
  const oper = contas.filter(c => !ehAplicacao(c.b)), aplic = contas.filter(c => ehAplicacao(c.b));
  const saldoContas = oper.reduce((s, c) => s + c.fim, 0), iniContas = oper.reduce((s, c) => s + c.ini, 0);
  const saldoAplic = aplic.reduce((s, c) => s + c.fim, 0), iniAplic = aplic.reduce((s, c) => s + c.ini, 0);
  const temAplic = aplic.length > 0;

  // pagar / receber
  const pagTot = d.pagar.reduce((s, r) => s + r[4], 0);
  const pagAb = d.pagar.reduce((s, r) => s + r[5], 0);
  const recTot = d.receber.reduce((s, r) => s + r[2], 0);
  const recAb = d.receber.reduce((s, r) => s + r[3], 0);

  return { contas, serieSaldo, saldoFim, saldoIni, saldoContas, iniContas, saldoAplic, iniAplic, temAplic, entradas, saidas, pagTot, pagAb, recTot, recAb, vencido, vencidoQtd };
}

// agrupa por dia (ou por semana quando o período é longo)
function agrupar(linhas, idxData, idxValores) {
  const longo = (parseISO(est.fim) - parseISO(est.inicio)) / 864e5 > 62;
  const chave = s => {
    if (!longo) return s;
    const dt = parseISO(s); const dow = (dt.getDay() + 6) % 7; dt.setDate(dt.getDate() - dow); return iso(dt);
  };
  const m = new Map();
  for (const r of linhas) {
    const k = chave(r[idxData]);
    const acc = m.get(k) || idxValores.map(() => 0);
    idxValores.forEach((ix, i) => { acc[i] += r[ix]; });
    m.set(k, acc);
  }
  const ks = [...m.keys()].sort();
  return { longo, cats: ks, valores: idxValores.map((_, i) => ks.map(k => m.get(k)[i])) };
}

// fluxo projetado: saldo de hoje + recebimentos − pagamentos em aberto, dia a dia (até 12 meses)
function fluxoProjetado(saldo0, ab, hoje) {
  const net = new Map();
  for (const t of ab.R) if (t.vencimento >= hoje) net.set(t.vencimento, (net.get(t.vencimento) || 0) + t.aberto);
  for (const t of ab.P) if (t.vencimento >= hoje) net.set(t.vencimento, (net.get(t.vencimento) || 0) - t.aberto);
  let sd = saldo0, des = null; const serie = [];
  for (let i = 0; i <= 365; i++) {
    const dia = somaDias(hoje, i); sd += net.get(dia) || 0;
    if (i <= 30) serie.push([dia, sd]);
    if (!des && sd < 0) des = { data: dia, saldo: sd };
    if (i >= 30 && des) break;
  }
  return { serie, des };
}

function calcDre(L) {
  const mesHoje = hojeISO().slice(0, 7);
  const disp = [...new Set(L.map(r => r.mes))].filter(m => m <= mesHoje).sort();
  const ultimos = n => { const fim = somaMes(mesHoje, -1); return Array.from({ length: n }, (_, k) => somaMes(fim, k - n + 1)); };
  const cfg = est.dreCfg ||= { sel: [...ultimos(12), mesHoje], meses: window.innerWidth > 700, abertos: ['rec'], anosAbertos: [], perAberto: false };
  const sel = new Set(cfg.sel);
  const meses = disp.filter(m => sel.has(m));
  const anos = [...new Set(disp.map(m => m.slice(0, 4)))].sort().reverse();
  const nM = meses.length, idx = new Map(meses.map((m, i) => [m, i])), vaz = () => new Array(nM).fill(0);
  const porConta = new Map(), porFam = new Map();
  const acc = (map, k, i, v) => { let a = map.get(k); if (!a) map.set(k, a = vaz()); a[i] += v; };
  for (const r of L) {
    const i = idx.get(r.mes); if (i === undefined || ehTransferencia(r.conta)) continue;
    const v = sinalDre(r.conta) * r.valor;
    acc(porConta, r.conta, i, v);
    if (r.conta === '10.01.01' || r.conta === 'CMV') acc(porFam, r.conta + '|' + famDe(r.familia), i, v);
  }
  const gV = {}, gC = {};
  for (const g of DRE_GRUPOS) { gV[g.id] = vaz(); gC[g.id] = []; }
  // IR/CSLL = títulos pela data de emissão (já cadastrados rateados mês a mês).
  // Mês atual (parcial), sem título ainda: provisão = receita da empresa 1 no mês × % do mês anterior da empresa 1.
  const CONTAS_REC = DRE_GRUPOS[0].contas;
  const iAtual = meses.indexOf(mesHoje);
  let notaIr = '';
  if (iAtual >= 0) {
    const ant = somaMes(mesHoje, -1);
    const s1 = (mes, ok) => L.reduce((t, r) => t + (Number(r.empresa) === 1 && r.mes === mes && ok(r.conta) ? r.valor : 0), 0);
    const recAnt = s1(ant, c => CONTAS_REC.includes(c)), recAtu = s1(mesHoje, c => CONTAS_REC.includes(c)), tx = {};
    for (const c of ['21.02.01', '21.02.11']) {
      tx[c] = recAnt ? s1(ant, x => x === c) / recAnt : 0;
      if (!s1(mesHoje, x => x === c) && tx[c]) { let a = porConta.get(c); if (!a) porConta.set(c, a = vaz()); a[iAtual] -= recAtu * tx[c]; }
    }
    if (tx['21.02.01'] || tx['21.02.11']) notaIr = ` · ${rotMes(mesHoje)} parcial: IRPJ/CSLL provisionados com ${pctTxt(tx['21.02.01'])} / ${pctTxt(tx['21.02.11'])} da receita da empresa 1 (% de ${rotMes(ant)})`;
  }
  for (const [c, a] of porConta) { const g = grupoDre(c); gC[g].push(c); a.forEach((v, i) => { gV[g][i] += v; }); }
  for (const g of DRE_GRUPOS) if (g.soma) gV[g.id] = meses.map((_, i) => g.soma.reduce((s, id) => s + gV[id][i], 0));
  // mês atual (parcial) fica numa coluna à parte, depois da média; total e média só com meses fechados
  const sepAt = iAtual >= 0 && nM > 1;
  const idxs = meses.map((_, k) => k).filter(k => !sepAt || k !== iAtual);
  const tot = a => idxs.reduce((s, k) => s + a[k], 0);
  const med = a => tot(a) / idxs.length;
  const recT = tot(gV.rec);
  return { mesHoje, disp, ultimos, cfg, sel, meses, anos, nM, porConta, porFam, gV, gC, iAtual, notaIr, sepAt, idxs, tot, med, recT };
}

function renderDre(el) {
  const L = est.dadosDre.linhas;
  if (!L.length) { el.innerHTML = '<div class="card"><div class="vazio">O DRE aparece aqui depois da próxima atualização do sincronizador.</div></div>'; return; }
  const D = calcDre(L);
  const { mesHoje, disp, cfg, sel, meses, anos, nM, porConta, porFam, gV, gC, iAtual, notaIr, sepAt, idxs, tot, med, recT } = D;
  const f = v => Math.abs(v) < 0.5 ? '–' : R0(v);
  // % de cada linha sobre a receita do próprio mês (como na planilha)
  const pc2 = x => isFinite(x) && Math.abs(x) > 0.00005 ? (x * 100).toFixed(2).replace('.', ',') + '%' : '';
  const pcM = (v, k, extra = '') => `<td class="n pc${extra}">${gV.rec[k] ? pc2(v / gV.rec[k]) : ''}</td>`;

    + `<td class="n ${neg && tot(a) < 0 ? 'neg' : ''}"><b>${f(tot(a))}</b></td><td class="n">${f(med(a))}</td>`
    + (sepAt ? `<td class="n parcial ${neg && a[iAtual] < 0 ? 'neg' : ''}">${f(a[iAtual])}</td>${pcM(a[iAtual], iAtual, ' parcial')}` : '')
    + `<td class="n pc">${recT ? pc2(tot(a) / recT) : ''}</td>`;
  const linhas = []; let sep = false;
  for (const g of DRE_GRUPOS) {
    if (g.fora && !gC[g.id].length) continue;
    if (g.fora && !sep) { sep = true; linhas.push(`<tr class="sep"><td colspan="${(cfg.meses ? idxs.length * 2 : 0) + 4 + (sepAt ? 2 : 0)}">Abaixo do resultado — não entram no lucro</td></tr>`); }

    const aberto = cfg.abertos.includes(g.id);
    const h = aberto ? '' : ' hidden';
    linhas.push(`<tr class="g" data-g="${g.id}"><td><span class="seta-g">${aberto ? '▾' : '▸'}</span> ${g.nome}</td>${cel(gV[g.id])}</tr>`);
    for (const c of gC[g.id].sort((a, b) => Math.abs(tot(porConta.get(b))) - Math.abs(tot(porConta.get(a))))) {
      linhas.push(`<tr data-pai="${g.id}"${h}><td style="padding-left:26px">${esc(c === 'CMV' ? 'Custo das mercadorias vendidas' : descConta(c))} <span class="sub">${c === 'CMV' ? '' : c}</span></td>${cel(porConta.get(c))}</tr>`);
      if (c === '10.01.01' || c === 'CMV') {
        const fams = [...porFam.entries()].filter(([k]) => k.startsWith(c + '|')).sort((a, b) => Math.abs(tot(b[1])) - Math.abs(tot(a[1])));
        for (const [k, a] of fams) linhas.push(`<tr data-pai="${g.id}"${h}><td style="padding-left:46px" class="sub">${esc(k.split('|')[1])}</td>${cel(a)}</tr>`);
      }
    }
  }
  const t = id => tot(gV[id]);
  const rotPer = rotPeriodoDre(D);
  el.innerHTML = `
  <div class="kpis">
    ${kpi('Receita', R0(recT), `média ${R0(med(gV.rec))}/mês${sepAt ? ` · ${rotMes(mesHoje)} parcial: ${R0(gV.rec[iAtual])}` : ''}`)}
    ${kpi('Margem de contribuição', R0(t('mc')), recT ? pctTxt(t('mc') / recT) + ' da receita' : '', t('mc') < 0 ? 'neg' : '')}
    ${kpi('EBITDA', R0(t('ebitda')), recT ? pctTxt(t('ebitda') / recT) + ' da receita' : '', t('ebitda') < 0 ? 'neg' : '')}
    ${kpi('Lucro ou prejuízo', R0(t('lucro')), recT ? pctTxt(t('lucro') / recT) + ' da receita' : '', t('lucro') < 0 ? 'neg' : '')}
  </div>
  <div class="card cheio">
    <div class="controles">
      ${htmlPeriodoDre(D)}
      <div class="sep"></div>
      <label class="rot"><input type="checkbox" id="dreMeses" ${cfg.meses ? 'checked' : ''}> mostrar meses</label>

      <button class="chip" id="dreAbrir">Expandir tudo</button><button class="chip" id="dreFechar">Recolher tudo</button>
    </div>
    <div class="nota">Competência (data de emissão) · ${rotPer}${notaIr} · clique num grupo para abrir as contas</div>
    ${!nM ? '<div class="vazio">Selecione pelo menos um mês no período.</div>' : `<div class="tabela-wrap rolagem"><table class="dre">
      <thead><tr><th>Conta</th>${cfg.meses ? idxs.map(k => `<th class="n">${rotMes(meses[k])}</th><th class="n pc">%</th>`).join('') : ''}<th class="n">Total</th><th class="n">Média/mês</th>${sepAt ? `<th class="n parcial">${rotMes(mesHoje)} parcial</th><th class="n pc parcial">%</th>` : ''}<th class="n pc">% total</th></tr></thead>
      <tbody>${linhas.join('')}</tbody>
    </table></div>`}
  </div>`;
  // re-desenha mantendo a posição da tela e da rolagem lateral da tabela
  const re = () => {
    const y = window.scrollY, w = el.querySelector('.tabela-wrap'), x = w ? w.scrollLeft : 0, yt = w ? w.scrollTop : 0;
    renderDre(el); window.scrollTo(0, y);
    const w2 = el.querySelector('.tabela-wrap'); if (w2) { w2.scrollLeft = x; w2.scrollTop = yt; }
  };
  ligarPeriodoDre(el, D, re);
  $('#dreMeses').onchange = e => { cfg.meses = e.target.checked; re(); };
  const marcar = (id, ab) => {
    const k = cfg.abertos.indexOf(id); if (ab && k < 0) cfg.abertos.push(id); if (!ab && k >= 0) cfg.abertos.splice(k, 1);
    el.querySelectorAll(`tr[data-pai="${id}"]`).forEach(r => { r.hidden = !ab; });
    const sp = el.querySelector(`tr.g[data-g="${id}"] .seta-g`); if (sp) sp.textContent = ab ? '▾' : '▸';
  };
  el.querySelectorAll('tr.g').forEach(tr => tr.onclick = () => marcar(tr.dataset.g, !cfg.abertos.includes(tr.dataset.g)));
  $('#dreAbrir').onclick = () => DRE_GRUPOS.filter(g => !g.soma).forEach(g => marcar(g.id, true));
  $('#dreFechar').onclick = () => DRE_GRUPOS.filter(g => !g.soma).forEach(g => marcar(g.id, false));

// mesma lógica da planilha COMISSÕES: família da linha, vendedor creditado pelos "donos" da família, revenda pela tabela Ariana
function calcPerf(d) {
  const C = d.cfg, L = C.linhas || [], V = C.vendedores || [], donos = C.donos || {}, revendas = C.revendas || [], tab = C.tabela_revenda || {};
  const linhaDaFam = {}; L.forEach(l => l.familias.forEach(f => { linhaDaFam[f] = l.k; }));
  const vendDoId = {}; V.forEach(v => v.ids.forEach(id => { vendDoId[id.toUpperCase()] = v.nome; }));
  const creditado = (fam, id) => { const u = String(id || '').toUpperCase(), dn = donos[fam]; if (!dn) return u; return dn.validos.includes(u) ? u : (dn.padrao || u); };
  const M = {}, desc = {}, orig = {}, foraLinha = {}, foraVend = {};
  let descTot = 0, origTot = 0;
  for (const r of d.vendas) {
    const fam = famDe(r.linha), idc = creditado(fam, r.vendedor), vn = vendDoId[idc];
    const valor = r.revenda && revendas.includes(r.revenda) && r.cod_produto && tab[r.cod_produto] != null ? r.qtd * tab[r.cod_produto] : r.valor;
    descTot += r.desconto; origTot += r.venda_original;
    if (vn) { desc[vn] = (desc[vn] || 0) + r.desconto; orig[vn] = (orig[vn] || 0) + r.venda_original; }
    const lk = linhaDaFam[fam];
    if (!lk) { foraLinha[fam] = (foraLinha[fam] || 0) + valor; continue; }
    if (!vn) { const k = idc || '(sem vendedor)'; foraVend[k] = (foraVend[k] || 0) + valor; continue; }
    const o = M[lk] ||= {}; o[vn] = (o[vn] || 0) + valor;
  }
  const cel = (lk, v) => (M[lk] || {})[v] || 0;
  const totV = Object.fromEntries(V.map(v => [v.nome, L.reduce((t, l) => t + cel(l.k, v.nome), 0)]));
  const totL = Object.fromEntries(L.map(l => [l.k, V.reduce((t, v) => t + cel(l.k, v.nome), 0)]));
  const total = Object.values(totL).reduce((t, x) => t + x, 0);
  const metaTot = L.reduce((t, l) => t + (d.metas[l.k] || 0), 0);
  const nf = {}; let nfTotal = 0, nfVd = 0;
  for (const r of d.nfs) {
    nfTotal += r.total; nfVd += r.valordia;
    const vn = vendDoId[String(r.vendedor || '').toUpperCase()]; if (!vn) continue;
    const x = nf[vn] ||= { notas: 0, total: 0, vd: 0 }; x.notas += r.notas; x.total += r.total; x.vd += r.valordia;
  }
  const base = (v, lk) => lk === '*' ? totV[v] || 0 : cel(lk, v);
  const com = {}; for (const r of d.coms) com[r.beneficiario] = (com[r.beneficiario] || 0) + base(r.base, r.linha) * r.pct / 100;
  return { L, V, M, cel, totV, totL, total, metaTot, nf, nfTotal, nfVd, desc, orig, descTot, origTot, com, foraLinha, foraVend };
}

  </div>

  const ir = m => { est.perfMes = m; est.perfEditando = false; carregar(); };

// ---- cadastro de metas e % de comissão do mês
function formPerf(d, metas, coms) {
  const V = d.cfg.vendedores || [], prop = Object.fromEntries(V.map(v => [v.nome, {}])), cruz = [];

  return { metas: { ...metas }, prop, cruz };
}
function htmlEditorPerf(d, P) {

// totais do DRE por mês e grupo (sem provisões), para comparações e tendências
function serieDre(L) {
  const S = {};
  for (const r of L) {
    if (ehTransferencia(r.conta)) continue;
    const o = S[r.mes] ||= {}, v = sinalDre(r.conta) * r.valor, g = grupoDre(r.conta);
    o[g] = (o[g] || 0) + v;
    if (r.conta.startsWith('20.08.')) o.juros = (o.juros || 0) + v;
  }
  for (const o of Object.values(S)) for (const g of DRE_GRUPOS) if (g.soma) o[g.id] = g.soma.reduce((t, id) => t + (o[id] || 0), 0);
  return S;
}
function spark(vals) {
  const v = vals.map(x => isFinite(x) ? x : 0); if (v.length < 2) return '';
  const mn = Math.min(...v), mx = Math.max(...v), r = mx - mn || 1, w = 120, h = 30;
  const pts = v.map((x, i) => `${(i / (v.length - 1) * w).toFixed(1)},${(h - 3 - (x - mn) / r * (h - 6)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--s1)" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>`;
}
function renderIndicadores(el) {
  const X = est.dadosInd, L = X.dre, hoje = hojeISO();
  if (!L.length) { el.innerHTML = '<div class="card"><div class="vazio">Os indicadores aparecem depois da próxima atualização do sincronizador.</div></div>'; return; }
  const D = calcDre(L), S = serieDre(L);
  const ms = D.idxs.map(k => D.meses[k]), msAnt = ms.map(m => somaMes(m, -12)), u12 = D.ultimos(12), u3 = D.ultimos(3);
  const G = (meses, id) => meses.reduce((t, m) => t + ((S[m] || {})[id] || 0), 0);
  const rec = G(ms, 'rec'), recAnt = G(msAnt, 'rec');
  const card = (tit, val, det, sp) => `<div class="ind"><div class="ind-tit">${tit}</div><div class="ind-val">${val}</div><div class="ind-det">${det}</div>${sp || ''}</div>`;
  const pp = x => (x >= 0 ? '+' : '') + (x * 100).toFixed(1).replace('.', ',') + ' p.p.';
  const comp = (atual, ant, bomAlto, fmt) => {
    if (!isFinite(ant) || !ant && !atual) return '';
    const dif = atual - ant, bom = bomAlto ? dif > 0 : dif < 0;
    return ` · <span class="${Math.abs(dif) < 1e-9 ? '' : bom ? 'bom' : 'ruim'}">${fmt(dif)}</span> vs ano anterior`;
  };
  // ---- resultado (filtro do DRE)
  const cresc = recAnt ? rec / recAnt - 1 : NaN;
  const cards = [card('Faturamento', R0(rec), `média ${R0(ms.length ? rec / ms.length : 0)}/mês${isFinite(cresc) ? ` · <span class="${cresc >= 0 ? 'bom' : 'ruim'}">${cresc >= 0 ? '▲' : '▼'} ${pctTxt(Math.abs(cresc))}</span> vs ano anterior` : ''}`,
    spark(u12.map(m => (S[m] || {}).rec || 0)))];
  const IND = [
    ['CMV', 'cmv', -1, false], ['Carga tributária sobre vendas', 'imp', -1, false], ['Folha (RH)', 'rh', -1, false],
    ['Marketing', 'mkt', -1, false], ['Despesas operacionais', 'dop', -1, false], ['Margem de contribuição 2', 'mc2', 1, true],
    ['EBITDA', 'ebitda', 1, true], ['Lucro líquido', 'lucro', 1, true], ['Juros pagos', 'juros', -1, false],
  ];
  for (const [nome, id, sinal, bomAlto] of IND) {
    const pc = rec ? sinal * G(ms, id) / rec : 0, pcAnt = recAnt ? sinal * G(msAnt, id) / recAnt : NaN;
    cards.push(card(nome + ' % da receita', pctTxt(pc), `${R0(sinal * G(ms, id))} no período${comp(pc, pcAnt, bomAlto, pp)}`,
      spark(u12.map(m => { const o = S[m] || {}; return o.rec ? sinal * (o[id] || 0) / o.rec : 0; }))));
  }
  const mc2p = rec ? G(ms, 'mc2') / rec : 0, fixos = ms.length ? -G(ms, 'dop') / ms.length : 0;
  const pe = mc2p > 0 && fixos > 0 ? fixos / mc2p : 0, ms_ = pe ? (rec / ms.length) / pe - 1 : NaN;
  if (pe) cards.push(card('Margem de segurança', pctTxt(ms_), `faturamento médio vs ponto de equilíbrio (${R0(pe)}/mês)`,
    spark(u12.map(m => { const o = S[m] || {}, p = o.rec && o.mc2 > 0 ? -(o.dop || 0) / (o.mc2 / o.rec) : 0; return p ? o.rec / p - 1 : 0; }))));
  // ---- mix e margem por família
  const setMs = new Set(ms), fam = new Map();
  for (const r of L) {
    if (!setMs.has(r.mes) || !r.familia) continue;
    const tipo = r.conta === '10.01.01' ? 'rec' : r.conta === 'CMV' ? 'cmv' : r.conta.startsWith('20.12.') ? 'imp' : null;
    if (!tipo) continue;
    const f = famDe(r.familia), x = fam.get(f) || { rec: 0, imp: 0, cmv: 0 }; x[tipo] += r.valor; fam.set(f, x);
  }
  const fams = [...fam.entries()].filter(([, x]) => x.rec).sort((a, b) => b[1].rec - a[1].rec), recF = fams.reduce((t, [, x]) => t + x.rec, 0);
  // ---- hoje (fixo)
  const ab = X.abertos, cp = (est.contas.pagar || []).map(Number);
  const R = ab ? ab.filter(t => t.tipo === 'R') : [], P = ab ? ab.filter(t => t.tipo === 'P' && (!cp.length || cp.includes(Number(String(t.conta).split('.')[0])))) : [];
  const soma = l => l.reduce((t, x) => t + x.aberto, 0), totR = soma(R), venR = soma(R.filter(t => t.vencimento < hoje));
  const fat3 = G(u3, 'rec'), compras3 = -G(u3, 'compras');
  const fornec = soma(P.filter(t => String(t.conta).startsWith('20.02.')));
  const hj = [];
  if (X.saldos && X.saldos.length) {
    const ult = X.saldos.at(-1).data, oper = X.saldos.filter(r => !ehAplicacao(r.banco));
    const saldoHoje = oper.filter(r => r.data === ult).reduce((t, r) => t + r.saldo, 0);
    const dias = new Set(oper.map(r => r.data)).size || 1, saidaDia = oper.reduce((t, r) => t + r.saidas, 0) / dias;
    hj.push(card('Fôlego de caixa', saidaDia ? Math.round(saldoHoje / saidaDia) + ' dias' : '–', `saldo ${R0(saldoHoje)} ÷ saídas médias ${R0(saidaDia)}/dia (90 dias)`));
  }
  if (ab) {
    if (fat3) hj.push(card('PMR — prazo médio de recebimento', Math.round(totR / (fat3 / 90)) + ' dias', `a receber ${R0(totR)} ÷ faturamento médio diário (3 meses)`));
    if (compras3 > 0) hj.push(card('PMP — prazo médio de pagamento', Math.round(fornec / (compras3 / 90)) + ' dias', `fornecedores a pagar ${R0(fornec)} ÷ compras médias diárias (3 meses)`));
    hj.push(card('Inadimplência', pctTxt(totR ? venR / totR : 0), `vencido ${R0(venR)} de ${R0(totR)} a receber`));
    const cli = new Map(); for (const t of R) cli.set(t.cod || t.nome, (cli.get(t.cod || t.nome) || 0) + t.aberto);
    const top10 = [...cli.values()].sort((a, b) => b - a).slice(0, 10).reduce((t, v) => t + v, 0);
    hj.push(card('Concentração — 10 maiores clientes', pctTxt(totR ? top10 / totR : 0), `${R0(top10)} do total a receber (${inteiro.format(cli.size)} clientes)`));
  }
  if (X.movs && X.movs.length) {
    let v = 0, emDia = 0, atrasoP = 0;
    for (const m of X.movs) {
      const pg = m.dt_pagamento || m.dt_conciliacao; if (!m.vencimento || !pg) continue;
      const dd = Math.round((parseISO(pg) - parseISO(m.vencimento)) / 864e5);
      v += m.valor; if (dd <= 0) emDia += m.valor; atrasoP += Math.max(0, dd) * m.valor;
    }
    if (v) {
      hj.push(card('Pontualidade dos clientes', pctTxt(emDia / v), 'do valor recebido nos últimos 90 dias foi pago até o vencimento'));
      hj.push(card('Atraso médio no recebimento', (atrasoP / v).toFixed(1).replace('.', ',') + ' dias', 'média ponderada pelo valor, últimos 90 dias'));
    }
  }
  el.innerHTML = `
  <h3 class="secao">📊 Resultado <span class="tag filtro">📅 usa o filtro de período abaixo (o mesmo da aba DRE)${D.sepAt ? ' · sem o mês parcial' : ''}</span></h3>
  <div class="controles">${htmlPeriodoDre(D)}</div>
  ${!ms.length ? '<div class="vazio">Selecione pelo menos um mês fechado.</div>' : `<div class="inds">${cards.join('')}</div>
  <div class="card cheio">
    <h2>Mix e margem por família</h2>
    <div class="nota">Margem = receita − impostos da nota − CMV, no período selecionado</div>
    <div class="tabela-wrap rolagem"><table>
      <thead><tr><th>Família</th><th class="n">Receita</th><th class="n">Mix</th><th class="n opc">Impostos</th><th class="n opc">CMV</th><th class="n">Margem</th><th class="n">Margem %</th></tr></thead>
      <tbody>${fams.map(([f, x]) => { const mg = x.rec - x.imp - x.cmv; return `<tr><td>${esc(f)}</td><td class="n">${R0(x.rec)}</td><td class="n">${pctTxt(x.rec / recF)}</td>
        <td class="n opc">${R0(x.imp)}</td><td class="n opc">${R0(x.cmv)}</td><td class="n ${mg < 0 ? 'neg' : ''}">${R0(mg)}</td><td class="n">${pctTxt(mg / x.rec)}</td></tr>`; }).join('')}</tbody>
    </table></div>
  </div>`}
  <h3 class="secao">📍 Hoje <span class="tag fixo">posição atual · não muda com os filtros</span></h3>
  ${hj.length ? `<div class="inds">${hj.join('')}</div>` : '<div class="vazio">Sem dados de caixa/títulos para este usuário.</div>'}`;
  const re = () => { const y = window.scrollY; renderIndicadores(el); window.scrollTo(0, y); };
  ligarPeriodoDre(el, D, re);
}

// maiores clientes em atraso, com filtro de período pelo vencimento
function topAtrasoPeriodo() {

  if (!lista0) return null;
  const hoje = hojeISO(), per = est.periodoAtraso || 'todos';
  const desde = per === 'ano' ? hoje.slice(0, 4) + '-01-01'
    : per === '6m' ? (() => { const x = parseISO(hoje); x.setMonth(x.getMonth() - 6); return iso(x); })() : '';

  for (const t of lista0) {
    if (!(t.vencimento < hoje) || (desde && t.vencimento < desde)) continue;
    const k = t.cod || t.nome;
    const x = m.get(k) || { nome: t.nome || `Cliente ${t.cod}`, qtd: 0, valor: 0, dias: 0 };

    m.set(k, x);
  }
  return [...m.values()].sort((a, b) => b.valor - a.valor).slice(0, 15);
}

function gerarDemoDia(dia, base) {
  const ini = somaDias(dia, -60);
  const todos = gerarDemo(ini, dia, est.empresas).bancos.filter(r => r[2] === dia);
  const clientes = ['Mercado Bom Preço', 'Construtora Horizonte', 'Distribuidora Sul', 'Padaria Real', 'Hotel Mirante',
    'Clínica Vida', 'Escola Saber', 'Auto Peças Leste', 'Loja do Bairro', 'Transportes Rápido', 'Farmácia Central', 'Restaurante Sabor'];
  const fornecedores = ['Energia Elétrica', 'Atacadão Alimentos', 'Folha de pagamento', 'Aluguel Matriz', 'Simples Nacional',
    'Fornecedor de Embalagens', 'Telefonia e Internet', 'Manutenção Predial', 'Combustível', 'Contabilidade'];
  let sem = Number(dia.replace(/-/g, '')) % 997 + 3;
  const rnd = () => (sem = (sem * 16807) % 2147483647) / 2147483647;
  const movimentos = [];
  const quebrar = (total, tipo, e, b) => {
    let resto = total;
    const partes = total > 0 ? 1 + Math.floor(rnd() * 4) : 0;
    for (let i = 0; i < partes; i++) {
      const v = i === partes - 1 ? resto : Math.round(resto * (0.25 + rnd() * 0.4));
      resto -= v;
      const nomes = tipo === 'R' ? clientes : fornecedores;
      movimentos.push({ tipo, emp: e, banco: b, titulo: 10000 + Math.floor(rnd() * 9000), parcela: 1 + Math.floor(rnd() * 3),
        cod: 100 + Math.floor(rnd() * 900), nome: nomes[Math.floor(rnd() * nomes.length)],
        vencimento: somaDias(dia, -Math.floor(rnd() * 12)), conta: tipo === 'R' ? '10.1' : ['20.1', '20.3', '21.2'][Math.floor(rnd() * 3)], valor: v });
    }
  };
  for (const [e, b, , , ent, sai] of todos) { quebrar(ent, 'R', e, b); quebrar(sai, 'P', e, b); }
  movimentos.sort((a, b) => a.tipo.localeCompare(b.tipo) || b.valor - a.valor);
  return { atualizadoEm: new Date().toISOString(), dia, base, bancos: todos.map(r => [r[0], r[1], r[3], r[4], r[5]]), movimentos };
}

// ======================= fluxo de caixa projetado =======================
function gerarDemoProj(dias) {
  const hoje = hojeISO(), ate = somaDias(hoje, dias);
  const k = est.empresas.reduce((s, e) => s + (e === 1 ? 1 : 0.45), 0);
  const saldoHoje = gerarDemo(somaDias(hoje, -60), hoje, est.empresas).bancos.filter(r => r[2] === hoje).reduce((s, r) => s + r[3], 0);
  let sem = 11;
  const rnd = () => (sem = (sem * 16807) % 2147483647) / 2147483647;
  const receber = [[null, Math.round(78 * k), Math.round(389600 * k)]], pagar = [[null, Math.round(9 * k), Math.round(61300 * k)]];
  for (let d = hoje; d <= ate; d = somaDias(d, 1)) {
    const dt = parseISO(d), dow = dt.getDay(), dm = dt.getDate();
    if (dow === 0 || dow === 6) continue;
    const fator = Math.max(0.15, 1 - (parseISO(d) - parseISO(hoje)) / 864e5 / (dias * 1.4)); // menos títulos lançados no futuro distante
    receber.push([d, 3, Math.round(k * fator * (14000 + rnd() * 30000))]);
    let p = k * (6000 + rnd() * 20000);
    if (dm >= 5 && dm <= 7 && dow === 1 || dm === 5) p += k * 160000;   // folha
    if (dm === 20) p += k * 95000;                                       // impostos
    if (dm === 10) p += k * 38000;                                       // aluguel
    pagar.push([d, 4, Math.round(p)]);
  }
  return { atualizadoEm: new Date().toISOString(), hoje, ate, saldoHoje, receber, pagar };
}

function calcularProj() {
  const d = est.dadosProj;
  const mapa = lista => { const m = new Map(); for (const [dt, , v] of lista) if (dt) m.set(dt, (m.get(dt) || 0) + v); return m; };
  const imps = importacoesNoFluxo(d.hoje, d.ate);
  const impLinhas = imps.map(i => [i.previsao < d.hoje ? null : i.previsao, 1, valorImp(i)]);
  const pagarTudo = d.pagar.concat(impLinhas);
  const mr = mapa(d.receber), mp = mapa(pagarTudo), mi = mapa(impLinhas);
  const vencImp = impLinhas.filter(r => !r[0]).reduce((s, r) => s + r[2], 0);
  const vencRec = d.receber.filter(r => !r[0]).reduce((s, r) => s + r[2], 0);
  const vencRecQtd = d.receber.filter(r => !r[0]).reduce((s, r) => s + r[1], 0);
  const vencPag = pagarTudo.filter(r => !r[0]).reduce((s, r) => s + r[2], 0);
  const vencPagQtd = pagarTudo.filter(r => !r[0]).reduce((s, r) => s + r[1], 0);
  const totImp = impLinhas.reduce((s, r) => s + r[2], 0);
  const dias = [];
  let saldo = d.saldoHoje;
  for (let dt = d.hoje; dt <= d.ate; dt = somaDias(dt, 1)) {
    let ent = mr.get(dt) || 0, sai = mp.get(dt) || 0, imp = mi.get(dt) || 0;
    if (est.inclVencidos && dt === d.hoje) { ent += vencRec; sai += vencPag; imp += vencImp; }
    saldo += ent - sai;
    dias.push({ dt, ent, sai, imp, saldo });   // sai = títulos + importações; imp = só importações
  }
  const menor = dias.reduce((m, x) => x.saldo < m.saldo ? x : m, dias[0] || { saldo: d.saldoHoje, dt: d.hoje });
  const primeiroNeg = dias.find(x => x.saldo < 0);
  return { dias, menor, primeiroNeg, vencRec, vencRecQtd, vencPag, vencPagQtd, imps, totImp,
    ent: dias.reduce((s, x) => s + x.ent, 0), sai: dias.reduce((s, x) => s + x.sai, 0), imp: dias.reduce((s, x) => s + x.imp, 0) };
}

function renderProj(el) {
  const d = est.dadosProj, p = calcularProj();
  const fim = p.dias.at(-1) || { saldo: d.saldoHoje, dt: d.ate };
  const semanal = est.horizonte > 62;
  // agrupar por semana (segunda-feira)
  const semana = s => { const x = parseISO(s); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return iso(x); };
  const grupos = new Map();
  for (const x of p.dias) {
    const k = semanal ? semana(x.dt) : x.dt;
    const g = grupos.get(k) || { k, ent: 0, sai: 0, imp: 0, saldo: 0, menor: Infinity };
    g.ent += x.ent; g.sai += x.sai; g.imp += x.imp; g.saldo = x.saldo; g.menor = Math.min(g.menor, x.saldo);
    grupos.set(k, g);
  }
  const gs = [...grupos.values()];
  const tabSem = new Map();
  for (const x of p.dias) {
    const k = semana(x.dt);

    ${kpi(p.menor.saldo < 0 ? '⚠ Menor saldo previsto' : 'Menor saldo previsto', R0(p.menor.saldo),
        p.primeiroNeg ? `fica negativo a partir de ${ddmmaa(p.primeiroNeg.dt)}` : `em ${ddmmaa(p.menor.dt)}`, p.menor.saldo < 0 ? 'alerta' : '')}

  <div class="grade">
    <div class="card cheio">
      <h2>Saldo projetado</h2>

      <div class="grafico" id="gProj"></div>
    </div>

      <div class="grafico" id="gProjBar"></div>
    </div>
    ${temArea('importacoes') ? `<div class="card cheio">
      <div class="controles" style="margin-bottom:4px"><h2 style="margin-right:auto">Importações no fluxo</h2>
        <span class="rot">Câmbio para projetar as parcelas em US$:</span>
        <label class="rot"><input type="radio" name="camModo" value="manual" ${est.cambio.modo !== 'ptax' ? 'checked' : ''}> Manual</label>
        <input type="text" inputmode="decimal" id="camManual" value="${Number(est.cambio.manual || 0).toLocaleString('pt-BR', { minimumFractionDigits: 4 })}" style="width:90px;font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)">
        <label class="rot"><input type="radio" name="camModo" value="ptax" ${est.cambio.modo === 'ptax' ? 'checked' : ''}> PTAX${est.ptax && est.ptax.valor ? ' ' + Number(est.ptax.valor).toLocaleString('pt-BR', { minimumFractionDigits: 4 }) : ''}</label>
        ${podeEditar() ? '<button id="camSalvar">Salvar câmbio</button>' : ''}<span class="msg-ok" id="camMsg" style="margin:0"></span>
      </div>
      <div class="nota">Pagamentos marcados "No fluxo" nos processos do módulo Importações, ainda não pagos. Parcelas em US$ são projetadas pelo câmbio ao lado (${est.cambio.modo === 'ptax' ? 'PTAX' : 'manual'}: ${cambioAtual().toLocaleString('pt-BR', { minimumFractionDigits: 4 })}). Depois de pago, o valor vem do ERP. Alterar a data aqui altera o processo.</div>
      <div class="tabela-wrap"><table>
        <thead><tr><th>Previsão</th><th>Empresa</th><th>Tipo</th><th>Fornecedor</th><th>Pedido</th><th class="n">US$</th><th class="n">Taxa</th><th class="n">Valor</th><th></th></tr></thead>
        <tbody>${p.imps.length ? p.imps.map(i => `<tr>
          <td>${i.modulo && podeEditar() ? `<input type="date" class="imp-data" data-impc="${i.id}" value="${i.previsao}" style="font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text)">` : ddmmaa(i.previsao)}${i.previsao < d.hoje ? ' <span class="selo">atrasada</span>' : ''}</td>

          <td class="n">${i.valor_usd ? usd.format(i.valor_usd) : ''}</td><td class="n">${i.taxa ? i.taxa.toLocaleString('pt-BR', { minimumFractionDigits: 4 }) : ''}</td>
          <td class="n">${R(valorImp(i))}</td>
          <td>${i.modulo ? `<button data-impp="${i.processo_id}">Abrir processo</button>` : ''}</td></tr>`).join('')
          : '<tr><td colspan="9" class="vazio">Nenhum pagamento de importação no fluxo. Marque "No fluxo" nos pagamentos do processo (aba Importações).</td></tr>'}
        ${p.imps.length ? `<tr class="total"><td colspan="7">Total</td><td class="n">${R(p.totImp)}</td><td></td></tr>` : ''}</tbody>
      </table></div>
      <div class="msg-erro" id="impDataErro"></div>

    <div class="card cheio">
      <h2>Semana a semana</h2>
      <div class="tabela-wrap"><table>
        <thead><tr><th>Semana de</th><th class="n">Entradas</th><th class="n">Saídas</th>${temArea('importacoes') ? '<th class="n">Importações</th>' : ''}<th class="n">Resultado</th><th class="n">Menor saldo</th><th class="n">Saldo no fim</th></tr></thead>
        <tbody>${[...tabSem.values()].map(g => `<tr><td>${ddmmaa(g.k < d.hoje ? d.hoje : g.k)}</td><td class="n">${R(g.ent)}</td><td class="n">${R(g.sai - g.imp)}</td>${temArea('importacoes') ? `<td class="n">${g.imp ? R(g.imp) : '—'}</td>` : ''}
          <td class="n ${g.ent - g.sai < 0 ? 'neg' : ''}">${R(g.ent - g.sai)}</td><td class="n ${g.menor < 0 ? 'neg' : ''}">${R(g.menor)}</td><td class="n ${g.saldo < 0 ? 'neg' : ''}"><b>${R(g.saldo)}</b></td></tr>`).join('')}</tbody>

    <div class="card cheio">
